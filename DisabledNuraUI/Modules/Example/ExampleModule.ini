namespace = NuraUI2\Modules\Example

[Constants]
global $nura_ui_example_module_id = 4097
global $nura_ui_example_module_slot = 32
global $nura_ui_example_module_registered = 0
global $nura_ui_example_module_open = 0

[ResourceNuraUIModuleExampleSlot]
type = RWBuffer
format = R32_FLOAT
array = 1

[KeyNuraUIModuleExampleToggle]
condition = $nura_ui_example_module_registered == 1
key = ctrl alt VK_F5
type = toggle
$nura_ui_example_module_open = 1

[Present]
if $nura_ui_example_module_registered == 0
    run = CommandListNuraUIExampleRegister
endif
if $nura_ui_example_module_open == 1
    run = CommandListNuraUIExampleFrame
endif

[CommandListNuraUIExampleRegister]
local $nura_ui_example_prev_x68 = x68
x68 = $nura_ui_example_module_id
run = CustomShaderNuraUIExampleRegister
x68 = $nura_ui_example_prev_x68
store = $nura_ui_example_module_slot, ResourceNuraUIModuleExampleSlot, 0
if $nura_ui_example_module_slot < 32
    $nura_ui_example_module_registered = 1
endif

[CustomShaderNuraUIExampleRegister]
cs = ..\..\Core\NuraUIModuleRegister.hlsl
cs-u0 = Resource\NuraUI2\NuraUIModuleRegistry
cs-u1 = ResourceNuraUIModuleExampleSlot
dispatch = 1, 1, 1
cs-u0 = null
cs-u1 = null

[CommandListNuraUIExampleFrame]
run = CustomShaderNuraUIExamplePanel
run = CommandListNuraUIExampleText

[CustomShaderNuraUIExamplePanel]
local $nura_ui_example_prev_x31 = x31
local $nura_ui_example_prev_y31 = y31
local $nura_ui_example_prev_z31 = z31
local $nura_ui_example_prev_w31 = w31
vs = ExampleModule.hlsl
ps = ExampleModule.hlsl
ps-t0 = ResourceNuraUIModuleExampleSlot
x31 = cursor_window_x
y31 = cursor_window_y
z31 = window_width
w31 = window_height
cull = none
topology = triangle_strip
blend = ADD SRC_ALPHA INV_SRC_ALPHA
depth_enable = FALSE
o0 = set_viewport bb
draw = 4, 0
ps-t0 = null
x31 = $nura_ui_example_prev_x31
y31 = $nura_ui_example_prev_y31
z31 = $nura_ui_example_prev_z31
w31 = $nura_ui_example_prev_w31

[CommandListNuraUIExampleText]
Resource\NuraThings\Print\Custom\Font = Resource\NuraThings\Print\Custom\PixelFont
Resource\NuraThings\Print\Custom\Text = ref ResourceNuraUIExampleTitle
Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraUIExampleTitleParams
run = CommandList\NuraThings\Print\Custom\PrintTextMSDF
Resource\NuraThings\Print\Custom\Text = ref ResourceNuraUIExampleSubtitle
Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraUIExampleSubtitleParams
run = CommandList\NuraThings\Print\Custom\PrintTextMSDF
Resource\NuraThings\Print\Custom\Font = Resource\NuraThings\Print\Custom\DefaultFont

[ResourceNuraUIExampleTitle]
type = Buffer
data = "DROP-IN MODULE OK"

[ResourceNuraUIExampleTitleParams]
type = StructuredBuffer
array = 1
data = R32_FLOAT  -0.42 +0.10 +0.42 +0.03   0.00 0.82 1.00 1.00   0 0 0 0   0 0   1 1   0   2.5

[ResourceNuraUIExampleSubtitle]
type = Buffer
data = "REGISTRY + HLSLI API ONLINE"

[ResourceNuraUIExampleSubtitleParams]
type = StructuredBuffer
array = 1
data = R32_FLOAT  -0.48 -0.03 +0.48 -0.10   0.70 0.82 0.90 1.00   0 0 0 0   0 0   1 1   0   1.65
