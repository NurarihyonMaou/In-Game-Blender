namespace = NuraUI

; ============================================================================*
; NuraThings UI CORE - FIRST PROTOTYPE*

; ============================================================================*
;*
; GPU-side menu shell + GPU-side mouse hit testing.*
; Only F8 and LMB are Key sections; the menu itself does not consume one*
; KeyBind per button.*
;*
; UIState layout:*
;   [0] page*
;   [1] mesh tool*
;   [2] previous LMB*
;   [3] hover id*
;   [4] clicked id*
;   [5] mirror*
;   [6] invert*
;*

; ============================================================================*

[Constants]

; UI CORE
global $nt_ui = 0
global $nt_ui_lmb = 0
global $nt_ui_initialized = 0
global $nt_ui_init = 0
global $nt_overlay = 0

; Drop-in module browser: one-time Core support; future modules do not edit these files.
global $nt_module_scroll = 0
global $nt_module_browser_active = 0

; Weight Paint VG list: scroll is passed into the input shader through IniParams[118].x.
global $nt_weight_vg_list_scroll = 0
global $nt_weight_vg_list_open = 0
global $nt_weight_vg_list_hover = 0

; KeyBind Manager action dropdown (scroll is forwarded through IniParams[119].x).
global $nt_kbm_action_list_scroll = 0
global $nt_kbm_action_list_open = 0
global $nt_kbm_action_list_hover = 0

; MASK RENAME / INPUT ROUTING
global $nt_mask_rename_active = 0
global $nt_mask_rename_slot = 0
global $nt_mask_name_cursor = 0
global $nt_mask_rename_char = 0
global $nt_mask_name_prev_detect_keys = 0

; JIGGLE UI — SELECTION AND CONTROLS
global persist $nt_jiggle_group_selected = 0
global $nt_jiggle_ui_enabled = 0
global $nt_jiggle_ui_tab = 0
