; ============================================================================
; HISTORY POOLS
; ============================================================================

[PoolMeshEditorStroke]
pool_size = ($mesh_editor_strokes_limit * 8)
pool_persist_variables = true

[PoolMeshEditorDab]
pool_size = ($mesh_editor_dabs_limit * 5)
pool_persist_variables = true

; Three per-stroke values: paint mode, target weight, falloff mode.
; Existing Stroke fields +3/+7 are reused for VG ID / mode only for tool 15.
[PoolMeshEditorWeightStrokeSettings]
pool_size = ($mesh_editor_strokes_limit * 3)
pool_persist_variables = true

; ============================================================================
; CLEAR HISTORY
; ============================================================================

[KeyClearPool]
condition = $\NuraUI\nt_mask_rename_active == 0
key = VK_CONTROL X
run = CommandListClearMeshEditorHistory

[CommandListClearMeshEditorHistory]
clear = ResourceMeshEditorNamedMasks
clear = ResourceMeshEditorMask
clear = ResourceMeshEditorCombinedMask

$PoolMeshEditorStrokeMaskFlags[*] = Null
$PoolMeshEditorStrokeMaskFlagsValid[*] = Null

$PoolMeshEditorStroke[*] = Null
$PoolMeshEditorDab[*] = Null
$PoolMeshEditorWeightStrokeSettings[*] = Null

ResourceMeshEditorEditableBlend = copy ResourceKamisatoAyakaBlend

$mesh_editor_current_stroke = 0
$mesh_editor_max_stroke = 0
$mesh_editor_current_dab = 0

$mesh_editor_stroke_active = 0
$mesh_editor_active_tool = 0
$mesh_editor_active_vertex = -1
$mesh_editor_stroke_dab_start = 0
$mesh_editor_stroke_dab_count = 0
$mesh_editor_grab_commit_pending = 0

$mesh_editor_restore_active = 0
$mesh_editor_restore_stroke = 0
$mesh_editor_restore_dab = 0

clear = ResourceMeshEditorState
clear = ResourceMeshEditorVertexDelta

clear = ResourceMeshEditorMask

ResourceWritablePosition = copy ResourceKamisatoAyakaPosition

; ============================================================================
; UNDO
; ============================================================================

[KeyUndoStep]
condition = $\NuraUI\nt_mask_rename_active == 0
key = NO_VK_ALT NO_VK_SHIFT VK_CONTROL Z
run = CommandListMeshEditorUndo

; ============================================================================
; UNDO / REDO / REPLAY
; ============================================================================

[CommandListMeshEditorUndo]
if $mesh_editor_current_stroke > 0
    local $UndoStrokeIndex
    local $UndoStrokeTool
    local $UndoMaskSlot

    $UndoStrokeIndex = $mesh_editor_current_stroke - 1
    $UndoStrokeTool = $PoolMeshEditorStroke[$UndoStrokeIndex * 8 + 2]
    $UndoMaskSlot = $PoolMeshEditorStroke[$UndoStrokeIndex * 8 + 7]

    if $UndoStrokeTool >= 7 && $UndoStrokeTool <= 14
        $mesh_editor_active_mask_slot = $UndoMaskSlot
    endif

    $mesh_editor_current_stroke = $mesh_editor_current_stroke - 1
    run = CommandListMeshEditorSetCurrentDab
    run = CommandListMeshEditorStartRestore
endif

; ============================================================================
; REDO
; ============================================================================

[KeyReDoStep]
condition = $\NuraUI\nt_mask_rename_active == 0
key = NO_VK_ALT NO_VK_SHIFT VK_CONTROL Y
run = CommandListMeshEditorReDo

[KeyReDoStepAlt]
condition = $\NuraUI\nt_mask_rename_active == 0
key = VK_CONTROL VK_SHIFT Z
run = CommandListMeshEditorReDo

[CommandListMeshEditorRedo]
if $mesh_editor_current_stroke < $mesh_editor_max_stroke
    local $RedoStrokeIndex
    local $RedoStrokeTool
    local $RedoMaskSlot

    $RedoStrokeIndex = $mesh_editor_current_stroke
    $RedoStrokeTool = $PoolMeshEditorStroke[$RedoStrokeIndex * 8 + 2]
    $RedoMaskSlot = $PoolMeshEditorStroke[$RedoStrokeIndex * 8 + 7]

    if $RedoStrokeTool >= 7 && $RedoStrokeTool <= 14
        $mesh_editor_active_mask_slot = $RedoMaskSlot
    endif

    $mesh_editor_current_stroke = $mesh_editor_current_stroke + 1
    run = CommandListMeshEditorSetCurrentDab
    run = CommandListMeshEditorStartRestore
endif

; ============================================================================
; BEGIN RESTORE
; ============================================================================

[CommandListMeshEditorSetCurrentDab]
if $mesh_editor_current_stroke > 0
    $mesh_editor_current_dab = $PoolMeshEditorStroke[($mesh_editor_current_stroke - 1) * 8 + 0] + $PoolMeshEditorStroke[($mesh_editor_current_stroke - 1) * 8 + 1]
else
    $mesh_editor_current_dab = 0
endif

[CommandListMeshEditorStartRestore]
$mesh_editor_lmb = 0
$mesh_editor_stroke_active = 0
$mesh_editor_active_tool = 0
clear = ResourceMeshEditorMask
clear = ResourceMeshEditorNamedMasks
clear = ResourceMeshEditorState
clear = ResourceMeshEditorVertexDelta
clear = ResourceMeshEditorCombinedMask
ResourceWritablePosition = copy ResourceKamisatoAyakaPosition
ResourceMeshEditorEditableBlend = copy ResourceKamisatoAyakaBlend
$mesh_editor_restore_stroke = 0
$mesh_editor_restore_dab = 0
if $mesh_editor_current_stroke > 0
    $mesh_editor_restore_active = 1
else
    $mesh_editor_restore_active = 0
endif

[CommandListMeshEditorBeginRestore]
run = CommandListMeshEditorStartRestore

[CommandListMeshEditorRestoreBatch1]

run = CommandListMeshEditorRestoreOne
run = CommandListMeshEditorRestoreOne
run = CommandListMeshEditorRestoreOne
