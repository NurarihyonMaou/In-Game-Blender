namespace = NuraThings\TextureManipulator

[Constants]
global $hue_center
global $hue_range
global $tint_strength
; 0 -> Hue Range | 1 -> Texture Mask
global $mask_mode

global $texture_width = 2048
global $texture_height = 1024


[CustomShaderModifyTexture]
cs = Mods/BufferValues/NuraThings/Shaders/TextureManipulator.hlsl

local $x92 = x92
local $y92 = y92
local $z92 = z92
local $w92 = w92
local $w91 = w91

cs-u0 = ResourceVirtualTexture
cs-t1 = Resource\NuraThings\ColorPicker\StoreColors
cs-u1 = Resource\NuraThings\ColorPicker\SomeBuffer

x92 = $hue_center
y92 = $hue_range
z92 = $mask_mode
w92 = $tint_strength
w91 = $\NuraThings\ColorPicker\selector_type

if $texture_width > 0 && $texture_height > 0
    dispatch = $texture_width//16, $texture_height//16, 1
endif

x92 = $x92
y92 = $y92
z92 = $z92
w92 = $w92
w91 = $w91

cs-t0 = null
cs-u0 = null
cs-t1 = null
cs-t2 = null
cs-u1 = null

[ResourceVirtualTexture]
type = RWTexture2D
format = R32G32B32A32_FLOAT
