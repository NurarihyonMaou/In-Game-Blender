    store = $X, ResourceMeshEditorState, 44
    store = $Y, ResourceMeshEditorState, 45
    store = $Z, ResourceMeshEditorState, 46

    $StartValid = $PoolMeshEditorWeightGradientSettings[$mesh_editor_current_stroke * 9 + 8]
