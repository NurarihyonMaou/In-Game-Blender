        $mesh_editor_current_stroke = $mesh_editor_current_stroke + 1

        if $mesh_editor_current_stroke > $mesh_editor_max_stroke
            $mesh_editor_max_stroke = $mesh_editor_current_stroke
        endif
    else
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 0] = 0
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 1] = 0
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 2] = 0
