store = $Valid, ResourceMeshEditorState, 71

if $Valid > 0.5
    ; The GPU capture shader writes the current valid surface point to state[17].
    ; Store it every held frame so Gradient keeps the most recent valid endpoint,
    ; even if the cursor briefly leaves the surface before release.
    store = $X, ResourceMeshEditorState, 68
    store = $Y, ResourceMeshEditorState, 69
    store = $Z, ResourceMeshEditorState, 70

    if $mesh_editor_active_weight_mode == 4
        $PoolMeshEditorWeightGradient[$mesh_editor_current_stroke * 4 + 0] = $X
        $PoolMeshEditorWeightGradient[$mesh_editor_current_stroke * 4 + 1] = $Y
        $PoolMeshEditorWeightGradient[$mesh_editor_current_stroke * 4 + 2] = $Z
        $PoolMeshEditorWeightGradient[$mesh_editor_current_stroke * 4 + 3] = 1

        ; Gradient is one logical stroke: store one dab (the fixed start point)
        ; and update only the endpoint above for the remainder of the drag.
        if $mesh_editor_stroke_dab_count == 0 && $mesh_editor_current_dab < $mesh_editor_dabs_limit
            $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 0] = $X
            $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 1] = $Y
            $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 2] = $Z
            $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 3] = $mesh_editor_weight_strength
            $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 4] = $falloff_radius
            $mesh_editor_current_dab = $mesh_editor_current_dab + 1
            $mesh_editor_stroke_dab_count = 1
            $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 1] = 1
        endif
    elif $mesh_editor_current_dab < $mesh_editor_dabs_limit
        $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 0] = $X
        $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 1] = $Y
        $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 2] = $Z
        $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 3] = $mesh_editor_weight_strength
        $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 4] = $falloff_radius
        $mesh_editor_current_dab = $mesh_editor_current_dab + 1
        $mesh_editor_stroke_dab_count = $mesh_editor_stroke_dab_count + 1
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 1] = $mesh_editor_stroke_dab_count
    endif
endif

[CommandListMeshEditorRecordSmoothDab]

local $DabValid
local $X
local $Y
local $Z

store = $DabValid, ResourceMeshEditorState, 63

if $DabValid > 0.5
    store = $X, ResourceMeshEditorState, 60
    store = $Y, ResourceMeshEditorState, 61
    store = $Z, ResourceMeshEditorState, 62

    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 0] = $X
    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 1] = $Y
    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 2] = $Z
    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 3] = $mesh_editor_smooth_strength
    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 4] = $falloff_radius

    $mesh_editor_current_dab = $mesh_editor_current_dab + 1
    $mesh_editor_stroke_dab_count = $mesh_editor_stroke_dab_count + 1
    $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 1] = $mesh_editor_stroke_dab_count
endif

; ============================================================================
; HISTORY POOLS
; ============================================================================

[PoolMeshEditorStroke]
pool_size = ($mesh_editor_strokes_limit * 8)
pool_persist_variables = true

[PoolMeshEditorDab]
pool_size = ($mesh_editor_dabs_limit * 5)
pool_persist_variables = true

; Three per-stroke values: paint mode, target weight, falloff mode.
; Existing Stroke fields +3/+7 are reused for VG ID / mode only for tool 15.
[PoolMeshEditorWeightStrokeSettings]
pool_size = ($mesh_editor_strokes_limit * 3)
pool_persist_variables = true

; 5 scalar values/event: operation, element mode, v0, v1, v2.
; Operations: 0 = replace, 1 = toggle, 2 = clear.
[PoolMeshEditorSelectionHistory]
pool_size = ($mesh_editor_selection_history_limit * 5)
pool_persist_variables = true

; ============================================================================
; CLEAR HISTORY
; ============================================================================

[KeyClearPool]
condition = ($mesh_editor_move_active == 0) && $\NuraUI\nt_mask_rename_active == 0
key = VK_CONTROL X
run = CommandListClearMeshEditorHistory

[CommandListClearMeshEditorHistory]
clear = ResourceMeshEditorNamedMasks
clear = ResourceMeshEditorMask
clear = ResourceMeshEditorCombinedMask

$PoolMeshEditorStrokeMaskFlags[*] = Null
$PoolMeshEditorStrokeMaskFlagsValid[*] = Null

$PoolMeshEditorStroke[*] = Null
$PoolMeshEditorDab[*] = Null
$PoolMeshEditorWeightStrokeSettings[*] = Null

ResourceMeshEditorEditableBlend = copy ResourceKamisatoAyakaBlend

$mesh_editor_current_stroke = 0
$mesh_editor_max_stroke = 0
$mesh_editor_current_dab = 0

$mesh_editor_stroke_active = 0
$mesh_editor_active_tool = 0
$mesh_editor_active_vertex = -1
$mesh_editor_stroke_dab_start = 0
$mesh_editor_stroke_dab_count = 0
$mesh_editor_grab_commit_pending = 0

$mesh_editor_restore_active = 0
$mesh_editor_restore_stroke = 0
$mesh_editor_restore_dab = 0

clear = ResourceMeshEditorState
clear = ResourceMeshEditorVertexDelta

clear = ResourceMeshEditorMask

ResourceWritablePosition = copy ResourceKamisatoAyakaPosition

; ============================================================================
; UNDO
; ============================================================================

[KeyUndoStep]
condition = $mesh_editor_key_gate_history == 1
key = NO_VK_ALT NO_VK_SHIFT VK_CONTROL Z
run = CommandListMeshEditorUndo

; ============================================================================
; UNDO / REDO / REPLAY
; ============================================================================

[CommandListMeshEditorUndo]
if $mesh_editor_current_stroke > 0
    local $UndoStrokeIndex
    local $UndoStrokeTool
    local $UndoMaskSlot

    $UndoStrokeIndex = $mesh_editor_current_stroke - 1
    $UndoStrokeTool = $PoolMeshEditorStroke[$UndoStrokeIndex * 8 + 2]
    $UndoMaskSlot = $PoolMeshEditorStroke[$UndoStrokeIndex * 8 + 7]

    if $UndoStrokeTool >= 7 && $UndoStrokeTool <= 14
        $mesh_editor_active_mask_slot = $UndoMaskSlot
    endif

    $mesh_editor_current_stroke = $mesh_editor_current_stroke - 1
    run = CommandListMeshEditorSetCurrentDab
    run = CommandListMeshEditorStartRestore
endif

; ============================================================================
; REDO
; ============================================================================

[KeyReDoStep]
condition = $mesh_editor_key_gate_history == 1
key = NO_VK_ALT NO_VK_SHIFT VK_CONTROL Y
run = CommandListMeshEditorReDo

[KeyReDoStepAlt]
condition = $mesh_editor_key_gate_history == 1
key = VK_CONTROL VK_SHIFT Z
run = CommandListMeshEditorReDo

[CommandListMeshEditorRedo]
if $mesh_editor_current_stroke < $mesh_editor_max_stroke
    local $RedoStrokeIndex
    local $RedoStrokeTool
    local $RedoMaskSlot

    $RedoStrokeIndex = $mesh_editor_current_stroke
    $RedoStrokeTool = $PoolMeshEditorStroke[$RedoStrokeIndex * 8 + 2]
    $RedoMaskSlot = $PoolMeshEditorStroke[$RedoStrokeIndex * 8 + 7]

    if $RedoStrokeTool >= 7 && $RedoStrokeTool <= 14
        $mesh_editor_active_mask_slot = $RedoMaskSlot
    endif

    $mesh_editor_current_stroke = $mesh_editor_current_stroke + 1
    run = CommandListMeshEditorSetCurrentDab
    run = CommandListMeshEditorStartRestore
endif

; ============================================================================
; BEGIN RESTORE
; ============================================================================

[CommandListMeshEditorSetCurrentDab]
if $mesh_editor_current_stroke > 0
    $mesh_editor_current_dab = $PoolMeshEditorStroke[($mesh_editor_current_stroke - 1) * 8 + 0] + $PoolMeshEditorStroke[($mesh_editor_current_stroke - 1) * 8 + 1]
else
    $mesh_editor_current_dab = 0
endif

[CommandListMeshEditorStartRestore]
$mesh_editor_lmb = 0
$mesh_editor_stroke_active = 0
$mesh_editor_active_tool = 0
clear = ResourceMeshEditorMask
clear = ResourceMeshEditorNamedMasks
clear = ResourceMeshEditorState
clear = ResourceMeshEditorVertexDelta
clear = ResourceMeshEditorCombinedMask
ResourceWritablePosition = copy ResourceKamisatoAyakaPosition
ResourceMeshEditorEditableBlend = copy ResourceKamisatoAyakaBlend
$mesh_editor_restore_stroke = 0
$mesh_editor_restore_dab = 0
$mesh_editor_selection_replay_cursor = 0
$mesh_editor_selection_replay_target = 0
run = CommandListMeshEditorResetSelectionGPU
if $mesh_editor_current_stroke > 0 || $mesh_editor_selection_event_count > 0
    $mesh_editor_restore_active = 1
else
    $mesh_editor_restore_active = 0
endif

[CommandListMeshEditorBeginRestore]
run = CommandListMeshEditorStartRestore

[CommandListMeshEditorRestoreBatch1]

run = CommandListMeshEditorRestoreOne
run = CommandListMeshEditorRestoreOne
run = CommandListMeshEditorRestoreOne
run = CommandListMeshEditorRestoreOne
run = CommandListMeshEditorRestoreOne
run = CommandListMeshEditorRestoreOne
run = CommandListMeshEditorRestoreOne
run = CommandListMeshEditorRestoreOne

[CommandListMeshEditorRestoreBatch2]

run = CommandListMeshEditorRestoreBatch1
run = CommandListMeshEditorRestoreBatch1
run = CommandListMeshEditorRestoreBatch1
run = CommandListMeshEditorRestoreBatch1
run = CommandListMeshEditorRestoreBatch1
run = CommandListMeshEditorRestoreBatch1
run = CommandListMeshEditorRestoreBatch1
run = CommandListMeshEditorRestoreBatch1

[CommandListMeshEditorRestoreBatch3]

run = CommandListMeshEditorRestoreBatch2
run = CommandListMeshEditorRestoreBatch2
run = CommandListMeshEditorRestoreBatch2
run = CommandListMeshEditorRestoreBatch2
run = CommandListMeshEditorRestoreBatch2
run = CommandListMeshEditorRestoreBatch2
run = CommandListMeshEditorRestoreBatch2
run = CommandListMeshEditorRestoreBatch2

[CommandListMeshEditorRestoreBatch4]

run = CommandListMeshEditorRestoreBatch3
run = CommandListMeshEditorRestoreBatch3
run = CommandListMeshEditorRestoreBatch3
run = CommandListMeshEditorRestoreBatch3
run = CommandListMeshEditorRestoreBatch3
run = CommandListMeshEditorRestoreBatch3
run = CommandListMeshEditorRestoreBatch3
run = CommandListMeshEditorRestoreBatch3

[CommandListMeshEditorRestoreOne]
if $mesh_editor_restore_active == 1
    local $StrokeStart
    local $StrokeCount
    local $StrokeTool
    local $StrokeVertex
    local $DabIndex
    local $StrokeMirror
    local $StrokeAxis
    local $StrokePlane
    local $StrokeMaskSlot
    local $MoveReplayWaiting
    $MoveReplayWaiting = 0

    if $mesh_editor_restore_stroke < $mesh_editor_current_stroke
        $StrokeStart = $PoolMeshEditorStroke[$mesh_editor_restore_stroke * 8 + 0]
        $StrokeCount = $PoolMeshEditorStroke[$mesh_editor_restore_stroke * 8 + 1]
        $StrokeTool = $PoolMeshEditorStroke[$mesh_editor_restore_stroke * 8 + 2]
        $StrokeVertex = $PoolMeshEditorStroke[$mesh_editor_restore_stroke * 8 + 3]
        $StrokeMirror = $PoolMeshEditorStroke[$mesh_editor_restore_stroke * 8 + 4]
        $StrokeAxis = $PoolMeshEditorStroke[$mesh_editor_restore_stroke * 8 + 5]
        $StrokePlane = $PoolMeshEditorStroke[$mesh_editor_restore_stroke * 8 + 6]
        $StrokeMaskSlot = $PoolMeshEditorStroke[$mesh_editor_restore_stroke * 8 + 7]

        if $mesh_editor_restore_dab < $StrokeCount
            $DabIndex = $StrokeStart + $mesh_editor_restore_dab

            ; Previous replayed sculpt strokes update VertexDelta. Rebuild the
            ; writable object-space positions once per stroke so Weight Paint
            ; replay uses the same geometry space as live painting.
            if $mesh_editor_restore_dab == 0 && ($StrokeTool != 16 || $mesh_editor_selection_replay_cursor >= $StrokeVertex)
                run = CustomShaderMeshEditorRebuildWritablePosition
            endif

            ; CRITICAL: reload the mask snapshot for this geometry stroke before
            ; its first dab. MaskReplay writes NamedMasks only; it does NOT refresh
            ; ResourceMeshEditorMask, which ReplayDab reads at t5.
            ; Stroke +7 must have been recorded as the active slot at stroke start.
            if $StrokeTool < 7
                if $mesh_editor_restore_dab == 0
                    x37 = $StrokeMaskSlot
                    y37 = 0
                    z37 = $mesh_editor_active_mask_slot
                    run = CustomShaderMeshEditorNamedMaskOp

                    if $PoolMeshEditorStrokeMaskFlagsValid[$mesh_editor_restore_stroke] > 0.5
                        $mesh_editor_mask_flags_for_combine = $PoolMeshEditorStrokeMaskFlags[$mesh_editor_restore_stroke]
                    else
                        ; Legacy stroke created before this patch: it used only its recorded slot.
                        $mesh_editor_mask_flags_for_combine = (1 << $StrokeMaskSlot)
                    endif
                    run = CustomShaderMeshEditorCombineMasks
                    $mesh_editor_mask_flags_for_combine = $mesh_editor_mask_active_flags
                endif
            elif $StrokeTool == 15 && $mesh_editor_restore_dab == 0
                ; Weight strokes use the protection-mask selection captured at stroke start.
                if $PoolMeshEditorStrokeMaskFlagsValid[$mesh_editor_restore_stroke] > 0.5
                    $mesh_editor_mask_flags_for_combine = $PoolMeshEditorStrokeMaskFlags[$mesh_editor_restore_stroke]
                else
                    $mesh_editor_mask_flags_for_combine = $mesh_editor_mask_active_flags
                endif
                run = CustomShaderMeshEditorCombineMasks
                $mesh_editor_mask_flags_for_combine = $mesh_editor_mask_active_flags
            endif

            if $StrokeTool == 2
                local $DabX
                local $DabY
                local $DabZ
                local $DabStrength
                local $DabRadius

                $DabX = $PoolMeshEditorDab[$DabIndex * 5 + 0]
                $DabY = $PoolMeshEditorDab[$DabIndex * 5 + 1]
                $DabZ = $PoolMeshEditorDab[$DabIndex * 5 + 2]
                $DabStrength = $PoolMeshEditorDab[$DabIndex * 5 + 3]
                $DabRadius = $PoolMeshEditorDab[$DabIndex * 5 + 4]

                x33 = $DabRadius
                y34 = $DabStrength
                x36 = $StrokeMirror
                y36 = $StrokeAxis
                z36 = $StrokePlane
                w36 = $mesh_editor_mirror_epsilon
                x26 = $DabX
                y26 = $DabY
                z26 = $DabZ
                x27 = 1
                run = CommandListMeshEditorSmoothReplayDab
                x27 = 0

            elif $StrokeTool == 7
                x34 = $PoolMeshEditorDab[$DabIndex * 5 + 0]
                y34 = $PoolMeshEditorDab[$DabIndex * 5 + 1]
                z34 = $PoolMeshEditorDab[$DabIndex * 5 + 2]
                w34 = $PoolMeshEditorDab[$DabIndex * 5 + 3]
                x35 = $PoolMeshEditorDab[$DabIndex * 5 + 4]
                x36 = $StrokeMirror
                y36 = $StrokeAxis
                z36 = $StrokePlane
                w36 = $mesh_editor_mirror_epsilon
                x37 = $StrokeMaskSlot
                run = CustomShaderMeshEditorMaskReplay

            elif $StrokeTool >= 8 && $StrokeTool <= 14
                ; Operation tools:
                ;  8 = CLEAR
                ;  9 = FILL
                ; 10 = INVERT
                ; 11 = THRESHOLD
                ; 12 = CONTRAST
                ; 13 = SMOOTH
                ; 14 = SHARPEN

                $mesh_editor_mask_operation = $StrokeTool - 8
                $mesh_editor_mask_operation_slot = $StrokeMaskSlot

                run = CommandListMeshEditorRunMaskOperation

            elif $StrokeTool == 16
                ; Rebuild the selection state captured when this G step was made.
                $mesh_editor_selection_replay_target = $StrokeVertex
                if $mesh_editor_selection_replay_cursor < $mesh_editor_selection_replay_target
                    run = CommandListMeshEditorSelectionReplayOne
                    $MoveReplayWaiting = 1
                else
                    local $MoveReplayX
                    local $MoveReplayY
                    local $MoveReplayZ
                    $MoveReplayX = $PoolMeshEditorDab[$DabIndex * 5 + 0]
                    $MoveReplayY = $PoolMeshEditorDab[$DabIndex * 5 + 1]
                    $MoveReplayZ = $PoolMeshEditorDab[$DabIndex * 5 + 2]
                    ResourceMeshEditorMoveBaseline = copy ResourceMeshEditorVertexDelta
                    $mesh_editor_move_delta_x = $MoveReplayX
                    $mesh_editor_move_delta_y = $MoveReplayY
                    $mesh_editor_move_delta_z = $MoveReplayZ
                    local $MovePrevX50 = x50
                    local $MovePrevY50 = y50
                    local $MovePrevZ50 = z50
                    run = CustomShaderMeshEditorMoveSelected
                    x50 = $MovePrevX50
                    y50 = $MovePrevY50
                    z50 = $MovePrevZ50
                    run = CustomShaderMeshEditorRebuildWritablePosition
                endif

            elif $StrokeTool == 17
                ; Replay S using the vertex-set snapshot recorded at transform time.
                $mesh_editor_selection_replay_target = $StrokeVertex
                if $mesh_editor_selection_replay_cursor < $mesh_editor_selection_replay_target
                    run = CommandListMeshEditorSelectionReplayOne
                    $MoveReplayWaiting = 1
                else
                    local $ScaleReplayFactorX
                    local $ScaleReplayFactorY
                    local $ScaleReplayFactorZ
                    local $ScalePrevX50
                    local $ScalePrevY50
                    local $ScalePrevZ50
                    local $ScalePrevX51
                    local $ScalePrevY51
                    local $ScalePrevZ51

                    $ScaleReplayFactorX = $PoolMeshEditorDab[$DabIndex * 5 + 0]
                    $ScaleReplayFactorY = $PoolMeshEditorDab[$DabIndex * 5 + 1]
                    $ScaleReplayFactorZ = $PoolMeshEditorDab[$DabIndex * 5 + 2]
                    ResourceMeshEditorMoveBaseline = copy ResourceMeshEditorVertexDelta

                    $ScalePrevX50 = x50
                    $ScalePrevY50 = y50
                    $ScalePrevZ50 = z50
                    $ScalePrevX51 = x51
                    $ScalePrevY51 = y51
                    $ScalePrevZ51 = z51
                    x50 = $PoolMeshEditorStroke[$mesh_editor_restore_stroke * 8 + 4]
                    y50 = $PoolMeshEditorStroke[$mesh_editor_restore_stroke * 8 + 5]
                    z50 = $PoolMeshEditorStroke[$mesh_editor_restore_stroke * 8 + 6]
                    x51 = $ScaleReplayFactorX
                    y51 = $ScaleReplayFactorY
                    z51 = $ScaleReplayFactorZ
                    run = CustomShaderMeshEditorScaleSelected
                    x50 = $ScalePrevX50
                    y50 = $ScalePrevY50
                    z50 = $ScalePrevZ50
                    x51 = $ScalePrevX51
                    y51 = $ScalePrevY51
                    z51 = $ScalePrevZ51
                    run = CustomShaderMeshEditorRebuildWritablePosition
                endif

            elif $StrokeTool == 18
                ; Replay R with the exact vertex-set snapshot and pivot stored at commit time.
                $mesh_editor_selection_replay_target = $StrokeVertex
                if $mesh_editor_selection_replay_cursor < $mesh_editor_selection_replay_target
                    run = CommandListMeshEditorSelectionReplayOne
                    $MoveReplayWaiting = 1
                else
                    local $RotateReplayAngle
                    local $RotateReplayAxis
                    local $RotatePrevX50
                    local $RotatePrevY50
                    local $RotatePrevZ50
                    local $RotatePrevX51
                    local $RotatePrevY51
                    local $RotatePrevZ51

                    $RotateReplayAngle = $PoolMeshEditorDab[$DabIndex * 5 + 0]
                    $RotateReplayAxis = $PoolMeshEditorDab[$DabIndex * 5 + 1]
                    ResourceMeshEditorMoveBaseline = copy ResourceMeshEditorVertexDelta

                    $RotatePrevX50 = x50
                    $RotatePrevY50 = y50
                    $RotatePrevZ50 = z50
                    $RotatePrevX51 = x51
                    $RotatePrevY51 = y51
                    $RotatePrevZ51 = z51
                    x50 = $PoolMeshEditorStroke[$mesh_editor_restore_stroke * 8 + 4]
                    y50 = $PoolMeshEditorStroke[$mesh_editor_restore_stroke * 8 + 5]
                    z50 = $PoolMeshEditorStroke[$mesh_editor_restore_stroke * 8 + 6]
                    x51 = $RotateReplayAngle
                    y51 = $RotateReplayAxis
                    z51 = 0
                    run = CustomShaderMeshEditorRotateSelected
                    x50 = $RotatePrevX50
                    y50 = $RotatePrevY50
                    z50 = $RotatePrevZ50
                    x51 = $RotatePrevX51
                    y51 = $RotatePrevY51
                    z51 = $RotatePrevZ51
                    run = CustomShaderMeshEditorRebuildWritablePosition
                endif

            elif $StrokeTool == 15
                local $WeightVG
                local $WeightMode
                local $WeightTarget
                local $WeightFalloff
                local $WeightStrength
                local $WeightRadius
                local $WeightX
                local $WeightY
                local $WeightZ
                local $WeightOldX43
                local $WeightOldY43
                local $WeightOldZ43
                local $WeightOldW43

                $WeightVG = $PoolMeshEditorStroke[$mesh_editor_restore_stroke * 8 + 3]
                $WeightMode = $PoolMeshEditorWeightStrokeSettings[$mesh_editor_restore_stroke * 3 + 0]
                $WeightTarget = $PoolMeshEditorWeightStrokeSettings[$mesh_editor_restore_stroke * 3 + 1]
                $WeightFalloff = $PoolMeshEditorWeightStrokeSettings[$mesh_editor_restore_stroke * 3 + 2]
                $WeightX = $PoolMeshEditorDab[$DabIndex * 5 + 0]
                $WeightY = $PoolMeshEditorDab[$DabIndex * 5 + 1]
                $WeightZ = $PoolMeshEditorDab[$DabIndex * 5 + 2]
                $WeightStrength = $PoolMeshEditorDab[$DabIndex * 5 + 3]
                $WeightRadius = $PoolMeshEditorDab[$DabIndex * 5 + 4]

                x40 = $WeightVG
                y40 = $WeightMode
                z40 = $WeightStrength
                w40 = $WeightTarget
                x41 = $WeightRadius
                y41 = 1
                z41 = $WeightFalloff
                w41 = 0
                x42 = $WeightX
                y42 = $WeightY
                z42 = $WeightZ
                w42 = 1
                x36 = $StrokeMirror
                y36 = $StrokeAxis
                z36 = $StrokePlane
                w36 = $mesh_editor_mirror_epsilon

                if $WeightMode == 3
                    clear = ResourceMeshEditorWeightSmoothAccum
                    run = CommandListMeshEditorWeightSmoothRun
                elif $WeightMode == 4
                    $WeightOldX43 = x43
                    $WeightOldY43 = y43
                    $WeightOldZ43 = z43
                    $WeightOldW43 = w43
                    x43 = $PoolMeshEditorWeightGradient[$mesh_editor_restore_stroke * 4 + 0]
                    y43 = $PoolMeshEditorWeightGradient[$mesh_editor_restore_stroke * 4 + 1]
                    z43 = $PoolMeshEditorWeightGradient[$mesh_editor_restore_stroke * 4 + 2]
                    w43 = $PoolMeshEditorWeightGradient[$mesh_editor_restore_stroke * 4 + 3]
                    run = CustomShaderMeshEditorWeightPaintReplay
                    x43 = $WeightOldX43
                    y43 = $WeightOldY43
                    z43 = $WeightOldZ43
                    w43 = $WeightOldW43
                else
                    run = CustomShaderMeshEditorWeightPaintReplay
                endif

                y41 = 0
                w42 = 0

            else
                x34 = $PoolMeshEditorDab[$DabIndex * 5 + 0]
                y34 = $PoolMeshEditorDab[$DabIndex * 5 + 1]
                z34 = $PoolMeshEditorDab[$DabIndex * 5 + 2]
                w34 = $PoolMeshEditorDab[$DabIndex * 5 + 3]
                x35 = $PoolMeshEditorDab[$DabIndex * 5 + 4]
                y35 = $StrokeTool
                z35 = $StrokeVertex
                x36 = $StrokeMirror
                y36 = $StrokeAxis
                z36 = $StrokePlane
                w36 = $mesh_editor_mirror_epsilon
                x27 = 0
                run = CustomShaderMeshEditorReplayDab
            endif

            if $MoveReplayWaiting == 0
                $mesh_editor_restore_dab = $mesh_editor_restore_dab + 1
            endif

        else
            $mesh_editor_restore_stroke = $mesh_editor_restore_stroke + 1
            $mesh_editor_restore_dab = 0

            if $mesh_editor_restore_stroke >= $mesh_editor_current_stroke
                if $mesh_editor_selection_replay_cursor < $mesh_editor_selection_event_count
                    $mesh_editor_selection_replay_target = $mesh_editor_selection_event_count
                    run = CommandListMeshEditorSelectionReplayOne
                else
                    $mesh_editor_restore_active = 0
                    run = CommandListMeshEditorLoadActiveMask
                endif
            endif
        endif
    else
        if $mesh_editor_selection_replay_cursor < $mesh_editor_selection_event_count
            $mesh_editor_selection_replay_target = $mesh_editor_selection_event_count
            run = CommandListMeshEditorSelectionReplayOne
        else
            $mesh_editor_restore_active = 0
            run = CommandListMeshEditorLoadActiveMask
        endif
    endif
endif

[CommandListMeshEditorSmoothReplayDab]
clear = ResourceMeshEditorSmoothAccum
run = CustomShaderMeshEditorSmoothAccumulate
ResourceMeshEditorVertexDeltaBeforeSmooth = copy ResourceMeshEditorVertexDelta
run = CustomShaderMeshEditorSmoothApply
