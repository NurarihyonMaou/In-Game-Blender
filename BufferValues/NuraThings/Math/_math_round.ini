namespace = Math\Round

; ---------------------------DESCRIPTION---
; round(in)
; Rounds the input Float to the nearest integer
; Returns a Float value
; -------------------------------EXAMPLE---
; $\math\round\in = 3.7
; run = commandlist\math\round\run
; x = $\math\round\out

[Constants]
global $in
global $out

[CommandListRun]
local $floor = $in // 1
local $frac = $in - $floor

if $frac >= 0.5
    $out = $floor + 1
else
    $out = $floor
endif

$in = 0
