if $\NuraThings\ColorPicker\selector_type_changed == 1
    $update_texture = 1

    if ($\NuraThings\ColorPicker\selector_type == 0 && $packedHSV != 0)
        $\NuraThings\ColorPicker\packedHSV = $packedHSV
        $\NuraThings\ColorPicker\use_packed = 1
    endif

    if ($\NuraThings\ColorPicker\selector_type == 1 && $packedRGB != 0)
        $\NuraThings\ColorPicker\packedRGB = $packedRGB
        $\NuraThings\ColorPicker\use_packed = 1
    endif

    if ($\NuraThings\ColorPicker\selector_type == 2 && $packedHSL != 0)
        $\NuraThings\ColorPicker\packedHSL = $packedHSL
        $\NuraThings\ColorPicker\use_packed = 1
    endif

    run = CommandListGetHSV
endif

if $\NuraThings\ColorPicker\menu || $init

    if $init && (($\NuraThings\ColorPicker\selector_type == 0 && $packedHSV != 0) || ($\NuraThings\ColorPicker\selector_type == 1 && $packedRGB != 0) || ($\NuraThings\ColorPicker\selector_type == 2 && $packedHSL != 0))

        if ($\NuraThings\ColorPicker\selector_type == 0 && $packedHSV != 0)
            $\NuraThings\ColorPicker\packedHSV = $packedHSV
        endif

        if ($\NuraThings\ColorPicker\selector_type == 1 && $packedRGB != 0)
            $\NuraThings\ColorPicker\packedRGB = $packedRGB
        endif

        if ($\NuraThings\ColorPicker\selector_type == 2 && $packedHSL != 0)
            $\NuraThings\ColorPicker\packedHSL = $packedHSL
        endif

        $\NuraThings\ColorPicker\use_packed = 1

        run = CustomShader\NuraThings\ColorPicker\DrawColorPickers

        run = CommandListGetHSV
    endif
