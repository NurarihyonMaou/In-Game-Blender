; Columbina

; Constants -------------------------

[Present]
post $active = 0
post $activeburst = 0
if $Qpressed == 1
	$lastQpress = time
endif
if $active == 1 && time-$lastQpress < 3 && time-$lastQpress > 0.175
	$lastBurstTriggered = time
endif 

if $mouse_clicked > 0
	post $mouse_clicked = $mouse_clicked - 1
endif

post $active_elem_id = -1
post $elem_id = -1

if !$mouse_held
	$mouse_dragging = 0
	$dragged_slider_id = -1
endif

if $menu
	run = CommandListV7FallBacks
	run = CommandListScaleRef
	run = CommandListDrawAllMenuElements
	
endif

