*; ============================================================================*

*; NuraThings UI CORE - FIRST PROTOTYPE*

*; ============================================================================*

*;*

*; GPU-side menu shell + GPU-side mouse hit testing.*

*; Only F8 and LMB are Key sections; the menu itself does not consume one*

*; KeyBind per button.*

*;*

*; UIState layout:*

*;   [0] page*

*;   [1] mesh tool*

*;   [2] previous LMB*

*;   [3] hover id*

*;   [4] clicked id*

*;   [5] mirror*

*;   [6] invert*

*;*

*; ============================================================================*

[Constants]

global $nt_ui = 0

global $nt_ui_lmb = 0

global $nt_ui_initialized = 0

global $nt_ui_init = 0

global $nt_overlay = 0

[Present]

if $nt_ui || $nt_overlay

    run = CommandListNuraThingsUIFrame

endif

[KeyNuraThingsOverlay]

key = VK_F9

type = toggle

$nt_overlay = 1

[KeyNuraThingsMenu]

key = VK_F8

type = toggle

$nt_ui = 1

[KeyNuraThingsUILMB]

condition = $nt_ui == 1 || $nt_overlay

key = VK_LBUTTON

type = hold

$nt_ui_lmb = 1

[ResourceNuraThingsUIState]

type = RWBuffer

format = R32_FLOAT

array = 18

[CustomShaderNuraThingsUIInput]

cs = NuraThingsUIInput.hlsl

cs-u0 = ResourceNuraThingsUIState

x31 = cursor_window_x

y31 = cursor_window_y

z31 = window_width

w31 = window_height

x32 = $nt_ui_lmb

x33 = $nt_ui

y33 = $\Iris\mesh_editor_mirror

z33 = $\Iris\mesh_editor_mirror_axis

w33 = $\Iris\falloff_radius

x34 = $\Iris\mesh_editor_sculpt_strength

y34 = $\Iris\mesh_editor_smooth_strength

z34 = $\Iris\mesh_editor_pinch_strength

w34 = $\Iris\mesh_editor_crease_strength

x35 = $\Iris\mesh_editor_flatten_strength

y35 = $\Iris\mesh_editor_scale_strength

z35 = $\Iris\mesh_editor_mask_strength

x36 = $nt_overlay

x37 = $\Iris\mesh_editor_falloff_mode

dispatch = 1, 1, 1

cs-u0 = null

[CustomShaderNuraThingsUIOverlay]

vs = NuraThingsUI.hlsl

ps = NuraThingsUI.hlsl

ps-t0 = ResourceNuraThingsUIState

x31 = cursor_window_x

y31 = cursor_window_y

z31 = window_width

w31 = window_height

x33 = $nt_ui

cull = none

topology = triangle_strip

blend = ADD SRC_ALPHA INV_SRC_ALPHA

depth_enable = FALSE

o0 = set_viewport bb

draw = 4, 0

ps-t0 = null

[CommandListNuraThingsUIFrame]

if $nt_ui_initialized == 0

    clear = ResourceNuraThingsUIState

    $nt_ui_initialized = 1

endif

local $nt_tool_local

run = CustomShaderNuraThingsUIInput

store = $nt_tool_local, ResourceNuraThingsUIState, 1

$\Iris\mesh_editor_tool = $nt_tool_local



local $nt_strength_local

store = $nt_strength_local, ResourceNuraThingsUIState, 15

if $nt_tool_local <= 1

    $\Iris\mesh_editor_sculpt_strength = $nt_strength_local

else if $nt_tool_local == 2

    $\Iris\mesh_editor_smooth_strength = $nt_strength_local

else if $nt_tool_local == 3

    $\Iris\mesh_editor_pinch_strength = $nt_strength_local

else if $nt_tool_local == 4

    $\Iris\mesh_editor_crease_strength = $nt_strength_local

else if $nt_tool_local == 5

    $\Iris\mesh_editor_flatten_strength = $nt_strength_local

else if $nt_tool_local == 6

    $\Iris\mesh_editor_scale_strength = $nt_strength_local

else if $nt_tool_local == 7

    $\Iris\mesh_editor_mask_strength = $nt_strength_local

endif

local $nt_radius_local

store = $nt_radius_local, ResourceNuraThingsUIState, 8

$\Iris\falloff_radius = $nt_radius_local

local $nt_falloff_local

store = $nt_falloff_local, ResourceNuraThingsUIState, 16

$\Iris\mesh_editor_falloff_mode = $nt_falloff_local



local $nt_mirror_local

local $nt_mirror_axis_local

store = $nt_mirror_local, ResourceNuraThingsUIState, 5

store = $nt_mirror_axis_local, ResourceNuraThingsUIState, 6

$\Iris\mesh_editor_mirror = $nt_mirror_local

$\Iris\mesh_editor_mirror_axis = $nt_mirror_axis_local

if $nt_ui == 1

    local $nt_page_local

    store = $nt_page_local, ResourceNuraThingsUIState, 0

*    ;local $nt_clicked_local*

*    ;store = $nt_clicked_local, ResourceNuraThingsUIState, 4*

*    ; Clear hook:*

*    ; if $nt_clicked_local == 70*

*    ;     run = \<TWÓJ_ISTNIEJĄCY_CLEAR_COMMANDLIST>*

*    ; endif*

    run = CustomShaderNuraThingsUIOverlay

    run = CommandListNuraThingsUIText

    if $nt_page_local == 0

        run = CommandListNuraThingsUIMeshText

    endif

endif

if $nt_overlay && $nt_ui == 0

    run = CustomShaderNuraThingsUIBlenderOverlay

    run = CommandListNuraThingsUIBlenderText

endif



[CustomShaderNuraThingsUIBlenderOverlay]

vs = NuraThingsUIBlenderOverlay.hlsl

ps = NuraThingsUIBlenderOverlay.hlsl

ps-t0 = ResourceNuraThingsUIState

x31 = cursor_window_x

y31 = cursor_window_y

z31 = window_width

w31 = window_height

cull = none

topology = triangle_strip

blend = ADD SRC_ALPHA INV_SRC_ALPHA

depth_enable = FALSE

o0 = set_viewport bb

draw = 4, 0

ps-t0 = null

[CommandListNuraThingsUIText]

Resource\NuraThings\Print\Custom\Font = Resource\NuraThings\Print\Custom\PixelFont

Resource\NuraThings\Print\Custom\Text = ref ResourceNuraThingsUIText

Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraThingsUITextParams

run = CommandList\NuraThings\Print\Custom\PrintText

Resource\NuraThings\Print\Custom\Text = ref ResourceNuraThingsUITextMesh

Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraThingsUITextMeshParams

run = CommandList\NuraThings\Print\Custom\PrintText

Resource\NuraThings\Print\Custom\Text = ref ResourceNuraThingsUITextJiggle

Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraThingsUITextJiggleParams

run = CommandList\NuraThings\Print\Custom\PrintText

Resource\NuraThings\Print\Custom\Text = ref ResourceNuraThingsUITextColor

Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraThingsUITextColorParams

run = CommandList\NuraThings\Print\Custom\PrintText

Resource\NuraThings\Print\Custom\Text = ref ResourceNuraThingsUITextGames

Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraThingsUITextGamesParams

run = CommandList\NuraThings\Print\Custom\PrintText

Resource\NuraThings\Print\Custom\Text = ref ResourceNuraThingsUITextDebug

Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraThingsUITextDebugParams

run = CommandList\NuraThings\Print\Custom\PrintText

Resource\NuraThings\Print\Custom\Text = ref ResourceNuraThingsUITextSettings

Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraThingsUITextSettingsParams

run = CommandList\NuraThings\Print\Custom\PrintText

Resource\NuraThings\Print\Custom\Font = Resource\NuraThings\Print\Custom\DefaultFont

[CommandListNuraThingsUIMeshText]

Resource\NuraThings\Print\Custom\Font = Resource\NuraThings\Print\Custom\PixelFont

*; -------------------------------------------------------------------------*

*; Existing labels*

*; -------------------------------------------------------------------------*

Resource\NuraThings\Print\Custom\Text = ref ResourceNuraThingsUITools

Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraThingsUIToolsParams

run = CommandList\NuraThings\Print\Custom\PrintText

Resource\NuraThings\Print\Custom\Text = ref ResourceNuraThingsUIGrab

Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraThingsUIGrabParams

run = CommandList\NuraThings\Print\Custom\PrintText

Resource\NuraThings\Print\Custom\Text = ref ResourceNuraThingsUIInflate

Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraThingsUIInflateParams

run = CommandList\NuraThings\Print\Custom\PrintText

Resource\NuraThings\Print\Custom\Text = ref ResourceNuraThingsUISmooth

Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraThingsUISmoothParams

run = CommandList\NuraThings\Print\Custom\PrintText

Resource\NuraThings\Print\Custom\Text = ref ResourceNuraThingsUIPinch

Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraThingsUIPinchParams

run = CommandList\NuraThings\Print\Custom\PrintText

Resource\NuraThings\Print\Custom\Text = ref ResourceNuraThingsUICrease

Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraThingsUICreaseParams

run = CommandList\NuraThings\Print\Custom\PrintText

Resource\NuraThings\Print\Custom\Text = ref ResourceNuraThingsUIFlatten

Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraThingsUIFlattenParams

run = CommandList\NuraThings\Print\Custom\PrintText

Resource\NuraThings\Print\Custom\Text = ref ResourceNuraThingsUIScale

Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraThingsUIScaleParams

run = CommandList\NuraThings\Print\Custom\PrintText

Resource\NuraThings\Print\Custom\Text = ref ResourceNuraThingsUIMask

Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraThingsUIMaskParams

run = CommandList\NuraThings\Print\Custom\PrintText

Resource\NuraThings\Print\Custom\Text = ref ResourceNuraThingsUIBrush

Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraThingsUIBrushParams

run = CommandList\NuraThings\Print\Custom\PrintText



Resource\NuraThings\Print\Custom\Text = ref ResourceNuraThingsUIRadius

Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraThingsUIRadiusParams

run = CommandList\NuraThings\Print\Custom\PrintText

*; -------------------------------------------------------------------------*

*; Generate Radius value*

*; -------------------------------------------------------------------------*

local $nt_old_x67 = x67

local $nt_old_y67 = y67

local $nt_old_z67 = z67

x67 = $\Iris\falloff_radius

y67 = 3

z67 = 13

run = CustomShaderNuraThingsUIValueString

Resource\NuraThings\Print\Custom\Text = ref ResourceNuraThingsUIValueString

Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraThingsUIValueParams

run = CommandList\NuraThings\Print\Custom\PrintText

x67 = $nt_old_x67

y67 = $nt_old_y67

z67 = $nt_old_z67

*; -------------------------------------------------------------------------*

*; Strength*

*; -------------------------------------------------------------------------*

if $\Iris\mesh_editor_tool != 0

    local $nt_strength_value

    local $nt_strength_decimals

    if $\Iris\mesh_editor_tool <= 1

        $nt_strength_value = $\Iris\mesh_editor_sculpt_strength

        $nt_strength_decimals = 3

    else if $\Iris\mesh_editor_tool == 2

        $nt_strength_value = $\Iris\mesh_editor_smooth_strength

        $nt_strength_decimals = 2

    else if $\Iris\mesh_editor_tool == 3

        $nt_strength_value = $\Iris\mesh_editor_pinch_strength

        $nt_strength_decimals = 4

    else if $\Iris\mesh_editor_tool == 4

        $nt_strength_value = $\Iris\mesh_editor_crease_strength

        $nt_strength_decimals = 5

    else if $\Iris\mesh_editor_tool == 5

        $nt_strength_value = $\Iris\mesh_editor_flatten_strength

        $nt_strength_decimals = 4

    else if $\Iris\mesh_editor_tool == 6

        $nt_strength_value = $\Iris\mesh_editor_scale_strength

        $nt_strength_decimals = 2

    else

        $nt_strength_value = $\Iris\mesh_editor_mask_strength

        $nt_strength_decimals = 2

    endif

    Resource\NuraThings\Print\Custom\Text = ref ResourceNuraThingsUIStrength

    Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraThingsUIStrengthParams

    run = CommandList\NuraThings\Print\Custom\PrintText

    x67 = $nt_strength_value

    y67 = $nt_strength_decimals

    z67 = 13

    run = CustomShaderNuraThingsUIValueString

    Resource\NuraThings\Print\Custom\Text = ref ResourceNuraThingsUIValueString

    Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraThingsUIStrengthValueParams

    run = CommandList\NuraThings\Print\Custom\PrintText

endif

x67 = $nt_old_x67

y67 = $nt_old_y67

z67 = $nt_old_z67

Resource\NuraThings\Print\Custom\Font = Resource\NuraThings\Print\Custom\DefaultFont

