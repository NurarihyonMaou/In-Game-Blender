[KeyQDetection]
condition = $activeburst == 1 && $active == 1
key = no_alt no_ctrl q
type = hold
$Qpressed = 1

[KeySwaphair]
key = 5
condition = $active == 1
type = cycle
$hair = 0,1,2,3

[KeySwaphaircolour]
key = 6
condition = $active == 1
type = cycle
$haircolour = 0,1,2

[KeySwapcolour]
key = 7
condition = $active == 1
type = cycle
$colour = 0,1,2

[KeySwapcrown]
key = 8
condition = $active == 1
type = cycle
$crown = 0,1

[KeySwaphairacc]
key = 9
condition = $active == 1
type = cycle
$hairacc = 0,1

[KeySwapskirt]
key = 0
condition = $active == 1
type = cycle
$skirt = 0,1

[KeySwapeyemask]
key = minus
condition = $active == 1
type = cycle
$eyemask = 0,1,2

[KeySwapmaskcolour]
key = VK_OEM_PLUS
condition = $active == 1
type = cycle
$maskcolour = 0,1

[KeySwapcape]
key = p
condition = $active == 1
type = cycle
$cape = 0,1

[KeySwapsleeves]
key = ;
condition = $active == 1
type = cycle
$sleeves = 0,1

[KeySwapelywings]
key = [
condition = $active == 1
type = cycle
$elywings = 0,1

[KeySwapseelewings]
key = ]
condition = $active == 1
type = cycle
$seelewings = 0,1

[KeyMenu]
key = M
condition = $active == 1
type = cycle
$menu = 0,1

[KeyLMBClick]
condition = $menu
key = VK_LBUTTON
type = cycle
$mouse_clicked = 2

[KeyMouseHeld]
key = VK_LBUTTON
type = hold
$mouse_held = 1

