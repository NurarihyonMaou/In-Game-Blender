namespace = NuraThings\Print\Custom

[ResourceFontMSDF]
filename = ../Fonts/NuraThingsFont_MSDF.dds

[ResourceFontMSDFMetrics]
type = Buffer
format = R32G32B32A32_FLOAT
filename = ../Fonts/NuraThingsFont_MSDFMetrics.buf

; MSDF renderer: parallel to existing RenderText. It does not change legacy Font/PixelFont.
[CommandListRenderTextMSDF]
local $bak_x = x
local $bak_y = y
local $bak_w = w
run = CommandListPassWindowInfo
w = effective_dpi
run = CustomShaderFormatTextMSDF
run = CustomShaderRenderTextMSDF
x = $bak_x
y = $bak_y
w = $bak_w

[CustomShaderFormatTextMSDF]
cs = ../Shaders/TextPrinterMSDF.hlsl
vs = null
ps = null
hs = null
ds = null
gs = null
cs-t101 = ResourceFontMSDFMetrics
if ResourceText !== null
    cs-t113 = ResourceText
    cs-t114 = ResourceTextParams
    clear = ResourceTextPosition
    cs-u0 = ResourceTextPosition
    dispatch = 1, 1, 1
endif
cs-u0 = null
cs-t101 = null
cs-t113 = null
cs-t114 = null

[CustomShaderRenderTextMSDF]
vs = ../Shaders/TextPrinterMSDF.hlsl
gs = ../Shaders/TextPrinterMSDF.hlsl
ps = ../Shaders/TextPrinterMSDF.hlsl
hs = null
ds = null
cs = null
depth_clip_enable = false
cull = none
blend = add one inv_src_alpha
topology = point_list
run = BuiltInCommandListUnbindAllRenderTargets
o0 = set_viewport no_view_cache bb
gs-t100 = ResourceFontMSDF
gs-t101 = ResourceFontMSDFMetrics
ps-t100 = ResourceFontMSDF
ps-t101 = ResourceFontMSDFMetrics
post gs-t100 = null
post gs-t101 = null
post ps-t100 = null
post ps-t101 = null
gs-t112 = ResourceTextPosition
gs-t113 = ResourceText
gs-t114 = ResourceTextParams
ps-t114 = ResourceTextParams
draw = 8192, 0
gs-t112 = null
gs-t113 = null
gs-t114 = null
ps-t114 = null
ResourceText = null
ResourceTextParams = null

[CommandListPrintTextMSDF]
run = CommandListRenderTextMSDF
