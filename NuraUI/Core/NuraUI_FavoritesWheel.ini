; Core handler for favorite stars on the Modules tab. Favorite IDs are compacted after removal.
[CommandListNuraUIHandleFavoriteToggle]
; The input shader has already resolved the clicked registry slot to its module ID.
local $nt_fav_module_id_local
store = $nt_fav_module_id_local, Resource\NuraUI\NuraThingsUIState, 58
if $nt_fav_module_id_local > 0
    if $nt_fav_module_id_local == $nt_fav_module_id0
        $nt_fav_module_id0 = $nt_fav_module_id1
        $nt_fav_module_id1 = $nt_fav_module_id2
        $nt_fav_module_id2 = $nt_fav_module_id3
        $nt_fav_module_id3 = $nt_fav_module_id4
        $nt_fav_module_id4 = $nt_fav_module_id5
        $nt_fav_module_id5 = $nt_fav_module_id6
        $nt_fav_module_id6 = $nt_fav_module_id7
        $nt_fav_module_id7 = 0
    else if $nt_fav_module_id_local == $nt_fav_module_id1
        $nt_fav_module_id1 = $nt_fav_module_id2
        $nt_fav_module_id2 = $nt_fav_module_id3
        $nt_fav_module_id3 = $nt_fav_module_id4
        $nt_fav_module_id4 = $nt_fav_module_id5
        $nt_fav_module_id5 = $nt_fav_module_id6
        $nt_fav_module_id6 = $nt_fav_module_id7
        $nt_fav_module_id7 = 0
    else if $nt_fav_module_id_local == $nt_fav_module_id2
        $nt_fav_module_id2 = $nt_fav_module_id3
        $nt_fav_module_id3 = $nt_fav_module_id4
        $nt_fav_module_id4 = $nt_fav_module_id5
        $nt_fav_module_id5 = $nt_fav_module_id6
        $nt_fav_module_id6 = $nt_fav_module_id7
        $nt_fav_module_id7 = 0
    else if $nt_fav_module_id_local == $nt_fav_module_id3
        $nt_fav_module_id3 = $nt_fav_module_id4
        $nt_fav_module_id4 = $nt_fav_module_id5
        $nt_fav_module_id5 = $nt_fav_module_id6
        $nt_fav_module_id6 = $nt_fav_module_id7
        $nt_fav_module_id7 = 0
    else if $nt_fav_module_id_local == $nt_fav_module_id4
        $nt_fav_module_id4 = $nt_fav_module_id5
        $nt_fav_module_id5 = $nt_fav_module_id6
        $nt_fav_module_id6 = $nt_fav_module_id7
        $nt_fav_module_id7 = 0
    else if $nt_fav_module_id_local == $nt_fav_module_id5
        $nt_fav_module_id5 = $nt_fav_module_id6
        $nt_fav_module_id6 = $nt_fav_module_id7
        $nt_fav_module_id7 = 0
    else if $nt_fav_module_id_local == $nt_fav_module_id6
        $nt_fav_module_id6 = $nt_fav_module_id7
        $nt_fav_module_id7 = 0
    else if $nt_fav_module_id_local == $nt_fav_module_id7
        $nt_fav_module_id7 = 0
    else if $nt_fav_module_id0 == 0
        $nt_fav_module_id0 = $nt_fav_module_id_local
    else if $nt_fav_module_id1 == 0
        $nt_fav_module_id1 = $nt_fav_module_id_local
    else if $nt_fav_module_id2 == 0
        $nt_fav_module_id2 = $nt_fav_module_id_local
    else if $nt_fav_module_id3 == 0
        $nt_fav_module_id3 = $nt_fav_module_id_local
    else if $nt_fav_module_id4 == 0
        $nt_fav_module_id4 = $nt_fav_module_id_local
    else if $nt_fav_module_id5 == 0
        $nt_fav_module_id5 = $nt_fav_module_id_local
    else if $nt_fav_module_id6 == 0
        $nt_fav_module_id6 = $nt_fav_module_id_local
    else if $nt_fav_module_id7 == 0
        $nt_fav_module_id7 = $nt_fav_module_id_local
    else
        ; All eight slots are full: replace the last favorite.
        $nt_fav_module_id7 = $nt_fav_module_id_local
    endif
endif

