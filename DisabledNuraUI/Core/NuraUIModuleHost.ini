namespace = NuraUI2

[Constants]
global $nura_ui_module_registry_initialized = 0

[ResourceNuraUIModuleRegistry]
type = RWBuffer
format = R32_UINT
array = 32

[Present]
run = CommandListNuraUIModuleHostInit

[CommandListNuraUIModuleHostInit]
if $nura_ui_module_registry_initialized == 0
    clear = ResourceNuraUIModuleRegistry
    $nura_ui_module_registry_initialized = 1
endif
