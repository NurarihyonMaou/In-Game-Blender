global $nt_jiggle_ui_motion_smoothing = 0.65
global $nt_jiggle_ui_edge_falloff = 1.0

[Present]
; The shared Text system leaves KeyDetector.key_code untouched while input_lock is set.
; NuraUI then consumes that one event; the shared Text input path itself remains unchanged by default.
if $nt_mask_rename_active == 1
    CommandList\NuraThings\Text\ExternalInputHandle = ref CommandListNuraThingsMaskNameInput
else if $\Iris\iris_kbm_capture_active == 1
    CommandList\NuraThings\Text\ExternalInputHandle = ref CommandList\Iris\IrisKbmCaptureInput
else
    CommandList\NuraThings\Text\ExternalInputHandle = null
endif
if $nt_ui || $nt_overlay
    run = CommandListNuraThingsUIFrame
endif

[KeyNuraThingsOverlay]
condition = $nt_mask_rename_active == 0
key = VK_F9
type = toggle
$nt_overlay = 1

[KeyNuraThingsWeightVGScrollUp]
condition = $nt_overlay == 1 && $\Iris\mesh_editor_tool == 15 && $nt_weight_vg_list_open == 1 && $nt_weight_vg_list_hover == 1 && $nt_mask_rename_active == 0
key = MOUSE_WHEEL_UP
run = CommandListNuraThingsWeightVGScrollUp

[KeyNuraThingsWeightVGScrollDown]
condition = $nt_overlay == 1 && $\Iris\mesh_editor_tool == 15 && $nt_weight_vg_list_open == 1 && $nt_weight_vg_list_hover == 1 && $nt_mask_rename_active == 0
key = MOUSE_WHEEL_DOWN
run = CommandListNuraThingsWeightVGScrollDown

[CommandListNuraThingsWeightVGScrollUp]
$nt_weight_vg_list_scroll = $nt_weight_vg_list_scroll - 3
if $nt_weight_vg_list_scroll < 0
    $nt_weight_vg_list_scroll = 0
endif

[CommandListNuraThingsWeightVGScrollDown]
$nt_weight_vg_list_scroll = $nt_weight_vg_list_scroll + 3
if $nt_weight_vg_list_scroll > 110
    $nt_weight_vg_list_scroll = 110
endif

[KeyNuraThingsKbmActionScrollUp]
condition = $nt_overlay == 1 && $nt_ui == 0 && $nt_kbm_action_list_open == 1 && $nt_kbm_action_list_hover == 1 && $nt_mask_rename_active == 0
key = MOUSE_WHEEL_UP
run = CommandListNuraThingsKbmActionScrollUp

[KeyNuraThingsKbmActionScrollDown]
condition = $nt_overlay == 1 && $nt_ui == 0 && $nt_kbm_action_list_open == 1 && $nt_kbm_action_list_hover == 1 && $nt_mask_rename_active == 0
key = MOUSE_WHEEL_DOWN
run = CommandListNuraThingsKbmActionScrollDown

[CommandListNuraThingsKbmActionScrollUp]
$nt_kbm_action_list_open = 1
$nt_kbm_action_list_scroll = $nt_kbm_action_list_scroll - 1
if $nt_kbm_action_list_scroll < 0
    $nt_kbm_action_list_scroll = 0
endif

[CommandListNuraThingsKbmActionScrollDown]
$nt_kbm_action_list_open = 1
$nt_kbm_action_list_scroll = $nt_kbm_action_list_scroll + 1
if $nt_kbm_action_list_scroll > 13
    $nt_kbm_action_list_scroll = 13
endif

[KeyNuraUIModuleScrollUp]
condition = $nt_ui == 1 && $nt_module_browser_active == 1 && $nt_mask_rename_active == 0
key = MOUSE_WHEEL_UP
run = CommandListNuraUIModuleScrollUp

[KeyNuraUIModuleScrollDown]
condition = $nt_ui == 1 && $nt_module_browser_active == 1 && $nt_mask_rename_active == 0
key = MOUSE_WHEEL_DOWN
run = CommandListNuraUIModuleScrollDown

[CommandListNuraUIModuleScrollUp]
$nt_module_scroll = $nt_module_scroll - 1
if $nt_module_scroll < 0
    $nt_module_scroll = 0
endif

[CommandListNuraUIModuleScrollDown]
$nt_module_scroll = $nt_module_scroll + 1
if $nt_module_scroll > 24
    $nt_module_scroll = 24
endif

[KeyNuraThingsMenu]
condition = $nt_mask_rename_active == 0
key = VK_F8
type = toggle
$nt_ui = 1

[KeyNuraThingsUILMB]
condition = $nt_ui == 1 || $nt_overlay
key = VK_LBUTTON
type = hold
$nt_ui_lmb = 1

[ResourceNuraThingsUIState]
type = RWBuffer
format = R32_FLOAT
array = 59

[CommandListPrintInputValue]
local $region_start = 0 + (64 * $nt_mask_rename_slot)
local $region_end = 64 * ($nt_mask_rename_slot+1)
Resource\NuraThings\Print\Custom\Text = ref ResourceNuraThingsUIMaskNames->Region($region_start, $region_end)

