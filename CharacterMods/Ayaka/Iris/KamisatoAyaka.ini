        $PoolMeshEditorWeightGradientSettings[$mesh_editor_current_stroke * 9 + 0] = $X
        $PoolMeshEditorWeightGradientSettings[$mesh_editor_current_stroke * 9 + 1] = $Y
        $PoolMeshEditorWeightGradientSettings[$mesh_editor_current_stroke * 9 + 2] = $Z
        $PoolMeshEditorWeightGradientSettings[$mesh_editor_current_stroke * 9 + 8] = 1
    endif

