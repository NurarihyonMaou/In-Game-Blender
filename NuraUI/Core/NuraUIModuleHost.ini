namespace = NuraUI

[Constants]
global $nura_ui_module_registry_initialized = 0

[ResourceNuraUIModuleRegistry]
type = RWBuffer
format = R32_UINT
array = 32

; 32 modules * 8 widgets/module * 8 floats/widget.
; Widget descriptor: type, x1, y1, x2, y2, value, min, max.
[ResourceNuraUIModuleWidgetRegistry]
type = RWBuffer
format = R32_FLOAT
array = 2048

[Present]
run = CommandListNuraUIModuleHostInit

[CommandListNuraUIModuleHostInit]
if $nura_ui_module_registry_initialized == 0
    clear = ResourceNuraUIModuleRegistry
    clear = ResourceNuraUIModuleWidgetRegistry
    $nura_ui_module_registry_initialized = 1
endif
