namespace = NuraUI

[Constants]
global $nura_ui_module_registry_initialized = 0

[ResourceNuraUIModuleRegistry]
type = RWBuffer
format = R32_UINT
array = 32

; 32 modules * 8 widgets/module * 8 floats/widget.
; Widget descriptor: type, x1, y1, x2, y2, value, min, max.
[ResourceNuraUIModuleWidgetRegistry]
type = RWBuffer
format = R32_FLOAT
array = 2048

; Compact module-contributed keybind rows: 32 modules * 4 rows each.
; A nonzero token occupies a row; the row number is stored per module.
[ResourceNuraUIModuleKeybindRegistry]
type = RWBuffer
format = R32_UINT
array = 128

; Global module-contributed Settings: 32 modules * 2 settings each.
[ResourceNuraUIModuleSettingRegistry]
type = RWBuffer
format = R32_UINT
array = 64

; Eight floats per compact setting row: type, value, min, max, moduleId, localIndex, reserved, reserved.
[ResourceNuraUIModuleSettingDescriptors]
type = RWBuffer
format = R32_FLOAT
array = 512

[Present]
run = CommandListNuraUIModuleHostInit

[CommandListNuraUIModuleHostInit]
if $nura_ui_module_registry_initialized == 0
    clear = ResourceNuraUIModuleRegistry
    clear = ResourceNuraUIModuleWidgetRegistry
    clear = ResourceNuraUIModuleKeybindRegistry
    clear = ResourceNuraUIModuleSettingRegistry
    clear = ResourceNuraUIModuleSettingDescriptors
    $nura_ui_module_registry_initialized = 1
endif
