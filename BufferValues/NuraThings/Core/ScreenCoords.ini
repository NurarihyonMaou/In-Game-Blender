[Constants]
global persist $show_cursor_pos = 0

global $x1
global $y1
global $z1
global $w1

global $z2
global $w2

global $preserved_x1
global $preserved_y1
global $preserved_z1
global $preserved_w1

global $preserved_z2
global $preserved_w2


[Present]
if $show_cursor_pos
    run = CommandListBackup

    $x1 = cursor_x
    $y1 = cursor_y
    $z1 = cursor_x * 2 - 1
    $w1 = cursor_y * 2 - 1

    $z2 = (cursor_x * 2 - 1) - 0.115
    $w2 = (cursor_y * 2 - 1) * (-1) - 0.115

    run = CommandListSet

    Resource\RichText\Rich = ResourceString
    run = CustomShader\RichText\Parse

    Resource\NuraThings\Print\Custom\Font = Resource\NuraThings\Print\Custom\DefaultFont

    Resource\NuraThings\Print\Custom\Text = ref Resource\RichText\Parsed
    Resource\NuraThings\Print\Custom\TextParams = ref ResourceStringParsedParams
    run = CommandList\NuraThings\Print\Custom\PrintText

    run = CommandListRestore
endif


[KeySCoords]
key = \
type = cycle
smart = true
$show_cursor_pos = 0,1


[CommandListSet]
x1 = $x1
y1 = $y1
z1 = $z1
w1 = $w1

z2 = $z2
w2 = $w2

[CommandListBackup]
$preserved_x1 = x1
$preserved_y1 = y1
$preserved_z1 = z1
$preserved_w1 = w1

$preserved_z2 = z2
$preserved_w2 = w2

[CommandListRestore]
x1 = $preserved_x1
y1 = $preserved_y1
z1 = $preserved_z1
w1 = $preserved_w1

z2 = $preserved_z2
w2 = $preserved_w2

[ResourceString]
type = Buffer
format = R8_UINT
filename = ScreenCoords.txt

[ResourceStringParsedParams]
type = StructuredBuffer
array = 1
data = R32_FLOAT   0.2 -0.25 1 0.25  0.15 1.0 0.15 1   0.01 0.00549 0.0177647 1.0   0.02  0.05   2 1   1   2