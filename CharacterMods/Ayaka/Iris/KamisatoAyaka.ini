; ============================================================================
; TEXTURE EDITOR — T0 INSPECTOR
; Read-only 2D preview of the six existing diffuse DDS resources.
; Does not write to the original DDS and does not redeclare ColorPicker globals.
; ============================================================================

[KeyIrisTextureEditorToggle]
condition = $\NuraUI\nt_mask_rename_active == 0
key = VK_F3
type = cycle
$iris_texture_editor_open = 0,1

[KeyIrisTextureEditorPrevious]
condition = $iris_texture_editor_open == 1 && $\NuraUI\nt_mask_rename_active == 0
key = VK_CONTROL VK_LEFT
run = CommandListIrisTextureEditorPrevious

[KeyIrisTextureEditorNext]
condition = $iris_texture_editor_open == 1 && $\NuraUI\nt_mask_rename_active == 0
key = VK_CONTROL VK_RIGHT
run = CommandListIrisTextureEditorNext

[CommandListIrisTextureEditorPrevious]
if $iris_texture_editor_slot > 0
    $iris_texture_editor_slot = $iris_texture_editor_slot - 1
else
    $iris_texture_editor_slot = 5
endif

[CommandListIrisTextureEditorNext]
if $iris_texture_editor_slot < 5
    $iris_texture_editor_slot = $iris_texture_editor_slot + 1
else
    $iris_texture_editor_slot = 0
endif

[CommandListIrisTextureEditorDraw]
; Display region is on the right to avoid overlapping the existing pose-thumbnail grid.
; x210/y210 = top-left origin; x211/y211 = maximum box width/height; z210 = slot badge.
x210 = 0.60
y210 = 0.10
z210 = $iris_texture_editor_slot
w210 = 0
x211 = 0.36
y211 = 0.72
z211 = 0
w211 = 0

if $iris_texture_editor_slot == 0
    vs-t0 = ResourceKamisatoAyakaHeadDiffuse
    ps-t0 = ResourceKamisatoAyakaHeadDiffuse
    run = CustomShaderIrisTextureEditorPreview
else if $iris_texture_editor_slot == 1
    vs-t0 = ResourceBodyDiffuse
    ps-t0 = ResourceBodyDiffuse
    run = CustomShaderIrisTextureEditorPreview
else if $iris_texture_editor_slot == 2
    vs-t0 = ResourceChestDiffuse
    ps-t0 = ResourceChestDiffuse
    run = CustomShaderIrisTextureEditorPreview
else if $iris_texture_editor_slot == 3
    vs-t0 = ResourceBlueDiffuse
    ps-t0 = ResourceBlueDiffuse
    run = CustomShaderIrisTextureEditorPreview
else if $iris_texture_editor_slot == 4
    vs-t0 = ResourceArmorDiffuse
    ps-t0 = ResourceArmorDiffuse
    run = CustomShaderIrisTextureEditorPreview
else
    vs-t0 = ResourceAccessoriesDiffuse
    ps-t0 = ResourceAccessoriesDiffuse
    run = CustomShaderIrisTextureEditorPreview
endif

vs-t0 = null
ps-t0 = null

[CustomShaderIrisTextureEditorPreview]
run = BuiltInCommandListUnbindAllRenderTargets
vs = IrisTextureEditorPreview.hlsl
ps = IrisTextureEditorPreview.hlsl
blend = ADD SRC_ALPHA INV_SRC_ALPHA
cull = none
topology = triangle_strip
o0 = set_viewport bb
draw = 4, 0
;post o0 = null
post vs-t0 = null
post ps-t0 = null

[Present]
if $iris_texture_editor_open == 1
    run = CommandListIrisTextureEditorDraw
endif

