namespace = NuraUI\Modules\Example

[Constants]
global $nura_ui_example_module_id = 4097
global $nura_ui_example_module_slot = 32
global $nura_ui_example_module_registered = 0
global $nura_ui_example_widgets_registered = 0
global persist $nura_ui_example_slider_value = 0.35
global persist $nura_ui_example_toggle_value = 0.0
global persist $nura_ui_example_action_value = 0.0
global persist $nura_ui_example_cycle_value = 0.0

[ResourceNuraUIModuleExampleSlot]
type = RWBuffer
format = R32_FLOAT
array = 1

[Present]
; Do not register before Core has cleared the registry. If Include order is reversed,
; registration simply waits until the next Present rather than being erased afterward.
if $\NuraUI\nura_ui_module_registry_initialized == 1 && $nura_ui_example_module_registered == 0
    run = CommandListNuraUIExampleRegister
endif
if $nura_ui_example_module_registered == 1 && $nura_ui_example_widgets_registered == 0
    run = CommandListNuraUIExampleRegisterWidgets
endif
if $nura_ui_example_module_registered == 1 && $nura_ui_example_widgets_registered == 1
    run = CommandListNuraUIExamplePersistWidgets
endif
if $nura_ui_example_module_registered == 1
    run = CommandListNuraUIExampleFrame
endif

[CommandListNuraUIExampleRegister]
local $nura_ui_example_prev_x68 = x68
x68 = $nura_ui_example_module_id
run = CustomShaderNuraUIExampleRegister
x68 = $nura_ui_example_prev_x68
store = $nura_ui_example_module_slot, ResourceNuraUIModuleExampleSlot, 0
if $nura_ui_example_module_slot < 32
    $nura_ui_example_module_registered = 1
endif

[CustomShaderNuraUIExampleRegister]
cs = ..\..\Core\NuraUIModuleRegister.hlsl
cs-u0 = Resource\NuraUI\NuraUIModuleRegistry
cs-u1 = ResourceNuraUIModuleExampleSlot
dispatch = 1, 1, 1
cs-u0 = null
cs-u1 = null

