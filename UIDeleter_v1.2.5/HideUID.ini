namespace = HideUID
;Main script

[constants]
global persist $HideUID = 1

global $NameCard = 0
global $ProfileBackground = 0
global $MiliastraProfileFlower = 0

[Present]
$NameCard = 0
$ProfileBackground = 0
$MiliastraProfileFlower = 0
;run = CommandListDependencies

[keyHide]
key = no_modifiers f11
type = cycle
$HideUID = 0,1


; --- Pause Menu ---------------------------
[TextureOverrideNameCardEffect.T0]
hash = d1ea1f43
match_priority = 711
;modders are unlikely to want to use this effect, so I'm ok with using filter index
filter_index = 2.71828

[ShaderOverride->NamecardEffect.VS]
;hash = 6d0cbd9c26768d2b
hash = da0c4549201d7d34
;dump = ps-t0
allow_duplicate_hash = true
if ps-t0 == 2.71828
  $NameCard = 1
endif

; --- Profile Menu -------------------------
[TextureOverride->ProfileBackground.T0]
hash = a27bd495
match_priority = 711
$ProfileBackground = 1

[TextureOverride->MiliastraProfileDecoration.T1]
hash = 7a17c5f3
match_priority = 711
$MiliastraProfileFlower = 1

; Fix "Portrait" text in Pause Menu -> Edit Profile -> Change Avatar
; uses draw order to cancel $ProfileBackground for further calls in the frame
[TextureOverride->MenuBackgroundDecoration.T0]
hash = 1988165a
match_priority = 711
$ProfileBackground = 0

; Fix Text being removed when charting course in chronicled or weapon event
[TextureOverride->WishChartCourse.T0]
hash = e5b7fb9b
match_priority = 711
$ProfileBackground = 0

; --- UI Text Buffers ----------------------
[TextureOverride->UIFontAtlas.256x512]
; initially used on first loading screen
hash = 34514525
match_priority = 711
filter_index = 2.71828

[TextureOverride->UIFontAtlas.512x512]
; initially used on first loading screen if you opened settings
hash = 87504f67
match_priority = 711
filter_index = 2.71828

[TextureOverride->UIFontAtlas.1024x1024]
hash = 26ba2a16
match_priority = 711
filter_index = 2.71828

[TextureOverride->UIFontAtlas.1024x2048]
hash = a75e52ef
match_priority = 711
filter_index = 2.71828

[TextureOverride->UIFontAtlas.2048x2048]
hash = 60829605
match_priority = 711
filter_index = 2.71828

[TextureOverride->UIFontAtlas.2048x4096]
hash = 66a61106
match_priority = 711
filter_index = 2.71828

; --- Custom Shader ------------------------
[ShaderOverride->UI.VS]
hash = f61f9bc2a15bedef
allow_duplicate_hash = overrule
;dump = o0
;dump = oD dds
;dump = ps-t0 dds

; One useful thing is that the Profile background is drawn after the pause menu but before the profile text.
; This means the text behind the profile menu is not affected by the vertex shader
if $HideUID
  ;This is to make the UID ALWAYS hidden even when $costume_mods is off
  checktextureoverride = ps-t0
  checktextureoverride = ps-t1

  ; UID is always first_index == 0, so that's an extra filter to not touch all the UI text. Else I wouldn't even check other variables
  ; first_index is doing a lot of work here, because anything that passes this filter cannot be hidden later
  ; When uncalibrated, doesn't check the filters. Should stop UID showing on first launch
  if ps-t0 == 2.71828 && ($NameCard || $ProfileBackground || $MiliastraProfileFlower || first_index == 0)
  ;if ps-t0 == 2.71828
    local $x0 = x0
    x0 = $NameCard + $ProfileBackground * 2 + $MiliastraProfileFlower * 4
    ;$\ClutterReducer\Skip_UI = 1

    handling = skip
    ; if uncalibrated, we literally skip the text to hide it. This is better than leaking your UID, I'd say
    if $\UI\Calibrated
      run = CustomShader->UI.VS
    endif
    ; This means the next shader to run for this draw call (so, ClutterReducer's shader main)
    ; won't actually draw anything. So after handling stuff with this shader, everything else is skipped

    ; There are issues because I need to filter out any UI correctly before running this shader, and clutterreducer touches text too.
    ; For now there are no issues because first_index works well but I expect that could change.
    vb0 = null

    x0 = $x0
  endif
endif

[CustomShader->UI.VS]
vs =  .\Override-f61f9bc2a15bedef-vs.hlsl
vs-t0 = Resource\UI\UIParams
vs-t1 = oD
draw = from_caller
handling = skip

; --- Dependency check ---------------------
[CommandListDependencies]
if 0
; if lib is missing, "elif" line will fail to parse and "else" will run.
elif $\UI\calibrated !== null
else
  Resource\shaderfixes\help.ini\Help = ref ResourceDependencyNotification
  Resource\shaderfixes\help.ini\Params = ref Resource\shaderfixes\help.ini\ParamsShort
  ; Dummy call with XXMI, actual call with GIMI
  ;run = CustomShader\shaderfixes\help.ini\FormatText
endif

[ResourceDependencyNotification]
type = buffer
data = "UI Scale & Padding Library Missing!"


