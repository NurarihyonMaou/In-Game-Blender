global $ref_height = 1080


global $scale_w
post $scale_w = res_width / $ref_width


global $scale_h
post $scale_h = res_height / $ref_height


global $scale_ref
if $scale_w > $scale_h
    post $scale_ref = $scale_h
else
    post $scale_ref = $scale_w
endif

