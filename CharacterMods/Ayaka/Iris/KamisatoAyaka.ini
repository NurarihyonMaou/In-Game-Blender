y43 = $PrevY43
z43 = $PrevZ43
w43 = $PrevW43

[CommandListMeshEditorFinishStroke]
if $mesh_editor_stroke_active == 1
    if $mesh_editor_stroke_dab_count > 0
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 1] = $mesh_editor_stroke_dab_count
        $mesh_editor_current_stroke = $mesh_editor_current_stroke + 1

        if $mesh_editor_current_stroke > $mesh_editor_max_stroke
            $mesh_editor_max_stroke = $mesh_editor_current_stroke
        endif
    else
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 0] = 0
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 1] = 0
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 2] = 0
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 3] = 0
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 4] = 0
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 5] = 0
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 6] = 0
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 7] = 0
    endif

    $mesh_editor_stroke_active = 0
    $mesh_editor_active_tool = 0
    $mesh_editor_active_vertex = -1
    $mesh_editor_stroke_dab_start = 0
    $mesh_editor_stroke_dab_count = 0
    $mesh_editor_grab_commit_pending = 0
endif

[CommandListMeshEditorRecordWeightDab]
local $Valid
local $X
local $Y
local $Z

store = $Valid, ResourceMeshEditorState, 71

if $Valid > 0.5 && $mesh_editor_current_dab < $mesh_editor_dabs_limit
    store = $X, ResourceMeshEditorState, 68
    store = $Y, ResourceMeshEditorState, 69
    store = $Z, ResourceMeshEditorState, 70

    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 0] = $X
    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 1] = $Y
    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 2] = $Z
    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 3] = $mesh_editor_weight_strength
    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 4] = $falloff_radius

    $mesh_editor_current_dab = $mesh_editor_current_dab + 1
    $mesh_editor_stroke_dab_count = $mesh_editor_stroke_dab_count + 1
    $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 1] = $mesh_editor_stroke_dab_count
endif

[CommandListMeshEditorRecordSmoothDab]

local $DabValid
local $X
local $Y
local $Z

store = $DabValid, ResourceMeshEditorState, 63

if $DabValid > 0.5
    store = $X, ResourceMeshEditorState, 60
    store = $Y, ResourceMeshEditorState, 61
    store = $Z, ResourceMeshEditorState, 62

    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 0] = $X
    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 1] = $Y
    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 2] = $Z
    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 3] = $mesh_editor_smooth_strength
    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 4] = $falloff_radius

    $mesh_editor_current_dab = $mesh_editor_current_dab + 1
    $mesh_editor_stroke_dab_count = $mesh_editor_stroke_dab_count + 1
    $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 1] = $mesh_editor_stroke_dab_count
endif

; ============================================================================
