namespace = NuraThings\Public\Core\V7FallBacks

; Version 1.0

[Constants]
global $frame

global $cursor_x
global $cursor_y

global $res_width
global $res_height


[Present]
if ($frame % 300) == 0
    post run = CommandListScreenFallback
endif

run = CommandListCursorFallback

post $frame = $frame+1

[CommandListScreenFallback]
if res_width > 0 && res_height > 0
    $res_width = res_width
    $res_height = res_height
elif rt_width > 0 && rt_height > 0
    $res_width = rt_width
    $res_height = rt_height
elif window_width > 0 && window_height > 0
    $res_width = window_width
    $res_height = window_height
else
    $res_width = 1920
    $res_height = 1080
endif


[CommandListCursorFallback]
if cursor_x > 0 && cursor_y > 0 && cursor_x < 1 && cursor_y < 1
    $cursor_x = cursor_x
    $cursor_y = cursor_y
elif cursor_window_x > 0 && cursor_window_y > 0 && cursor_window_x < 1 && cursor_window_y < 1
    $cursor_x = cursor_window_x / $res_width
    $cursor_y = cursor_window_y / $res_height
else
    $cursor_x = cursor_screen_x / $res_width
    $cursor_y = cursor_screen_y / $res_height
endif