[CommandListMeshEditorRunMaskOperation]
x37 = $mesh_editor_mask_operation_slot
y37 = $mesh_editor_mask_operation
w37 = $mesh_editor_mask_operation_slot

if $mesh_editor_mask_operation == 3
    z37 = 0.5
else if $mesh_editor_mask_operation == 4
    z37 = 2.0
else if $mesh_editor_mask_operation == 5
    z37 = 0.5
else if $mesh_editor_mask_operation == 6
    z37 = 0.5
else
    z37 = 0
endif

if $mesh_editor_mask_operation <= 4
    run = CustomShaderMeshEditorMaskOps
else
    clear = ResourceMeshEditorMaskSmoothAccum

    run = CustomShaderMeshEditorMaskSmoothAccumulate
    run = CustomShaderMeshEditorMaskSmoothApply
endif

[CommandListMeshEditorApplyMaskOperation]
if $mesh_editor_enabled == 1 && $mesh_editor_restore_active == 0 && $mesh_editor_stroke_active == 0

    if $mesh_editor_active_mask_slot >= 0 && $mesh_editor_active_mask_slot <= 7

        ; Discard redo history when creating a new operation.
        if $mesh_editor_current_stroke < $mesh_editor_max_stroke
            $mesh_editor_max_stroke = $mesh_editor_current_stroke
        endif

        ; Record the operation if history capacity remains.
        if $mesh_editor_current_stroke < $mesh_editor_strokes_limit && $mesh_editor_current_dab < $mesh_editor_dabs_limit

            $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 0] = $mesh_editor_current_dab
            $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 1] = 1
            $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 2] = 8 + $mesh_editor_mask_operation
            $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 3] = -1
            $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 4] = $mesh_editor_mirror
            $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 5] = $mesh_editor_mirror_axis
            $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 6] = $mesh_editor_mirror_plane
            $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 7] = $mesh_editor_active_mask_slot

            $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 0] = 0
            $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 1] = 0
            $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 2] = 0
            $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 3] = 0
            $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 4] = 0

            $mesh_editor_current_dab = $mesh_editor_current_dab + 1

            $PoolMeshEditorStrokeMaskFlags[$mesh_editor_current_stroke] = $mesh_editor_mask_active_flags
            $PoolMeshEditorStrokeMaskFlagsValid[$mesh_editor_current_stroke] = 1

            $mesh_editor_current_stroke = $mesh_editor_current_stroke + 1

            if $mesh_editor_current_stroke > $mesh_editor_max_stroke
                $mesh_editor_max_stroke = $mesh_editor_current_stroke
            endif

        endif

        ; Apply to the selected named mask.
        $mesh_editor_mask_operation_slot = $mesh_editor_active_mask_slot

        run = CommandListMeshEditorRunMaskOperation

    endif
endif

