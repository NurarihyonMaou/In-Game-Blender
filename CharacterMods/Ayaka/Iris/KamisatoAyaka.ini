global persist $mesh_editor_mirror_plane = 0.0
global $mesh_editor_mirror_epsilon = 0.00001
global $mesh_editor_stroke_mirror = 0
global $mesh_editor_stroke_mirror_axis = 0
global $mesh_editor_stroke_mirror_plane = 0.0

; STROKE / UNDO HISTORY
global persist $mesh_editor_current_stroke = 0
global persist $mesh_editor_max_stroke = 0
global persist $mesh_editor_current_dab = 0
