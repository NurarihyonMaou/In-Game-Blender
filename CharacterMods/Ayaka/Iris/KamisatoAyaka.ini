[CommandListMeshEditorApplyWeightGradient]
local $StartValid
local $PrevX36 = x36
local $PrevY36 = y36
local $PrevZ36 = z36
local $PrevW36 = w36
local $PrevX40 = x40
local $PrevY40 = y40
local $PrevZ40 = z40
local $PrevW40 = w40
local $PrevX41 = x41
local $PrevY41 = y41
local $PrevZ41 = z41
local $PrevW41 = w41
local $PrevX42 = x42
local $PrevY42 = y42
local $PrevZ42 = z42
local $PrevW42 = w42
local $PrevX43 = x43
local $PrevY43 = y43
local $PrevZ43 = z43
local $PrevW43 = w43

$StartValid = $PoolMeshEditorWeightGradientSettings[$mesh_editor_current_stroke * 9 + 8]
if $StartValid > 0.5 && $mesh_editor_current_dab < $mesh_editor_dabs_limit
    run = CustomShaderMeshEditorWeightGradient

    ; One history dab stores the operation's anchor. The full endpoint pair,
    ; radius and strength live in the per-stroke GradientSettings pool.
    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 0] = $PoolMeshEditorWeightGradientSettings[$mesh_editor_current_stroke * 9 + 0]
    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 1] = $PoolMeshEditorWeightGradientSettings[$mesh_editor_current_stroke * 9 + 1]
    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 2] = $PoolMeshEditorWeightGradientSettings[$mesh_editor_current_stroke * 9 + 2]
    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 3] = $PoolMeshEditorWeightGradientSettings[$mesh_editor_current_stroke * 9 + 7]
    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 4] = $PoolMeshEditorWeightGradientSettings[$mesh_editor_current_stroke * 9 + 6]

    $mesh_editor_current_dab = $mesh_editor_current_dab + 1
    $mesh_editor_stroke_dab_count = $mesh_editor_stroke_dab_count + 1
    $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 1] = $mesh_editor_stroke_dab_count
endif

; Restore shared IniParams so the Gradient dispatch cannot leak parameters
; into unrelated shaders/UI systems.
x36 = $PrevX36
y36 = $PrevY36
z36 = $PrevZ36
w36 = $PrevW36
x40 = $PrevX40
