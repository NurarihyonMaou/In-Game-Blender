; COMMAND LISTS


[CommandListIsWithinMenuRange]
if cursor_x >= $offset_x && cursor_y >= $offset_y && cursor_x <= $offset_x + $menu_width && cursor_y <= $offset_y + $menu_height
    $InRange = 1
else
    $InRange = 0
endif


[CommandListSetWaitFrame]
$wait_frame = $frame


[CommandListStorePackedColors]
$previousPackedHSL = $packedHSL
$previousPackedHSV = $packedHSV
$previousPackedRGB = $packedRGB

if $selector_type == 0
    store = $packedHSV, ResourceStoreColors, 3
elif $selector_type == 1
    store = $packedRGB, ResourceStoreColors, 3
elif $selector_type == 2
    store = $packedHSL, ResourceStoreColors, 3
endif


[CommandListStoreHSV]
store = $hue, ResourceStoreColors, 0
store = $saturation, ResourceStoreColors, 1
store = $value, ResourceStoreColors, 2

if $selector_type == 2
    $hue = $hue * 360
endif

[CommandListAddType]
$selector_type = $selector_type + 1
if $selector_type == 3
    $selector_type = 0
endif

$selector_type_changed = 2

[CommandListMinusType]
$selector_type = $selector_type - 1
if $selector_type == -1
    $selector_type = 2
endif

$selector_type_changed = 2

; KEYS

[KeyMenu]
key = VK_CONTROL N
type = cycle
$menu = 0,1

[KeyAffectHSV]
condition = $menu
key = VK_ALT VK_CONTROL
type = hold
$check_color = 1
run = CommandListSetWaitFrame


[KeySelectorTypeAdd]
condition = $menu
key = >
run = CommandListAddType

[KeySelectorTypeMinus]
condition = $menu
key = <
run = CommandListMinusType

