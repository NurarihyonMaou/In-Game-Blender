; ============================================================================
; FRAME COMMAND LIST
; ============================================================================

[CommandListMeshEditorFrame]
if time != $mesh_editor_last_update
    if $mesh_editor_enabled == 1
        if $mesh_editor_mask_combine_dirty == 1 || $mesh_editor_mask_active_flags != $mesh_editor_mask_flags_for_combine
            run = CommandListMeshEditorCombineMasks
            $mesh_editor_mask_combine_dirty = 0
        endif

        ; Capture/depth/picking scan ~79k vertices and the combined index buffer.
        ; Refresh on motion/interaction immediately and throttle stationary hover to ~30 Hz.
        if $mesh_editor_pick_cache_valid == 0 || cursor_window_x != $mesh_editor_last_pick_x || cursor_window_y != $mesh_editor_last_pick_y || window_width != $mesh_editor_last_pick_window_w || window_height != $mesh_editor_last_pick_window_h || $mesh_editor_tool != $mesh_editor_last_pick_tool || $mesh_editor_lmb != $mesh_editor_last_pick_lmb || $mesh_editor_lmb == 1 || time - $mesh_editor_last_pick_time >= 0.033
            run = CustomShaderMeshEditorCapture
            run = CustomShaderMeshEditorVisibleDepth
            run = CustomShaderMeshEditorPick
            $mesh_editor_last_pick_x = cursor_window_x
            $mesh_editor_last_pick_y = cursor_window_y
            $mesh_editor_last_pick_window_w = window_width
            $mesh_editor_last_pick_window_h = window_height
            $mesh_editor_last_pick_tool = $mesh_editor_tool
            $mesh_editor_last_pick_lmb = $mesh_editor_lmb
            $mesh_editor_last_pick_time = time
            $mesh_editor_pick_cache_valid = 1
        endif
        run = CustomShaderMeshEditorState

        if $mesh_editor_lmb == 1
            if $mesh_editor_tool == 2
                run = CommandListMeshEditorSmooth
                run = CustomShaderMeshEditorDeform
            elif $mesh_editor_tool == 7
                x33 = $falloff_radius
                z34 = $mesh_editor_invert_direction
                x37 = $mesh_editor_mask_strength

                if $mesh_editor_stroke_active
                    x36 = $mesh_editor_stroke_mirror
                    y36 = $mesh_editor_stroke_mirror_axis
                    z36 = $mesh_editor_stroke_mirror_plane
                else
                    x36 = $mesh_editor_mirror
                    y36 = $mesh_editor_mirror_axis
                    z36 = $mesh_editor_mirror_plane
                endif

                w36 = $mesh_editor_mirror_epsilon
                run = CustomShaderMeshEditorMaskPaint
                $mesh_editor_mask_combine_dirty = 1

            elif $mesh_editor_tool == 15 && $mesh_editor_stroke_active == 1
                if $mesh_editor_current_stroke < $mesh_editor_strokes_limit && $mesh_editor_current_dab < $mesh_editor_dabs_limit
                    if $mesh_editor_weight_mode == 3
                        x40 = $mesh_editor_weight_vg_id
                        run = CustomShaderMeshEditorWeightSnapshot
                    endif
                    if $mesh_editor_weight_mode != 4
                        run = CustomShaderMeshEditorWeightPaint
                    endif
                endif
            endif
        endif
    else
        $mesh_editor_pick_cache_valid = 0
    endif

    $mesh_editor_last_update = time
endif

