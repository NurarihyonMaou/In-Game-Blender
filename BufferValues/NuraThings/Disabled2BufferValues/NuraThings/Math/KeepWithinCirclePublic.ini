namespace = NuraThings\Public\KeepWithinCircle

; Version 1.0

[Constants]
global $start_x
global $start_y

global $center_x
global $center_y

global $dstSqrd
global $result

global $circle_size


[CommandListRun]
local $radius = ($circle_size*0.5)

$center_x = ($start_x - 0.002) * $\NuraThings\Public\Core\V7FallBacks\res_width + $radius
$center_y = ($start_y - 0.002) * $\NuraThings\Public\Core\V7FallBacks\res_height + $radius

$dstSqrd = (($\NuraThings\Public\Core\V7FallBacks\cursor_x * $\NuraThings\Public\Core\V7FallBacks\res_width - $center_x) ** 2) + (($\NuraThings\Public\Core\V7FallBacks\cursor_y * $\NuraThings\Public\Core\V7FallBacks\res_height - $center_y) ** 2)
$result = $dstSqrd <= $radius ** 2