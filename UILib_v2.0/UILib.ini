namespace = UI

[constants]

global $SHOW_NOTIFICATION = 0

; If you are a modder, please look at Guide.md before peeking here
; If you are not a modder, go away! Woosh! Bad user!

global $calibrated = 0
global $active = 0
global $activeTime = 0
global $LoadingScreen = 0
global $screen_width = 0
global $screen_height = 0
$screen_height = res_height
$screen_width = res_width

if time > 15
  run = CommandListRecalibrate
endif

[CommandListRecalibrate]
$calibrated = 0
if $SHOW_NOTIFICATION == 1
	Resource\shaderfixes\help.ini\Help = ref ResourceCalibrationNotification
	Resource\shaderfixes\help.ini\Params = ref ResourceCalibrationParams
	; Dummy call with XXMI, actual call with GIMI
	run = CustomShader\shaderfixes\help.ini\FormatText
endif


[CommandListClearNotification]
if $SHOW_NOTIFICATION == 1
	Resource\shaderfixes\help.ini\Help = null
endif

; -------------------- Present --------------------
[present]
if !$active || $LoadingScreen
  $activeTime = time
endif
if $active && (time - $activeTime > 0.3) && !$calibrated
	$calibrated = 1
	run = CommandListClearNotification
endif

$active = 0
$LoadingScreen = 0

; recalibrate
if ((res_height != $screen_height) || (res_width != $screen_width)) && $calibrated
	run = CommandListRecalibrate
	$screen_height = res_height
	$screen_width = res_width
endif



; ------------------- Detection -------------------
[TextureOverride->LoadingScreenHydroIcon]
; Used for initial calibration, to only calibrate once the loading screen disappears
hash = 29feba14
match_priority = 16
$LoadingScreen = 1

[TextureOverride->LoadingScreenBar]
hash = 77fe5250
match_priority = 16
$LoadingScreen = 1

[TextureOverride->MinimapCircle]
hash = fde82878
match_priority = 16
$active = 1
;dump = vb0
;Resource\Debugger\Debug = copy vb0
run = CustomShader->FetchUIPosition

; ---------------- Compute Shader -----------------
[CustomShader->FetchUIPosition]
cs = .\ReadMinimapScale-cs.hlsl
local $x0 = x0
x0 = FIRST_VERTEX
cs-t0 = vb0
cs-cb1 = vs-cb1
cs-cb2 = vs-cb2
cs-u0 = ResourceMinimapBorderVertices
; Because this runs in the same drawcall as the vertex/pixel shader, 
; you can't access the resource buffer as a SRV and UAV at the same time
cs-u1 = ResourceUIParamsOut
; shader has 4 x threads to read the 4 vertices
dispatch = 1,1,1
x0 = $x0
ResourceUIParams = ResourceUIParamsOut

;post ResourceUIParams = copy cs-u1

; ------------------- Resources -------------------
;Stored as an array[4] of float2 representing xy vertex positions
[ResourceMinimapBorderVertices]
;RWStructuredBuffer because it's only used as unordered access view, and I read/write in the same draw call
type = RWStructuredBuffer
stride = 8
array = 4

;float2 scale, float2 padding
[ResourceUIParams]
;Read as SRV, copy of ResourceUIParamsOut
type = Buffer
format = R32G32_FLOAT
array = 2

;float2 scale, float2 padding
[ResourceUIParamsOut]
;Written as UAV
type = RWBuffer
format = R32G32_FLOAT
array = 2


[ResourceCalibrationNotification]
type = buffer
format = R8_UINT
filename = .\CalibrationNotification.buf

[ResourceCalibrationParams]
type = StructuredBuffer
array = 1
data = R32_FLOAT  -0.95 0.95 0.95 -0.95        0.1 0.1 0.1 1     0 0 0 0.5        0.01 0.01    3 1   1   1
;                  ^^^^Rectangle^^^^  | ^^^Colour^^^ | Background | ^Border^^ | ^ ^ | ^ | ^-- font scale
;                 x1    y1  x2   y2   | r g   b    a | r g b a    | horz vert |  ^  | ^------ text alignment: 0=left 1=center 2=right
;                   range -1:+1       |              |            |           |  ^----------- h/v-anchor: 0=none 1=left/top 2=center 3=right/bottom
