[CommandListMenuIndexUp]
$menu_index = $menu_index + 1

if $menu_index > 13 
    $menu_index = 0
endif


[CommandListMenuIndexDown]
$menu_index = $menu_index - 1

if $menu_index < 0 
    $menu_index = 13
endif


[CommandListHandleMenuItem]
if $menu_index == 0
    $BraPlate = !$BraPlate

elif $menu_index == 1
    $ShoulderPlate = !$ShoulderPlate

elif $menu_index == 2
    $Belt = !$Belt

elif $menu_index == 3
    $Choker = !$Choker

elif $menu_index == 4
    $EarRings = !$EarRings

elif $menu_index == 5
    $Ring = !$Ring

elif $menu_index == 6
    $Sleeves = !$Sleeves

elif $menu_index == 7
    $Boots = !$Boots

elif $menu_index == 8
    $KneeCaps = !$KneeCaps

elif $menu_index == 9
    if $menu_direction == 0
        $Skirt = $Skirt - 1
    elif $menu_direction == 1
        $Skirt = $Skirt + 1
    endif

    if $Skirt < 0
        $Skirt = 3
    endif

    if $Skirt > 3
        $Skirt = 0
    endif

elif $menu_index == 10
    if $menu_direction == 0
        $booba_stiffnes = $booba_stiffnes - 1
    elif $menu_direction == 1
        $booba_stiffnes = $booba_stiffnes + 1
    endif

elif $menu_index == 11
    if $menu_direction == 0
        $booba_damping = $booba_damping - 0.01
    elif $menu_direction == 1
        $booba_damping = $booba_damping + 0.01
    endif

elif $menu_index == 12
    if $menu_direction == 0
        $booba_jig = $booba_jig - 0.1
    elif $menu_direction == 1
        $booba_jig = $booba_jig + 0.1
    endif

elif $menu_index == 13
    if $menu_direction == 0
        $booba_dt = $booba_dt - 0.01
    elif $menu_direction == 1
        $booba_dt = $booba_dt + 0.01
    endif
endif

$menu_direction = -1


