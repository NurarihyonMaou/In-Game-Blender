; Build simple key gates every frame. Keep the actual Key condition= lines short;
; some XXMI/3DMigoto builds report Syntax Error for very long condition expressions.
[CommandListMeshEditorUpdateKeyGates]
$mesh_editor_key_gate_move = 0
$mesh_editor_key_gate_scale = 0
$mesh_editor_key_gate_scale_active = 0
$mesh_editor_key_gate_rotate = 0
$mesh_editor_key_gate_rotate_active = 0
$mesh_editor_key_gate_lmb = 0
$mesh_editor_key_gate_legacy_xyz = 0
$mesh_editor_key_gate_history = 0
$mesh_editor_key_gate_edge = 0
$mesh_editor_key_gate_select = 0
$mesh_editor_key_gate_clear_selection = 0

; Idle/edit gates. Keep Key condition expressions short for older parser builds.
if $mesh_editor_move_active == 0
    if $mesh_editor_scale_active == 0
        if $mesh_editor_rotate_active == 0
            if $\NuraUI\nt_mask_rename_active == 0
                $mesh_editor_key_gate_legacy_xyz = 1
                if $mesh_editor_restore_active == 0
                    $mesh_editor_key_gate_history = 1
                    if $mesh_editor_enabled == 1
                        $mesh_editor_key_gate_lmb = 1
                    endif
                endif
            endif
        endif
    endif
endif

if $mesh_editor_scale_active == 1
    if $mesh_editor_restore_active == 0
        if $\NuraUI\nt_mask_rename_active == 0
            $mesh_editor_key_gate_scale_active = 1
        endif
    endif
endif

if $mesh_editor_rotate_active == 1
    if $mesh_editor_restore_active == 0
        if $\NuraUI\nt_mask_rename_active == 0
            $mesh_editor_key_gate_rotate_active = 1
        endif
    endif
endif

; Keep selection and transform start gates independent of mesh_editor_enabled,
; matching the pre-R behavior. Transform starts still require the editor enabled.
if $\NuraUI\nt_overlay
    if $mesh_editor_topology_overlay == 1
        if $mesh_editor_move_active == 0
            if $mesh_editor_scale_active == 0
                if $mesh_editor_rotate_active == 0
                    if $mesh_editor_stroke_active == 0
                        if $mesh_editor_restore_active == 0
                            if $\NuraUI\nt_mask_rename_active == 0
                                $mesh_editor_key_gate_edge = 1
                                if $mesh_editor_selection_event_count < $mesh_editor_selection_history_limit
                                    $mesh_editor_key_gate_clear_selection = 1
                                    if $mesh_editor_cursor == 1
                                        if $mesh_editor_lmb == 0
                                            $mesh_editor_key_gate_select = 1
                                        endif
                                    endif
                                endif
                                if $mesh_editor_enabled == 1
                                    if $mesh_editor_lmb == 0
                                        $mesh_editor_key_gate_move = 1
                                        $mesh_editor_key_gate_scale = 1
                                        $mesh_editor_key_gate_rotate = 1
                                    endif
                                endif
                            endif
                        endif
                    endif
                endif
            endif
        endif
    endif
endif

