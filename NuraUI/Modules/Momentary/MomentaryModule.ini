store = $nura_ui_momentary_selected_local, Resource\NuraUI\NuraThingsUIState, 55
Resource\NuraThings\Print\Custom\Font = Resource\NuraThings\Print\Custom\PixelFont
if $nura_ui_momentary_slot_local >= $\NuraUI\nt_module_scroll && $nura_ui_momentary_slot_local < $\NuraUI\nt_module_scroll + 8
    $nura_ui_momentary_row_local = $nura_ui_momentary_slot_local - $\NuraUI\nt_module_scroll
    Resource\NuraThings\Print\Custom\Text = ref ResourceNuraUIMomentaryName
    if $nura_ui_momentary_row_local == 0
        Resource\NuraThings\Print\Custom\TextParams = ref Resource\NuraUI\NuraUIModuleRowParams0
    else if $nura_ui_momentary_row_local == 1
        Resource\NuraThings\Print\Custom\TextParams = ref Resource\NuraUI\NuraUIModuleRowParams1
    else if $nura_ui_momentary_row_local == 2
        Resource\NuraThings\Print\Custom\TextParams = ref Resource\NuraUI\NuraUIModuleRowParams2
    else if $nura_ui_momentary_row_local == 3
        Resource\NuraThings\Print\Custom\TextParams = ref Resource\NuraUI\NuraUIModuleRowParams3
    else if $nura_ui_momentary_row_local == 4
        Resource\NuraThings\Print\Custom\TextParams = ref Resource\NuraUI\NuraUIModuleRowParams4
    else if $nura_ui_momentary_row_local == 5
        Resource\NuraThings\Print\Custom\TextParams = ref Resource\NuraUI\NuraUIModuleRowParams5
    else if $nura_ui_momentary_row_local == 6
        Resource\NuraThings\Print\Custom\TextParams = ref Resource\NuraUI\NuraUIModuleRowParams6
    else
        Resource\NuraThings\Print\Custom\TextParams = ref Resource\NuraUI\NuraUIModuleRowParams7
    endif
    run = CommandList\NuraThings\Print\Custom\PrintTextMSDF
endif
if $nura_ui_momentary_selected_local == $nura_ui_momentary_slot_local + 1
    Resource\NuraThings\Print\Custom\Text = ref ResourceNuraUIMomentaryDetailTitle
    Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraUIMomentaryDetailTitleParams
    run = CommandList\NuraThings\Print\Custom\PrintTextMSDF
    Resource\NuraThings\Print\Custom\Text = ref ResourceNuraUIMomentaryDetailBody
    Resource\NuraThings\Print\Custom\TextParams = ref ResourceNuraUIMomentaryDetailBodyParams
    run = CommandList\NuraThings\Print\Custom\PrintTextMSDF
endif
Resource\NuraThings\Print\Custom\Font = Resource\NuraThings\Print\Custom\DefaultFont

