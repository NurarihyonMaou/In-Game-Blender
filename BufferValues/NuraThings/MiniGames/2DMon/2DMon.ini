namespace = NuraThings\MiniGames\2DMon

[Constants]
; Core
global $TwoDMon

global $game_box_x = 0.6
global $game_box_y = 0.6
global $game_offset_x = 0.2
global $game_offset_y = 0.2

; 0 Idle / 1 In-Battle
global $game_state

global $round

; 0 Player / 1 Enemy
global $load_data
; 0 Player / 1 Enemy
global $turn
; 0 Select ; 1 Attack
global $turn_state

global $used_attack

; Enemy Mon
global $enemy_id
global $enemy_gid
global $enemy_name

global $enemy_type
global $enemy_stype

global $enemy_lvl

global $enemy_state
global $enemy_state_rounds

global $enemy_confused
global $enemy_confused_rounds

global $enemy_multiplier

global $enemy_hp = 48
global $enemy_current_hp = 12

global $enemy_atk
global $enemy_satk

global $enemy_def
global $enemy_sdef

global $enemy_speed
global $enemy_accuracy
global $enemy_evasiveness

global $enemy_attack0
global $enemy_attack1
global $enemy_attack2
global $enemy_attack3

global $enemy_attack_pp

global $enemy_attack0_pp_left
global $enemy_attack1_pp_left
global $enemy_attack2_pp_left
global $enemy_attack3_pp_left

; Player Mon
global $id
global $gid
global $name

global $type
global $stype

global $lvl

global $state
global $state_rounds

global $confused
global $confused_rounds

global $multiplier

global $hp = 67
global $current_hp = 56

global $atk
global $satk

global $def
global $sdef

global $speed
global $accuracy
global $evasiveness

global $attack0
global $attack1
global $attack2
global $attack3

global $attack_pp

global $attack0_pp_left
global $attack1_pp_left
global $attack2_pp_left
global $attack3_pp_left

[Present]

if $TwoDMon
    run = CommandListDrawGameBox
    
    if $game_state == 1
        run = CommandListPlayerBox
        run = CommandListDrawPlayerHP
        run = CommandListDrawEnemyHP

        run = Commandlist\NuraThings\MiniGames\2DMon\Pokemon\Charizard
        run = CommandListDrawPokemon

        run = Commandlist\NuraThings\MiniGames\2DMon\Pokemon\VenusAur
        run = CommandListDrawEnemyPokemon
    endif

endif


[Key2DMon]
key = VK_CONTROL 5
type = cycle
smart = true
$TwoDMon = 0,1

[KeyGameState]
key = VK_ALT 5
type = cycle
smart = true
$game_state = 0,1

[CommandListPlayerBox]
$\NuraThings\Draw\width = $game_box_x
$\NuraThings\Draw\height = $game_box_y/5

$\NuraThings\Draw\offset_x = $game_offset_x
$\NuraThings\Draw\offset_y = $game_offset_y + $game_box_y - ($game_box_y/5)

ps-t100 = ResourcePlayerBox

run = CommandList\NuraThings\Draw\Run


[CommandListDrawGameBox]
$\NuraThings\Draw\width = $game_box_x
$\NuraThings\Draw\height = $game_box_y

$\NuraThings\Draw\offset_x = $game_offset_x
$\NuraThings\Draw\offset_y = $game_offset_y

ps-t100 = ResourceGameBox

run = CommandList\NuraThings\Draw\Run


[CommandListDrawPlayerHP]
$\NuraThings\Draw\width = $game_box_x/4
$\NuraThings\Draw\height = $game_box_y/90

$\NuraThings\Draw\offset_x = $game_offset_x + $game_box_x - ($game_box_x/4) - 0.02
$\NuraThings\Draw\offset_y = $game_offset_y + $game_box_y-0.2

$\NuraThings\Draw\special_effect = 69
$\NuraThings\Draw\special_effect_val0 = $current_hp
$\NuraThings\Draw\special_effect_val1 = $hp

;ps-t100 = ResourceHPBar

run = CommandList\NuraThings\Draw\Run

[CommandListDrawEnemyHP]
$\NuraThings\Draw\width = $game_box_x/4
$\NuraThings\Draw\height = $game_box_y/90

$\NuraThings\Draw\offset_x = $game_offset_x+0.075
$\NuraThings\Draw\offset_y = $game_offset_y +0.1

$\NuraThings\Draw\special_effect = 69
$\NuraThings\Draw\special_effect_val0 = $enemy_current_hp
$\NuraThings\Draw\special_effect_val1 = $enemy_hp

;ps-t100 = ResourceHPBar

run = CommandList\NuraThings\Draw\Run


[CommandListDrawPokemon]
$\NuraThings\Draw\width = $game_box_x/3
$\NuraThings\Draw\height = $game_box_y/3

$\NuraThings\Draw\offset_x = $game_offset_x+0.025
$\NuraThings\Draw\offset_y = $game_offset_y + $game_box_y-0.315

ResourcePokemon = copy Resource\NuraThings\MiniGames\2DMon\Pokemon\IconBack

ps-t100 = ResourcePokemon

run = CommandList\NuraThings\Draw\Run


[CommandListDrawEnemyPokemon]
$\NuraThings\Draw\width = $game_box_x/4
$\NuraThings\Draw\height = $game_box_y/4

$\NuraThings\Draw\offset_x = $game_offset_x + $game_box_x - ($game_box_x/3)
$\NuraThings\Draw\offset_y = $game_offset_y +0.05

ResourceEnemyPokemon = copy Resource\NuraThings\MiniGames\2DMon\Pokemon\IconFront

ps-t100 = ResourceEnemyPokemon

run = CommandList\NuraThings\Draw\Run


[ResourcePlayerBox]
filename = /Resources/PlayerBox.png

[ResourceGameBox]
filename = /Resources/GameBox.dds

[ResourcePokemon]

[ResourceEnemyPokemon]