[Constants]
global $carousel = 10
global $target = 10
global $d

global $Dragging

global $CursorStartX
global $CarouselStart

[Present]
;$d = $target - $carousel
;
;$carousel = $carousel + ($d * 0.2)

run = CommandListUpdateDrag

run = CustomShaderCarousel


x46 = 0.69
y46 = 0.69

Resource\NuraThings\Print\Custom\Font = Resource\NuraThings\Print\Custom\ResourcePixelFont
Resource\NuraThings\Print\Custom\Text = ref ResourceText
Resource\NuraThings\Print\Custom\TextParams = ref ResourceTextPos
run = CommandList\NuraThings\Print\Custom\PrintText

Resource\NuraThings\Print\Custom\Font = Resource\NuraThings\Print\Custom\DefaultFont

x46 = 0
y46 = 0 

[KeyRight]
key = VK_RIGHT
run = CommandListAdd


[KeyLeft]
key = VK_LEFT
run = CommandListExtract


[CommandListAdd]
$target = $target+1


[CommandListExtract]
$target = $target-1


[KeyDrag]
key = VK_LBUTTON
type = hold
$Dragging = 1
run = CommandListStartDrag

[CommandListStartDrag]
$CursorStartX = cursor_x
$CarouselStart = $carousel


[CommandListUpdateDrag]
local $dxNormalized
local $dragWidth = 0.3
local $DragMaxX = 0.6
local $DragMinX = 0.3

local $CarouselMax = 12
local $CarouselMin = 0

local $clampedX = cursor_x
local $CarouselRange = $CarouselMax - $CarouselMin

local $DragSensitivity = 12

; Clamp cursor to drag area
if $clampedX < $DragMinX
    $clampedX = $DragMinX
endif

if $clampedX > $DragMaxX
    $clampedX = $DragMaxX
endif

if $Dragging
    $dragWidth = $DragMaxX - $DragMinX
    $dxNormalized = (cursor_x - $CursorStartX) / $dragWidth
    $carousel = $CarouselStart + ($dxNormalized * $DragSensitivity)

    $target = $carousel
endif

[CustomShaderCarousel]
cs = CarouselCompute.hlsl

clear = ResourceText

cs-u0 = ResourceText

dispatch = 1,1,1

cs-u0 = null

x200 = $carousel
y200 = 0
z200 = 12
w200 = 2


x201 = 0
y201 = 0.5
z201 = 0.5

[ResourceText]
type = RWBuffer
format = R8_UINT
array = 256

[ResourceTextPos]
type = StructuredBuffer
array = 1
data = R32_FLOAT  -0.02 +0.28 +0.02 0.2  0.00 0.25 0.75 1   0.00001 0.0054901 0.014117 1.0   0.02  0.05   2 2   1   3
;                x49-^  x46-^  x2-^  y2-^   | R-^  G-^  B-^  A-^  | R-^  G-^  B-^  A-^  | ^-H    V-^ | ^ ^ | ^- text alignment: 0=left 1=center 2=right | ^- font scale
;                Rectangle (range -1:+1)  | Text Color          | Background Color    | Border     |  ^- h/v-anchor: 0=none 1=left/top 2=center 3=right/bottom 