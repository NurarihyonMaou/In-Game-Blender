    $color_changed = 1
else
    $color_changed = 0
endif

if $menu

    if $check_color
        run = CommandListIsWithinMenuRange
            
        if $InRange
            $affect_color = 1
            $frame = $frame+1
        else
            $affect_color = 0
        endif
    else
        $affect_color = 0
    endif

    $x91 = x91

    x91 = $affect_color

    run = CustomShaderDrawColorPickers

    ;Resource\Debugger\DebugRW = ref ResourceSomeBuffer

    ps-t100 = copy ResourceColorPickers
    run = CustomShaderDraw

endif

if $selector_type_changed > 0
    post $selector_type_changed = $selector_type_changed - 1
endif

