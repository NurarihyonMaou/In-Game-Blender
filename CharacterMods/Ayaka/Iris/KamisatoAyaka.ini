if $\NuraUI\nt_overlay
    if $mesh_editor_tool == 15
        run = CustomShaderMeshEditorWeightPreview
    else
        run = CustomShaderMeshEditorMaskPreview
    endif
endif

[ResourceMeshEditorMask]
type = RWBuffer
format = R32_FLOAT
array = 79355
flags = SHADER_RESOURCE

[CustomShaderIrisTopologyWire]
ps = MeshEditorMVP/IrisTopologyWirePS.hlsl

; Keep the game's native vertex shader.
cull = none
fill = wireframe
topology = triangle_list

o0 = set_viewport bb

blend = ADD SRC_ALPHA INV_SRC_ALPHA

depth_enable = TRUE
depth_write_mask = ZERO
depth_func = GREATER_EQUAL
depth_clip_enable = FALSE

;if $mesh_editor_body_part == 0
   ; run = CommandListDrawHead
;elif $mesh_editor_body_part == 1
run = CommandListDrawBody
;elif $mesh_editor_body_part == 2
   ; run = CommandListDrawDress
;endif

[CustomShaderIrisTopologyVertices]

; Preserve the game's native vertex shader.
; Generate screen-facing quads from its clip-space positions.
hs = null
ds = null
gs = MeshEditorMVP/IrisTopologyVertex.hlsl
ps = MeshEditorMVP/IrisTopologyVertex.hlsl

cull = none
fill = solid
topology = point_list

o0 = set_viewport bb

blend = ADD SRC_ALPHA INV_SRC_ALPHA

; Reversed-Z, matching the working topology overlay.
depth_enable = TRUE
depth_write_mask = ZERO
depth_func = GREATER_EQUAL
depth_clip_enable = FALSE

;if $mesh_editor_body_part == 0
   ; run = CommandListDrawHead
;elif $mesh_editor_body_part == 1
run = CommandListDrawBody
;elif $mesh_editor_body_part == 2
   ; run = CommandListDrawDress
;endif

[KeyTopo]
condition = $\NuraUI\nt_overlay
key =  NO_MODIFIERS VK_TAB
type = cycle
$mesh_editor_topology_overlay = 0,1

[KeyTopoModes]
condition = $\NuraUI\nt_overlay && $mesh_editor_topology_overlay
key =  VK_SHIFT VK_TAB
type = cycle
$mesh_editor_vertex_overlay = 0,1

; ============================================================================
; CUSTOM JIGGLE — GROUP CENTERS
; ============================================================================

; ============================================================================
; JIGGLE GROUP GPU PIPELINE
; ============================================================================

[ResourceJiggleGroupPartialSums]
type = RWBuffer
format = R32G32B32A32_FLOAT
array = 9920
flags = SHADER_RESOURCE

[ResourceJiggleGroupCenters]
type = RWBuffer
format = R32G32B32A32_FLOAT
array = 8
flags = SHADER_RESOURCE

[CustomShaderJiggleGroupPivotPartials]
cs = Mods/BufferValues/NuraThings/Shaders/JiggleGroupPivotPartials.hlsl

cs-t0 = copy ResourceMeshEditorNamedMasks
cs-t1 = copy ResourceWritablePosition
cs-u0 = ResourceJiggleGroupPartialSums

dispatch = 9920, 1, 1

cs-t0 = null
cs-t1 = null
cs-u0 = null

[CustomShaderJiggleGroupPivotReduce]
cs = Mods/BufferValues/NuraThings/Shaders/JiggleGroupPivotReduce.hlsl

cs-t0 = copy ResourceJiggleGroupPartialSums
cs-u0 = ResourceJiggleGroupCenters
cs-u1 = ResourceDebug

dispatch = 1, 1, 1

cs-t0 = null
cs-u0 = null
cs-u1 = null

[CommandListJiggleBuildMaskPivots]
run = CustomShaderJiggleGroupPivotPartials
run = CustomShaderJiggleGroupPivotReduce

[ResourceJiggleGroupState]
type = RWBuffer
format = R32G32B32A32_FLOAT
array = 32
flags = SHADER_RESOURCE

[CustomShaderJiggleGroupSimulate]
cs = Mods/BufferValues/NuraThings/Shaders/JiggleGroupSimulate.hlsl

cs-t0 = copy ResourceJiggleGroupCenters
cs-u0 = ResourceJiggleGroupState
cs-u1 = ResourceDebug

dispatch = 1, 1, 1

cs-t0 = null
cs-u0 = null
cs-u1 = null

[CustomShaderJiggleGroupDeform]
cs = Mods/BufferValues/NuraThings/Shaders/JiggleGroupDeform.hlsl

cs-t0 = copy ResourceMeshEditorNamedMasks
cs-t1 = copy ResourceJiggleGroupState
cs-u0 = copy ResourceWritablePosition

dispatch = (79355 + 63) // 64, 1, 1

ResourceWritablePosition = copy cs-u0

cs-t0 = null
cs-t1 = null
cs-u0 = null

