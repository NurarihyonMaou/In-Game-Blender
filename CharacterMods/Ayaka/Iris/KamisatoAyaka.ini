global $mesh_editor_viewport_w = 1.0
global $mesh_editor_viewport_h = 1.0

; BRUSH TOOL / STRENGTHS
global $mesh_editor_tool = 0
global persist $mesh_editor_sculpt_strength = 0.001
global persist $mesh_editor_smooth_strength = 0.35
global persist $mesh_editor_pinch_strength = 0.0025
global persist $mesh_editor_crease_strength = 0.00025
global persist $mesh_editor_flatten_strength = 0.0001
global persist $mesh_editor_scale_strength = 0.01
global $mesh_editor_body_part = 1
