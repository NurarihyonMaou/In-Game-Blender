namespace = NuraThings\Debug

[Constants]
global persist $debug = 1

global $x1
global $y1
global $z1
global $w1

global $preserved_x1
global $preserved_y1
global $preserved_z1
global $preserved_w1


global $x2
global $y2
global $z2
global $w2

global $preserved_x2
global $preserved_y2
global $preserved_z2
global $preserved_w2


global $x3
global $y3
global $z3
global $w3

global $preserved_x3
global $preserved_y3
global $preserved_z3
global $preserved_w3


global $x4
global $y4
global $z4
global $w4

global $preserved_x4
global $preserved_y4
global $preserved_z4
global $preserved_w4


global $x5
global $y5
global $z5
global $w5

global $preserved_x5
global $preserved_y5
global $preserved_z5
global $preserved_w5

[Present]
if $debug
    run = CommandListBackup
    run = CommandListSet

    Resource\RichText\Rich = Resource\NuraThings\Text\String
    run = CustomShader\RichText\Parse

    Resource\NuraThings\Print\Custom\Text = ref Resource\RichText\Parsed
    Resource\NuraThings\Print\Custom\TextParams = ref ResourceStringParsedParams
    run = CommandList\NuraThings\Print\Custom\PrintText

    run = CommandListRestore
endif

[KeyDebug]
key = VK_CONTROL VK_TAB
type = cycle
smart = true
$debug = 0,1


[CommandListSet]
x1 = $x1
y1 = $y1
z1 = $z1
w1 = $w1

x2 = $x2
y2 = $y2
z2 = $z2
w2 = $w2

x3 = $x3
y3 = $y3
z3 = $z3
w3 = $w3

x4 = $x4
y4 = $y4
z4 = $z4
w4 = $w4

x5 = $x5
y5 = $y5
z5 = $z5
w5 = $w5

[CommandListBackup]
$preserved_x1 = x1
$preserved_y1 = y1
$preserved_z1 = z1
$preserved_w1 = w1

$preserved_x2 = x2
$preserved_y2 = y2
$preserved_z2 = z2
$preserved_w2 = w2

$preserved_x3 = x3
$preserved_y3 = y3
$preserved_z3 = z3
$preserved_w3 = w3

$preserved_x4 = x4
$preserved_y4 = y4
$preserved_z4 = z4
$preserved_w4 = w4

$preserved_x5 = x5
$preserved_y5 = y5
$preserved_z5 = z5
$preserved_w5 = w5

[CommandListRestore]
x1 = $preserved_x1
y1 = $preserved_y1
z1 = $preserved_z1
w1 = $preserved_w1

x2 = $preserved_x2
y2 = $preserved_y2
z2 = $preserved_z2
w2 = $preserved_w2

x3 = $preserved_x3
y3 = $preserved_y3
z3 = $preserved_z3
w3 = $preserved_w3

x4 = $preserved_x4
y4 = $preserved_y4
z4 = $preserved_z4
w4 = $preserved_w4

x5 = $preserved_x5
y5 = $preserved_y5
z5 = $preserved_z5
w5 = $preserved_w5


[ResourceStringParsedParams]
type = StructuredBuffer
array = 1
data = R32_FLOAT   -0.5 0.0 0.5 -0.5  0.15 1.0 0.15 1   0.01 0.00549 0.0177647 1.0   0.02  0.05   2 1   1   2