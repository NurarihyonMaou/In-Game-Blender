[Constants]
global $flags_packed
global $flag_index

global $flag_0
global $flag_1
global $flag_2
global $flag_3
global $flag_4
global $flag_5
global $flag_6

post $flags_packed = (0 * 1) + (1 * 10) + (2 * 100) + (0 * 1000) + (0 * 10000) + (3 * 100000) + (0 * 1000000)

[Present]

x6 = ($flags_packed // 1) % 10
y6 = ($flags_packed // 10) % 10
z6 = ($flags_packed // 100) % 10
w6 = ($flags_packed // 1000) % 10

x7 = ($flags_packed // 10000) % 10
y7 = ($flags_packed // 100000) % 10
z7 = ($flags_packed // 1000000) % 10

[CommandListRePack]
local $new_flag = -1
local $old_flag = -1
local $flag_multipier

if $flag_index == 0
    $flag_multipier = 1
    $new_flag = $flag_0

elif $flag_index == 1
    $flag_multipier = 10
    $new_flag = $flag_1

elif $flag_index == 2
    $flag_multipier = 100
    $new_flag = $flag_2

elif $flag_index == 3
    $flag_multipier = 1000
    $new_flag = $flag_3

elif $flag_index == 4
    $flag_multipier = 10000
    $new_flag = $flag_4

elif $flag_index == 5
    $flag_multipier = 100000
    $new_flag = $flag_5

elif $flag_index == 6
    $flag_multipier = 1000000
    $new_flag = $flag_6

endif

$old_flag = ($flags_packed // $flag_multipier) % 10

if $new_flag >= 0
    $flags_packed = $flags_packed - ($old_flag * $flag_multipier) + ($new_flag * $flag_multipier)
endif