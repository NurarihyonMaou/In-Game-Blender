[CommandListNuraUIExampleFrame]
local $nura_ui_example_page
local $nura_ui_example_selected
local $nura_ui_example_scroll_prev = y118
store = $nura_ui_example_page, Resource\NuraUI\NuraThingsUIState, 0
store = $nura_ui_example_selected, Resource\NuraUI\NuraThingsUIState, 55
if $\NuraUI\nt_ui == 1 && $nura_ui_example_page == 6
    y118 = $\NuraUI\nt_module_scroll
    run = CustomShaderNuraUIExampleModulePanel
    run = CommandListNuraUIExampleDirectoryText
else if $\NuraUI\nt_ui == 1 && $nura_ui_example_page == 7 && $nura_ui_example_selected == $nura_ui_example_module_slot + 1
    run = CustomShaderNuraUIExampleModulePanel
    run = CommandListNuraUIExampleViewText
endif
y118 = $nura_ui_example_scroll_prev

