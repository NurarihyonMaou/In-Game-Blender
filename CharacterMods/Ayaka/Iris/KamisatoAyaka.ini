endif

post $last_draw_n = $draw_n
post $draw_n = 0

[Present]
if $val_id >= 0 && $val_id < 8
    run = CommandListAlterVal
endif

post $active = 0

if $mesh_editor_cursor
    run = CustomShaderMeshEditorOverlay
    ;run = CommandListDrawBlenderMode
endif

if $mesh_editor_enabled == 1 && $iris_pose_preview_enabled == 1
    run = CommandListIrisPoseDrawPreview
endif

if $mesh_editor_grab_commit_pending == 1 && $mesh_editor_stroke_active == 1
    run = CommandListMeshEditorRecordGrabDab
    run = CommandListMeshEditorFinishStroke
else
    if $mesh_editor_lmb == 1 && $mesh_editor_stroke_active == 0

        if ($mesh_editor_tool == 7 && $mesh_editor_active_mask_slot == -1) || ($mesh_editor_current_stroke >= $mesh_editor_strokes_limit) || ($mesh_editor_current_dab >= $mesh_editor_dabs_limit)
            ; Do nothing: no active mask slot or no remaining history capacity.
        else

            if $mesh_editor_current_stroke < $mesh_editor_max_stroke
                $mesh_editor_max_stroke = $mesh_editor_current_stroke
            endif

            $mesh_editor_stroke_active = 1
            $mesh_editor_active_tool = $mesh_editor_tool
            $mesh_editor_active_weight_mode = $mesh_editor_weight_mode
            $mesh_editor_active_vertex = -1
            $mesh_editor_stroke_dab_start = $mesh_editor_current_dab
            $mesh_editor_stroke_dab_count = 0
            $mesh_editor_grab_commit_pending = 0

            $mesh_editor_stroke_mirror = $mesh_editor_mirror
            $mesh_editor_stroke_mirror_axis = $mesh_editor_mirror_axis
            $mesh_editor_stroke_mirror_plane = $mesh_editor_mirror_plane

            $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 0] = $mesh_editor_stroke_dab_start
            $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 1] = 0
            $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 2] = $mesh_editor_active_tool
            $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 3] = -1
            $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 4] = $mesh_editor_stroke_mirror
            $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 5] = $mesh_editor_stroke_mirror_axis
            $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 6] = $mesh_editor_stroke_mirror_plane

            $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 7] = $mesh_editor_active_mask_slot

            $PoolMeshEditorStrokeMaskFlags[$mesh_editor_current_stroke] = $mesh_editor_mask_active_flags
            $PoolMeshEditorStrokeMaskFlagsValid[$mesh_editor_current_stroke] = 1

            if $mesh_editor_active_tool == 15
                $PoolMeshEditorWeightStrokeSettings[$mesh_editor_current_stroke * 3 + 0] = $mesh_editor_weight_mode
                $PoolMeshEditorWeightStrokeSettings[$mesh_editor_current_stroke * 3 + 1] = $mesh_editor_weight_target
                $PoolMeshEditorWeightStrokeSettings[$mesh_editor_current_stroke * 3 + 2] = $mesh_editor_falloff_mode
                if $mesh_editor_weight_mode == 4
                    clear = ResourceMeshEditorWeightGradientState
                    $PoolMeshEditorWeightGradient[$mesh_editor_current_stroke * 4 + 0] = 0
                    $PoolMeshEditorWeightGradient[$mesh_editor_current_stroke * 4 + 1] = 0
                    $PoolMeshEditorWeightGradient[$mesh_editor_current_stroke * 4 + 2] = 0
                    $PoolMeshEditorWeightGradient[$mesh_editor_current_stroke * 4 + 3] = 0
                    ; Snapshot the current result of all prior strokes exactly once.
                    ; Live preview re-evaluates from this buffer every frame.
                    ResourceMeshEditorWeightGradientSnapshot = copy ResourceMeshEditorEditableBlend
                endif
            endif

            if $mesh_editor_active_tool == 0
                local $SelectedVertex
                store = $SelectedVertex, ResourceMeshEditorState, 0
                $mesh_editor_active_vertex = $SelectedVertex
                $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 3] = $SelectedVertex
            elif $mesh_editor_active_tool == 15
                $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 3] = $mesh_editor_weight_vg_id
                $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 7] = $mesh_editor_weight_mode
                $PoolMeshEditorWeightStrokeSettings[$mesh_editor_current_stroke * 3 + 0] = $mesh_editor_weight_mode
                $PoolMeshEditorWeightStrokeSettings[$mesh_editor_current_stroke * 3 + 1] = $mesh_editor_weight_target
                $PoolMeshEditorWeightStrokeSettings[$mesh_editor_current_stroke * 3 + 2] = $mesh_editor_falloff_mode
            endif
        endif
    else
        if $mesh_editor_stroke_active == 1
            if $mesh_editor_active_tool == 1
                if $mesh_editor_lmb == 1
                    run = CommandListMeshEditorRecordInflateDab
                else
                    run = CommandListMeshEditorFinishStroke
                endif

            elif $mesh_editor_active_tool == 2
                if $mesh_editor_lmb == 1
                    run = CommandListMeshEditorRecordSmoothDab
                else
                    run = CommandListMeshEditorFinishStroke
                endif

            elif $mesh_editor_active_tool == 3

                if $mesh_editor_lmb == 1
                    run = CommandListMeshEditorRecordPinchDab
                else
                    run = CommandListMeshEditorFinishStroke
                endif

            elif $mesh_editor_active_tool == 4

                if $mesh_editor_lmb == 1
                    run = CommandListMeshEditorRecordCreaseDab
                else
                    run = CommandListMeshEditorFinishStroke
                endif

            elif $mesh_editor_active_tool == 5

                if $mesh_editor_lmb == 1
                    run = CommandListMeshEditorRecordFlattenDab
                else
                    run = CommandListMeshEditorFinishStroke
                endif

            elif $mesh_editor_active_tool == 6

                if $mesh_editor_lmb == 1
                    run = CommandListMeshEditorRecordScaleDab
                else
                    run = CommandListMeshEditorFinishStroke
                endif

            elif $mesh_editor_active_tool == 7 && $mesh_editor_active_mask_slot != -1
                if $mesh_editor_lmb == 1
                    run = CommandListMeshEditorRecordMaskDab
                else
                    run = CommandListMeshEditorFinishStroke
                endif

            elif $mesh_editor_active_tool == 15
                if $mesh_editor_lmb == 1
                    run = CommandListMeshEditorRecordWeightDab
                else
                    if $mesh_editor_active_weight_mode == 4 && $mesh_editor_stroke_dab_count > 0
                        run = CommandListMeshEditorWeightGradientApply
                    endif
                    run = CommandListMeshEditorFinishStroke
                endif
            else
                if $mesh_editor_lmb == 0
                    $mesh_editor_grab_commit_pending = 1
                endif
            endif
        endif
    endif
endif

