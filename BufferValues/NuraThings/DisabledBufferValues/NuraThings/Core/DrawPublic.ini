namespace = NuraThings\Public\Draw

; Version 1.0

[Constants]
global $CheckHover

global $x87
global $y87
global $z87
global $w87

global $x88
global $y88
global $z88
global $w88

global $x89

global $x136
global $y136
global $z136

global $x137
global $y137

global $width
global $height
global $offset_x
global $offset_y

global $last_width
global $last_height
global $last_offset_x
global $last_offset_y


global $BoxMinX
global $BoxMinY

global $BoxMaxX
global $BoxMaxY

global $FadeOut

global $USE_BOX
global $USE_FADEOUT

global $special_effect
global $special_effect_val0
global $special_effect_val1

[CommandListBackupIniParams]
$x87 = x87
$y87 = y87
$z87 = z87
$w87 = w87

$x88 = x88
$y88 = y88
$z88 = z88
$w88 = w88

$x89 = x89

$x136 = x136
$y136 = y136
$z136 = z136

$x137 = x137
$y137 = y137

[CommandListRestoreIniParams]
x87 = $x87
y87 = $y87
z87 = $z87
w87 = $w87

x88 = $x88
y88 = $y88
z88 = $z88
w88 = $w88

x89 = $x89

x136 = $x136
y136 = $y136
z136 = $z136

x137 = $x137
y137 = $y137


[CommandListRun]
run = CommandListBackupIniParams

; Background
x87 = $width
y87 = $height
z87 = $offset_x
w87 = $offset_y

x88 = $BoxMinX
y88 = $BoxMinY

z88 = $BoxMaxX
w88 = $BoxMaxY

x89 = $FadeOut 

x136 = $USE_BOX
y136 = $USE_FADEOUT

z136 = $special_effect
x137 = $special_effect_val0
y137 = $special_effect_val1

run = CustomShaderDraw

if $CheckHover
    run = CustomShader\NuraThings\Public\Hover\Run
    $CheckHover = 0
endif

clear = ps-t100
ps-t100 = null

run = CommandListRestoreIniParams
run = CommandListResetVars


[CommandListResetVars]
$last_width = $width
$last_height = $height
$last_offset_x = $offset_x
$last_offset_y = $offset_y


$width = 0
$height = 0
$offset_x = 0
$offset_y = 0

$BoxMinX = 0
$BoxMinY = 0

$BoxMaxX = 0
$BoxMaxY = 0

$FadeOut  = 0

$USE_BOX = 0
$USE_FADEOUT = 0

$special_effect = 0
$special_effect_val0 = 0 
$special_effect_val1 = 0


[CustomShaderDraw]
hs = null
ds = null
gs = null
cs = null
run = BuiltInCommandListUnbindAllRenderTargets

vs = Mods/BufferValues/NuraThings/Shaders/UIElement.hlsl
ps = Mods/BufferValues/NuraThings/Shaders/UIElement.hlsl

blend = ADD SRC_ALPHA INV_SRC_ALPHA
cull = none
topology = triangle_strip
o0 = set_viewport bb
Draw = 4,0