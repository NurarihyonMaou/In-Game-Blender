; ============================================================================
; FRAME COMMAND LIST
; ============================================================================

[CommandListMeshEditorFrame]
if time != $mesh_editor_last_update
    if $mesh_editor_enabled == 1
        run = CommandListMeshEditorCombineMasks

        run = CustomShaderMeshEditorCapture
        run = CustomShaderMeshEditorVisibleDepth
        run = CustomShaderMeshEditorPick
        run = CustomShaderMeshEditorState

        if $mesh_editor_lmb == 1
            if $mesh_editor_tool == 2
                run = CommandListMeshEditorSmooth
                run = CustomShaderMeshEditorDeform
            elif $mesh_editor_tool == 7
                x33 = $falloff_radius
                z34 = $mesh_editor_invert_direction
                x37 = $mesh_editor_mask_strength

                if $mesh_editor_stroke_active
                    x36 = $mesh_editor_stroke_mirror
                    y36 = $mesh_editor_stroke_mirror_axis
                    z36 = $mesh_editor_stroke_mirror_plane
                else
                    x36 = $mesh_editor_mirror
                    y36 = $mesh_editor_mirror_axis
                    z36 = $mesh_editor_mirror_plane
                endif

                w36 = $mesh_editor_mirror_epsilon
                run = CustomShaderMeshEditorMaskPaint

            elif $mesh_editor_tool == 15 && $mesh_editor_stroke_active == 1
                if $mesh_editor_current_stroke < $mesh_editor_strokes_limit && $mesh_editor_current_dab < $mesh_editor_dabs_limit
                    if $mesh_editor_active_weight_mode == 3
                        run = CommandListMeshEditorWeightSmooth
                    elif $mesh_editor_active_weight_mode == 4
                        run = CustomShaderMeshEditorWeightGradientCapture
                        run = CustomShaderMeshEditorWeightGradientPreview
                    else
                        run = CustomShaderMeshEditorWeightPaint
                    endif
                endif
            endif
        endif

        if $mesh_editor_move_active == 1
            run = CommandListMeshEditorApplyMovePreview
            run = CustomShaderMeshEditorRebuildWritablePosition
        endif

        if $mesh_editor_scale_active == 1
            run = CommandListMeshEditorApplyScalePreview
            run = CustomShaderMeshEditorRebuildWritablePosition
        endif

        if $mesh_editor_rotate_active == 1
            run = CommandListMeshEditorApplyRotatePreview
            run = CustomShaderMeshEditorRebuildWritablePosition
        endif
    endif

    $mesh_editor_last_update = time
endif

