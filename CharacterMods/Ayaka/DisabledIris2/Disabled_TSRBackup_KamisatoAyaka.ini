    if $\NuraThings\ColorPicker\check_color
        run = CommandList\NuraThings\ColorPicker\IsWithinMenuRange
            
        if $\NuraThings\ColorPicker\InRange
            $update_texture = 1
        else
            $update_texture = 0
        endif
    else
        if $\NuraThings\ColorPicker\wait_frame != 0
            if time - $\NuraThings\ColorPicker\wait_frame >= 5

                run = CommandList\NuraThings\ColorPicker\StorePackedColors

                if $\NuraThings\ColorPicker\selector_type == 0
                    $packedHSV = $\NuraThings\ColorPicker\packedHSV
                elif $\NuraThings\ColorPicker\selector_type == 1
                    $packedRGB = $\NuraThings\ColorPicker\packedRGB
                elif $\NuraThings\ColorPicker\selector_type == 2
                    $packedHSL = $\NuraThings\ColorPicker\packedHSL
                endif

                run = CommandListGetHSV
                $\NuraThings\ColorPicker\wait_frame = 0
            endif

        endif
        $update_texture = 0
    endif

    
