namespace = NuraUI

[Constants]
; Persistent favorites store module IDs, not registry slots. Favorites survive module load-order changes.
global persist $nt_favorite_wheel_enabled = 1
global $nt_favorite_wheel = 0
global $nt_favorite_wheel_prev = 0
global $nt_fav_wheel_previous_page = 0
global $nt_fav_wheel_previous_selected = 0
global $nt_fav_wheel_origin_x = 0
global $nt_fav_wheel_origin_y = 0
global persist $nt_fav_module_id0 = 0
global persist $nt_fav_module_id1 = 0
global persist $nt_fav_module_id2 = 0
global persist $nt_fav_module_id3 = 0
global persist $nt_fav_module_id4 = 0
global persist $nt_fav_module_id5 = 0
global persist $nt_fav_module_id6 = 0
global persist $nt_fav_module_id7 = 0
global $nt_ui_current_page = 0
global $nt_keybind_scroll = 0
global $nt_settings_scroll = 0

[KeyNuraUIFavoriteWheel]
condition = $nt_favorite_wheel_enabled == 1 && $nt_ui == 0 && $nt_overlay == 0 && $nt_mask_rename_active == 0
key = VK_F4
type = hold
$nt_favorite_wheel = 1

[KeyNuraUIKeybindScrollUp]
condition = $nt_ui == 1 && $nt_ui_current_page == 2 && $nt_mask_rename_active == 0
key = MOUSE_WHEEL_UP
run = CommandListNuraUIKeybindScrollUp

[KeyNuraUIKeybindScrollDown]
condition = $nt_ui == 1 && $nt_ui_current_page == 2 && $nt_mask_rename_active == 0
key = MOUSE_WHEEL_DOWN
run = CommandListNuraUIKeybindScrollDown

[CommandListNuraUIKeybindScrollUp]
$nt_keybind_scroll = $nt_keybind_scroll - 1
if $nt_keybind_scroll < 0
    $nt_keybind_scroll = 0
endif

[CommandListNuraUIKeybindScrollDown]
$nt_keybind_scroll = $nt_keybind_scroll + 1
if $nt_keybind_scroll > 123
    $nt_keybind_scroll = 123
endif

[KeyNuraUISettingsScrollUp]
condition = $nt_ui == 1 && $nt_ui_current_page == 5 && $nt_mask_rename_active == 0
key = MOUSE_WHEEL_UP
run = CommandListNuraUISettingsScrollUp

[KeyNuraUISettingsScrollDown]
condition = $nt_ui == 1 && $nt_ui_current_page == 5 && $nt_mask_rename_active == 0
key = MOUSE_WHEEL_DOWN
run = CommandListNuraUISettingsScrollDown

[CommandListNuraUISettingsScrollUp]
$nt_settings_scroll = $nt_settings_scroll - 1
if $nt_settings_scroll < 0
    $nt_settings_scroll = 0
endif

[CommandListNuraUISettingsScrollDown]
$nt_settings_scroll = $nt_settings_scroll + 1
if $nt_settings_scroll > 60
    $nt_settings_scroll = 60
endif

[Present]
; Capture the UI state and pointer only on the rising edge. The menu remains closed while the wheel is held.
if $nt_favorite_wheel == 1 && $nt_favorite_wheel_prev == 0
    store = $nt_fav_wheel_previous_page, Resource\NuraUI\NuraThingsUIState, 0
    store = $nt_fav_wheel_previous_selected, Resource\NuraUI\NuraThingsUIState, 55
    $nt_fav_wheel_origin_x = cursor_window_x
    $nt_fav_wheel_origin_y = cursor_window_y
endif
if $nt_favorite_wheel == 1 && $nt_favorite_wheel_enabled == 1 && $nt_ui == 0 && $nt_overlay == 0
    run = CommandListNuraUIFavoriteWheelInput
    run = CommandListNuraUIFavoriteWheelDraw
else if $nt_favorite_wheel_prev == 1 && $nt_favorite_wheel == 0
    local $nt_fav_wheel_selected_local
    store = $nt_fav_wheel_selected_local, Resource\NuraUI\NuraThingsUIState, 56
    if $nt_fav_wheel_selected_local > 0
        $nt_ui = 1
    endif
endif
$nt_favorite_wheel_prev = $nt_favorite_wheel

