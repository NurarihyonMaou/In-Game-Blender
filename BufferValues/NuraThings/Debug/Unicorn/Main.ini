namespace = RichText

;  How to use:

;  First, set ResourceRich to the text you want to show:
;Resource\RichText\Rich = ResourceMyText

;  Then, run the custom shader to add the iniparam numbers in it:
;run = CustomShader\RichText\Parse

;  Now, you can use the return buffer as the new text you want to show:
;Resource\GIMIv8\Text = Resource\RichText\Parsed
;...
;Resource\GIMIv8\TextParams = ref Resource\GIMIv8\HelpShortParams
;run = CustomShader\GIMIv8\FormatText
;run = CommandList\GIMIv8\RenderText

[CustomShaderParse]
; This compute shader runs on 1 thread. It takes an input buffer, 
; and writes it to an output buffer, while converting the custom
; formatting syntax into their actual characters.
; The return buffer can be drawn with TextPrinter.hlsl normally.
cs = .\ParseTextBuffer.hlsl
vs = null
ps = null
hs = null
ds = null
gs = null

if ResourceRich !== null
  cs-t10 = ResourceRich
  clear = ResourceParsed
  cs-u0 = ResourceParsed
  ; Run the compute shader
  dispatch = 1,1,1
endif

; Unbind resources
cs-u0 = null
cs-t10 = null

; Text Resource to be parsed
[ResourceRich]

; Resource returned by the parser shader. It converts iniparams to actual uints.
; 64 * 4096 uint chunks
[ResourceParsed]
type   = RWStructuredBuffer
stride = 4
array  = 262144



; testing
[constants]
global $testing = 0
global $unwiped = 0


global $foo = 2
global $frames = 0
global $cp = 0
global $save = 0
global $elapsed = 0

;[KeyTest]
;key = f12
;type = cycle
;$testing = 0,1

[Present]
$frames = $frames + 1
$elapsed = time - $cp

if $elapsed > 0.5
  $cp = time
  $save = $frames / $elapsed
  $frames = 0
endif

if $testing == 1
  x0 = time
  y0 = $foo
  z0 = CURSOR_WINDOW_X
  w0 = CURSOR_WINDOW_Y
  x1 = $save
  y1 = time/60
  run = CommandListTest
  $unwiped = 1
elif $unwiped
  Resource\ShaderFixes\help.ini\Help = null
  $unwiped = 0
endif

[CommandListTest]
; First, bind the resource that will be parsed
ResourceRich = ResourceTextTest
; Then, run the shader to parse said text and save it to ResourceParsedText
run = CustomShaderParse

; Finally, use the new resource to draw text on screen
Resource\ShaderFixes\help.ini\Help = ResourceParsed
Resource\ShaderFixes\help.ini\Params = Resource\ShaderFixes\help.ini\ParamsShort
run = CustomShader\ShaderFixes\help.ini\FormatText

[ResourceTextTest]
type = Buffer
format = R8_UINT
filename = text.txt

