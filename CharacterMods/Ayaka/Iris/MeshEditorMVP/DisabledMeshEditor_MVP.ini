; ============================================================================
; Mesh Editor MVP
; ============================================================================
;
; Current target:
;   Ayaka / 79,355 vertex position buffer / current active IB.
;
; Pipeline:
;
;   native game VS
;       |
;       v
;   MeshEditorCapture (GS + trivial PS)
;       |
;       v
;   VertexID -> native SV_Position texture
;       |
;       v
;   MeshEditorPick (CS)
;       |
;       +--> triangle / barycentric / nearest vertex / depth / local basis
;       |
;       v
;   MeshEditorState (CS)
;       |
;       +--> selected vertex + capture + mouse drag
;       +--> persistent VertexDelta on mouse release
;       |
;       v
;   MeshEditorDeform (CS)
;       |
;       +--> base + persistent edit + current drag
;       |
;       v
;   ResourceMeshEditorTempVB0
;       |
;       v
;   normal game draw
;
; IMPORTANT:
;   Only the capture bridge uses PS. The PS contains no picking logic.
;   CS does the actual triangle/vertex selection and deformation.
;
; ============================================================================

[Constants]

; 0/1 master switch.
global $mesh_editor_enabled = 1

; One-time initialization of the session-only GPU edit buffers.
global $mesh_editor_initialized = 0

; Avoid running the expensive full-frame pipeline more than once when the
; same draw hash is reused multiple times in one frame.
global $mesh_editor_last_update = -1

; Current left mouse button state.
global $mesh_editor_lmb = 0

; ---------------------------------------------------------------------------
; Picker range
; ---------------------------------------------------------------------------
;
; 0 index count = scan the entire ACTIVE IB.
;
; This is intentional: the custom picker binds cs-t2 = ib, i.e. the exact
; index buffer active in the current TextureOverride. There is no
; PrimitiveID + magic offset mapping here.
;
; If your ResourceKamisatoAyakaBodyIB is NOT sliced to Body and is instead
; the original full IB, set these to the actual Body range instead.
;
global $mesh_editor_first_index = 0
global $mesh_editor_index_count = 0

; 4 px triangle/edge tolerance.
global $mesh_editor_hit_pad_px = 4.0

; ============================================================================
; INPUT
; ============================================================================

[KeyMeshEditorLMB]
condition = $mesh_editor_enabled == 1
key = VK_LBUTTON
type = hold
$mesh_editor_lmb = 1
post $mesh_editor_lmb = 0

; ============================================================================
; RESOURCES
; ============================================================================

; 512 * 256 = 131,072 float4 texels, enough for 79,355 vertices.
; Each texel stores the native VS SV_Position of one vertex.
[ResourceMeshEditorCapture]
type = Texture2D
mode = mono
width = 512
height = 256
mips = 1
array = 1
msaa = 1
msaa_quality = 0
format = DXGI_FORMAT_R32G32B32A32_FLOAT
bind_flags = render_target shader_resource

; HoverResult described in MeshEditorPick.hlsl.
[ResourceMeshEditorHover]
type = RWBuffer
format = R32G32B32A32_FLOAT
array = 8

; Interaction state described in MeshEditorState.hlsl.
[ResourceMeshEditorState]
type = RWBuffer
format = R32G32B32A32_FLOAT
array = 6

; One float4 per vertex. xyz = persistent local-space offset.
[ResourceMeshEditorVertexDelta]
type = RWBuffer
format = R32G32B32A32_FLOAT
array = 79355

; Writable copy of the current position VB0. Its layout is established by
; copying the original position resource into it before the compute pass.
[ResourceMeshEditorTempVB0]
type = RWBuffer

; ============================================================================
; CAPTURE
; ============================================================================

[CustomShaderMeshEditorCapture]

; The native game VS is intentionally NOT replaced. Only GS+PS are supplied,
; exactly like the proven calibration technique.
run = BuiltInCommandListUnbindAllRenderTargets
clear = ResourceMeshEditorCapture 0.0

gs = MeshEditorMVP/MeshEditorCapture.hlsl
ps = MeshEditorMVP/MeshEditorCapture.hlsl

topology = point_list

o0 = set_viewport no_view_cache ResourceMeshEditorCapture

; IMPORTANT:
; Non-indexed point_list means GS SV_PrimitiveID == VB vertex order.
draw = 79355, 0

; ============================================================================
; PICK
; ============================================================================

[CustomShaderMeshEditorPick]
cs = MeshEditorMVP/MeshEditorPick.hlsl

cs-t0 = ResourceMeshEditorCapture
cs-t1 = ResourceMeshEditorTempVB0
cs-t2 = ib
cs-u0 = ResourceMeshEditorHover

; Cursor/window coordinates are TOP-LEFT PIXELS.
; Do not use the old bottom-origin $cursorY here.
x31 = cursor_window_x
y31 = cursor_window_y
z31 = window_width
w31 = window_height

x140 = $mesh_editor_first_index
y140 = $mesh_editor_index_count
z140 = 79355
w140 = $mesh_editor_hit_pad_px

dispatch = 1, 1, 1

post cs-t0 = null
post cs-t1 = null
post cs-t2 = null
post cs-u0 = null

; ============================================================================
; STATE
; ============================================================================

[CustomShaderMeshEditorState]
cs = MeshEditorMVP/MeshEditorState.hlsl

cs-t0 = ResourceMeshEditorHover
cs-u0 = ResourceMeshEditorState
cs-u1 = ResourceMeshEditorVertexDelta

x31 = cursor_window_x
y31 = cursor_window_y
z31 = window_width
w31 = window_height

x32 = $mesh_editor_lmb

dispatch = 1, 1, 1

post cs-t0 = null
post cs-u0 = null
post cs-u1 = null

; ============================================================================
; DEFORM
; ============================================================================

[CustomShaderMeshEditorDeform]

; Base must always be the ORIGINAL position resource, not the previous
; writable result, otherwise edits would accumulate every dispatch.
cs = MeshEditorMVP/MeshEditorDeform.hlsl
cs-t0 = ResourceKamisatoAyakaPosition
cs-t1 = ResourceMeshEditorState
cs-t2 = ResourceMeshEditorVertexDelta

; Copy establishes a writable structured VB matching the source layout.
ResourceMeshEditorTempVB0 = ResourceKamisatoAyakaPosition
cs-u0 = copy ResourceMeshEditorTempVB0

dispatch = (79355 + 63) // 64, 1, 1

; UAV must be gone before the same resource becomes IA VB0.
vb0 = null
ResourceMeshEditorTempVB0 = copy cs-u0

post cs-u0 = null
post cs-t0 = null
post cs-t1 = null
post cs-t2 = null

; ============================================================================
; FRAME COMMAND LIST
; ============================================================================

[CommandListMeshEditorFrame]

if $mesh_editor_initialized == 0
    clear = ResourceMeshEditorHover 0.0
    clear = ResourceMeshEditorState 0.0
    clear = ResourceMeshEditorVertexDelta 0.0
    $mesh_editor_initialized = 1
endif

if time != $mesh_editor_last_update

    ; --------------------------------------------------------
    ; PASS A: build the mesh that existed at the beginning of
    ; this frame from BASE + persistent edits + old preview.
    ; --------------------------------------------------------
    if $mesh_editor_enabled == 1
        run = CustomShaderMeshEditorDeform
        vb0 = ResourceMeshEditorTempVB0

        ; ----------------------------------------------------
        ; PASS B: capture native VS positions from that mesh.
        ; ----------------------------------------------------
        run = CustomShaderMeshEditorCapture

        ; ----------------------------------------------------
        ; PASS C: software triangle/vertex picker.
        ; ----------------------------------------------------
        run = CustomShaderMeshEditorPick

        ; ----------------------------------------------------
        ; PASS D: update click/drag state and commit release.
        ; ----------------------------------------------------
        run = CustomShaderMeshEditorState

        ; ----------------------------------------------------
        ; PASS E: rebuild with THIS frame's new preview state.
        ; ----------------------------------------------------
        run = CustomShaderMeshEditorDeform
        vb0 = ResourceMeshEditorTempVB0
    endif

    $mesh_editor_last_update = time
endif

; Every later draw using this TextureOverride gets the same already-built
; vertex buffer for the whole frame.
vb0 = ResourceMeshEditorTempVB0

; ============================================================================
; AYAKA BODY HOOK
; ============================================================================
;
; Put this AFTER:
;
;     vb0 = ResourceKamisatoAyakaPosition
;
; and AFTER:
;
;     ib = ResourceKamisatoAyakaBodyIB
;
; inside the Body TextureOverride, BEFORE its drawindexed commands.
;
; Example:
;
; [TextureOverrideKamisatoAyakaBody]
; hash = 0cafd227
; match_first_index = 11565
; ib = ResourceKamisatoAyakaBodyIB
; vb0 = ResourceKamisatoAyakaPosition
; run = CommandListMeshEditorFrame
;
; drawindexed = ...
;
; ============================================================================
