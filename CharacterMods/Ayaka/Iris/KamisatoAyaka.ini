; HISTORY RECORDING
; ============================================================================

; ============================================================================
; STROKE RECORDING / DAB HISTORY
; ============================================================================

[CommandListMeshEditorRecordInflateDab]
local $Valid
local $X
local $Y
local $Z

store = $Valid, ResourceMeshEditorState, 63

if $Valid > 0.5
    store = $X, ResourceMeshEditorState, 60
    store = $Y, ResourceMeshEditorState, 61
    store = $Z, ResourceMeshEditorState, 62

    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 0] = $X
    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 1] = $Y
    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 2] = $Z
    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 3] = $mesh_editor_sculpt_strength
    $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 4] = $falloff_radius

    $mesh_editor_current_dab = $mesh_editor_current_dab + 1
    $mesh_editor_stroke_dab_count = $mesh_editor_stroke_dab_count + 1
    $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 1] = $mesh_editor_stroke_dab_count
endif

[CommandListMeshEditorRecordGrabDab]
local $X
local $Y
local $Z

store = $X, ResourceMeshEditorState, 60
store = $Y, ResourceMeshEditorState, 61
store = $Z, ResourceMeshEditorState, 62

$PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 0] = $X
$PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 1] = $Y
$PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 2] = $Z
$PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 3] = 0.0
$PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 4] = $falloff_radius

$mesh_editor_current_dab = $mesh_editor_current_dab + 1
