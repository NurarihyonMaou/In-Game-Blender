; MULTI-SELECTION: Alt+LMB replaces the selection; Shift+Alt+LMB toggles an
; element into/out of the current selection. Face/edge elements contribute their
; vertices to a shared reference-count mask used later by selection-based transforms.
[KeyMeshEditorSelectElement]
condition = $mesh_editor_key_gate_select == 1
key = VK_LBUTTON
run = CommandListMeshEditorSelectElement

[CommandListMeshEditorSelectElement]
local $select_hover_valid
local $select_basis_valid
local $select_conditioning
local $select_vertex
local $select_tri0
local $select_tri1
local $select_tri2
local $select_bary_x
local $select_bary_y
local $select_bary_z
local $select_mode
local $select_v0
local $select_v1
local $select_v2
local $select_prev_x50 = x50
local $select_prev_x51 = x51
local $select_prev_y51 = y51
local $select_prev_z51 = z51

store = $select_hover_valid, ResourceMeshEditorHover, 0
store = $select_basis_valid, ResourceMeshEditorHover, 23
store = $select_conditioning, ResourceMeshEditorHover, 27
store = $select_vertex, ResourceMeshEditorHover, 28
store = $select_tri0, ResourceMeshEditorHover, 8
store = $select_tri1, ResourceMeshEditorHover, 9
store = $select_tri2, ResourceMeshEditorHover, 10
store = $select_bary_x, ResourceMeshEditorHover, 12
store = $select_bary_y, ResourceMeshEditorHover, 13
store = $select_bary_z, ResourceMeshEditorHover, 14

if $select_hover_valid > 0.5 && $select_basis_valid > 0.5 && $select_conditioning > 0
    if $mesh_editor_edge_overlay == 1
        $select_mode = 2
        if $select_bary_x <= $select_bary_y && $select_bary_x <= $select_bary_z
            $select_v0 = $select_tri1
            $select_v1 = $select_tri2
        elif $select_bary_y <= $select_bary_z
            $select_v0 = $select_tri2
            $select_v1 = $select_tri0
        else
            $select_v0 = $select_tri0
            $select_v1 = $select_tri1
        endif
        $select_v2 = -1
    elif $mesh_editor_vertex_overlay == 1
        $select_mode = 0
        $select_v0 = $select_vertex
        $select_v1 = -1
        $select_v2 = -1
    else
        $select_mode = 1
        $select_v0 = $select_tri0
        $select_v1 = $select_tri1
        $select_v2 = $select_tri2
    endif

    ; Persist the selection event for deterministic Move undo/redo.
    $mesh_editor_selection_event_operation = 1
    if $mesh_editor_invert_direction == 0
        $mesh_editor_selection_event_operation = 0
    endif
    $mesh_editor_selection_event_mode = $select_mode
    $mesh_editor_selection_event_v0 = $select_v0
    $mesh_editor_selection_event_v1 = $select_v1
    $mesh_editor_selection_event_v2 = $select_v2
    run = CommandListMeshEditorRecordSelectionEvent

    ; Replace clears current lists; Shift toggles the clicked element.
    if $mesh_editor_invert_direction == 0
        run = CommandListMeshEditorResetSelectionGPU
    endif

    x50 = $select_mode
    x51 = $select_v0
    y51 = $select_v1
    z51 = $select_v2
    run = CustomShaderMeshEditorSelectionEdit

    $mesh_editor_selection_override = 1
    $mesh_editor_selected_element_valid = 1
    $mesh_editor_selected_element_mode = $select_mode
    $mesh_editor_selected_vertex = -1
    $mesh_editor_selected_face_v0 = -1
    $mesh_editor_selected_face_v1 = -1
    $mesh_editor_selected_face_v2 = -1
    $mesh_editor_selected_edge_v0 = -1
    $mesh_editor_selected_edge_v1 = -1
    if $select_mode == 0
        $mesh_editor_selected_vertex = $select_v0
    elif $select_mode == 1
        $mesh_editor_selected_face_v0 = $select_v0
        $mesh_editor_selected_face_v1 = $select_v1
        $mesh_editor_selected_face_v2 = $select_v2
    else
        $mesh_editor_selected_edge_v0 = $select_v0
        $mesh_editor_selected_edge_v1 = $select_v1
    endif
else
    ; Empty-space click without Shift replaces the selection with nothing. Shift+click
    ; empty space is a no-op.
    if $mesh_editor_invert_direction == 0
        run = CommandListMeshEditorClearSelection
    endif
endif

x50 = $select_prev_x50
x51 = $select_prev_x51
y51 = $select_prev_y51
z51 = $select_prev_z51

[CommandListMeshEditorRecordSelectionEvent]
if $mesh_editor_selection_event_count < $mesh_editor_selection_history_limit
    $PoolMeshEditorSelectionHistory[$mesh_editor_selection_event_count * 5 + 0] = $mesh_editor_selection_event_operation
    $PoolMeshEditorSelectionHistory[$mesh_editor_selection_event_count * 5 + 1] = $mesh_editor_selection_event_mode
    $PoolMeshEditorSelectionHistory[$mesh_editor_selection_event_count * 5 + 2] = $mesh_editor_selection_event_v0
    $PoolMeshEditorSelectionHistory[$mesh_editor_selection_event_count * 5 + 3] = $mesh_editor_selection_event_v1
    $PoolMeshEditorSelectionHistory[$mesh_editor_selection_event_count * 5 + 4] = $mesh_editor_selection_event_v2
    $mesh_editor_selection_event_count = $mesh_editor_selection_event_count + 1
endif

[CommandListMeshEditorResetSelectionGPU]
$mesh_editor_selection_override = 1
$mesh_editor_selected_element_valid = 0
$mesh_editor_selected_element_mode = -1
$mesh_editor_selected_vertex = -1
$mesh_editor_selected_face_v0 = -1
$mesh_editor_selected_face_v1 = -1
$mesh_editor_selected_face_v2 = -1
$mesh_editor_selected_edge_v0 = -1
$mesh_editor_selected_edge_v1 = -1
clear = ResourceMeshEditorSelectionVertices
clear = ResourceMeshEditorSelectionFaces
clear = ResourceMeshEditorSelectionEdges
clear = ResourceMeshEditorSelectionMeta
clear = ResourceMeshEditorSelectionRefCount

[CommandListMeshEditorSelectionReplayOne]
if $mesh_editor_selection_replay_cursor < $mesh_editor_selection_replay_target
    local $selection_replay_prev_x50 = x50
    local $selection_replay_prev_x51 = x51
    local $selection_replay_prev_y51 = y51
    local $selection_replay_prev_z51 = z51
    local $selection_replay_base = $mesh_editor_selection_replay_cursor * 5
    local $selection_replay_op = $PoolMeshEditorSelectionHistory[$selection_replay_base + 0]
    local $selection_replay_mode = $PoolMeshEditorSelectionHistory[$selection_replay_base + 1]
    local $selection_replay_v0 = $PoolMeshEditorSelectionHistory[$selection_replay_base + 2]
    local $selection_replay_v1 = $PoolMeshEditorSelectionHistory[$selection_replay_base + 3]
    local $selection_replay_v2 = $PoolMeshEditorSelectionHistory[$selection_replay_base + 4]

    if $selection_replay_op == 0 || $selection_replay_op == 2
        run = CommandListMeshEditorResetSelectionGPU
    endif
    if $selection_replay_op != 2
        x50 = $selection_replay_mode
        x51 = $selection_replay_v0
        y51 = $selection_replay_v1
        z51 = $selection_replay_v2
        run = CustomShaderMeshEditorSelectionEdit
    endif
    $mesh_editor_selection_replay_cursor = $mesh_editor_selection_replay_cursor + 1
    x50 = $selection_replay_prev_x50
    x51 = $selection_replay_prev_x51
    y51 = $selection_replay_prev_y51
    z51 = $selection_replay_prev_z51
endif

[CommandListMeshEditorMoveStart]
if $mesh_editor_move_active == 0 && $mesh_editor_current_stroke < $mesh_editor_strokes_limit && $mesh_editor_current_dab < $mesh_editor_dabs_limit
    local $move_selected_vertices
    local $move_selected_faces
    local $move_selected_edges
    local $move_hover_valid
    local $move_basis_valid
    local $move_conditioning
    store = $move_selected_vertices, ResourceMeshEditorSelectionMeta, 0
    store = $move_selected_faces, ResourceMeshEditorSelectionMeta, 1
    store = $move_selected_edges, ResourceMeshEditorSelectionMeta, 2
    store = $move_hover_valid, ResourceMeshEditorHover, 0
    store = $move_basis_valid, ResourceMeshEditorHover, 23
    store = $move_conditioning, ResourceMeshEditorHover, 27
    store = $mesh_editor_move_anchor_vertex, ResourceMeshEditorHover, 28

    if ($move_selected_vertices + $move_selected_faces + $move_selected_edges) > 0 && $move_hover_valid > 0.5 && $move_basis_valid > 0.5 && $move_conditioning > 0 && $mesh_editor_move_anchor_vertex >= 0 && $mesh_editor_move_anchor_vertex < 79355
        store = $mesh_editor_move_basis_rx, ResourceMeshEditorHover, 20
        store = $mesh_editor_move_basis_ry, ResourceMeshEditorHover, 21
        store = $mesh_editor_move_basis_rz, ResourceMeshEditorHover, 22
        store = $mesh_editor_move_basis_dx, ResourceMeshEditorHover, 24
        store = $mesh_editor_move_basis_dy, ResourceMeshEditorHover, 25
        store = $mesh_editor_move_basis_dz, ResourceMeshEditorHover, 26

        ; Convert the view-plane basis into base/object space at the hovered anchor.
        local $move_prev_x50 = x50
        local $move_prev_y50 = y50
        local $move_prev_z50 = z50
        local $move_prev_x51 = x51
        local $move_prev_y51 = y51
        local $move_prev_z51 = z51
        local $move_prev_x52 = x52
        run = CustomShaderMeshEditorMoveBasis
        store = $mesh_editor_move_basis_rx, ResourceMeshEditorMoveBasis, 0
        store = $mesh_editor_move_basis_ry, ResourceMeshEditorMoveBasis, 1
        store = $mesh_editor_move_basis_rz, ResourceMeshEditorMoveBasis, 2
        store = $mesh_editor_move_basis_dx, ResourceMeshEditorMoveBasis, 4
        store = $mesh_editor_move_basis_dy, ResourceMeshEditorMoveBasis, 5
        store = $mesh_editor_move_basis_dz, ResourceMeshEditorMoveBasis, 6
        x50 = $move_prev_x50
        y50 = $move_prev_y50
        z50 = $move_prev_z50
        x51 = $move_prev_x51
        y51 = $move_prev_y51
        z51 = $move_prev_z51
        x52 = $move_prev_x52

        $mesh_editor_move_start_x = cursor_window_x
        $mesh_editor_move_start_y = cursor_window_y
        $mesh_editor_move_delta_x = 0
        $mesh_editor_move_delta_y = 0
        $mesh_editor_move_delta_z = 0
        $mesh_editor_move_axis = -1
        ResourceMeshEditorMoveBaseline = copy ResourceMeshEditorVertexDelta
        $mesh_editor_move_active = 1
    endif
endif

[CommandListMeshEditorMoveCommit]
if $mesh_editor_move_active == 1
    run = CommandListMeshEditorApplyMovePreview
    if ($mesh_editor_move_delta_x != 0 || $mesh_editor_move_delta_y != 0 || $mesh_editor_move_delta_z != 0) && $mesh_editor_current_stroke < $mesh_editor_strokes_limit && $mesh_editor_current_dab < $mesh_editor_dabs_limit
        if $mesh_editor_current_stroke < $mesh_editor_max_stroke
            $mesh_editor_max_stroke = $mesh_editor_current_stroke
        endif
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 0] = $mesh_editor_current_dab
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 1] = 1
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 2] = 16
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 3] = $mesh_editor_selection_event_count
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 4] = 0
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 5] = 0
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 6] = 0
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 7] = $mesh_editor_active_mask_slot
        $PoolMeshEditorStrokeMaskFlags[$mesh_editor_current_stroke] = $mesh_editor_mask_active_flags
        $PoolMeshEditorStrokeMaskFlagsValid[$mesh_editor_current_stroke] = 1
        $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 0] = $mesh_editor_move_delta_x
        $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 1] = $mesh_editor_move_delta_y
        $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 2] = $mesh_editor_move_delta_z
        $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 3] = 0
        $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 4] = 0
        $mesh_editor_current_dab = $mesh_editor_current_dab + 1
        $mesh_editor_current_stroke = $mesh_editor_current_stroke + 1
        if $mesh_editor_current_stroke > $mesh_editor_max_stroke
            $mesh_editor_max_stroke = $mesh_editor_current_stroke
        endif
    else
        ResourceMeshEditorVertexDelta = copy ResourceMeshEditorMoveBaseline
    endif
    $mesh_editor_move_active = 0
    $mesh_editor_move_axis = -1
    run = CustomShaderMeshEditorRebuildWritablePosition
endif

[CommandListMeshEditorMoveCancel]
if $mesh_editor_move_active == 1
    ResourceMeshEditorVertexDelta = copy ResourceMeshEditorMoveBaseline
    $mesh_editor_move_active = 0
    $mesh_editor_move_axis = -1
    $mesh_editor_move_delta_x = 0
    $mesh_editor_move_delta_y = 0
    $mesh_editor_move_delta_z = 0
    run = CustomShaderMeshEditorRebuildWritablePosition
endif

[CommandListMeshEditorScaleStart]
if $mesh_editor_scale_active == 0
    if $mesh_editor_move_active == 0
        if $mesh_editor_restore_active == 0
            if $mesh_editor_stroke_active == 0
                if $mesh_editor_current_stroke < $mesh_editor_strokes_limit && $mesh_editor_current_dab < $mesh_editor_dabs_limit
                    local $scale_selected_vertices
                    local $scale_selected_faces
                    local $scale_selected_edges
                    store = $scale_selected_vertices, ResourceMeshEditorSelectionMeta, 0
                    store = $scale_selected_faces, ResourceMeshEditorSelectionMeta, 1
                    store = $scale_selected_edges, ResourceMeshEditorSelectionMeta, 2

                    if ($scale_selected_vertices + $scale_selected_faces + $scale_selected_edges) > 0
                        ; Capture the immutable delta baseline and calculate an object-space centroid once.
                        ResourceMeshEditorMoveBaseline = copy ResourceMeshEditorVertexDelta
                        run = CustomShaderMeshEditorScalePivot
                        store = $mesh_editor_scale_pivot_x, ResourceMeshEditorScalePivot, 0
                        store = $mesh_editor_scale_pivot_y, ResourceMeshEditorScalePivot, 1
                        store = $mesh_editor_scale_pivot_z, ResourceMeshEditorScalePivot, 2

                        $mesh_editor_scale_start_x = cursor_window_x
                        $mesh_editor_scale_start_y = cursor_window_y
                        $mesh_editor_scale_axis = -1
                        $mesh_editor_scale_factor = 1.0
                        $mesh_editor_scale_factor_x = 1.0
                        $mesh_editor_scale_factor_y = 1.0
                        $mesh_editor_scale_factor_z = 1.0
                        $mesh_editor_scale_active = 1
                    endif
                endif
            endif
        endif
    endif
endif

[CommandListMeshEditorScaleCommit]
if $mesh_editor_scale_active == 1
    run = CommandListMeshEditorApplyScalePreview

    if $mesh_editor_current_stroke < $mesh_editor_strokes_limit
        if $mesh_editor_current_dab < $mesh_editor_dabs_limit
            if $mesh_editor_scale_factor_x != 1.0 || $mesh_editor_scale_factor_y != 1.0 || $mesh_editor_scale_factor_z != 1.0
                if $mesh_editor_current_stroke < $mesh_editor_max_stroke
                    $mesh_editor_max_stroke = $mesh_editor_current_stroke
                endif

                ; Stroke type 17 = Scale. +3 stores selection history cursor; +4..6 store pivot XYZ.
                $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 0] = $mesh_editor_current_dab
                $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 1] = 1
                $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 2] = 17
                $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 3] = $mesh_editor_selection_event_count
                $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 4] = $mesh_editor_scale_pivot_x
                $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 5] = $mesh_editor_scale_pivot_y
                $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 6] = $mesh_editor_scale_pivot_z
                $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 7] = $mesh_editor_active_mask_slot
                $PoolMeshEditorStrokeMaskFlags[$mesh_editor_current_stroke] = $mesh_editor_mask_active_flags
                $PoolMeshEditorStrokeMaskFlagsValid[$mesh_editor_current_stroke] = 1

                $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 0] = $mesh_editor_scale_factor_x
                $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 1] = $mesh_editor_scale_factor_y
                $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 2] = $mesh_editor_scale_factor_z
                $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 3] = 0
                $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 4] = 0
                $mesh_editor_current_dab = $mesh_editor_current_dab + 1
                $mesh_editor_current_stroke = $mesh_editor_current_stroke + 1

                if $mesh_editor_current_stroke > $mesh_editor_max_stroke
                    $mesh_editor_max_stroke = $mesh_editor_current_stroke
                endif
            else
                ResourceMeshEditorVertexDelta = copy ResourceMeshEditorMoveBaseline
            endif
        else
            ResourceMeshEditorVertexDelta = copy ResourceMeshEditorMoveBaseline
        endif
    else
        ResourceMeshEditorVertexDelta = copy ResourceMeshEditorMoveBaseline
    endif

    $mesh_editor_scale_active = 0
    $mesh_editor_scale_axis = -1
    $mesh_editor_scale_factor = 1.0
    $mesh_editor_scale_factor_x = 1.0
    $mesh_editor_scale_factor_y = 1.0
    $mesh_editor_scale_factor_z = 1.0
    run = CustomShaderMeshEditorRebuildWritablePosition
endif

[CommandListMeshEditorScaleCancel]
if $mesh_editor_scale_active == 1
    ResourceMeshEditorVertexDelta = copy ResourceMeshEditorMoveBaseline
    $mesh_editor_scale_active = 0
    $mesh_editor_scale_axis = -1
    $mesh_editor_scale_factor = 1.0
    $mesh_editor_scale_factor_x = 1.0
    $mesh_editor_scale_factor_y = 1.0
    $mesh_editor_scale_factor_z = 1.0
    run = CustomShaderMeshEditorRebuildWritablePosition
endif

[CommandListMeshEditorRotateStart]
if $mesh_editor_rotate_active == 0
    if $mesh_editor_move_active == 0
        if $mesh_editor_scale_active == 0
            if $mesh_editor_restore_active == 0
                if $mesh_editor_stroke_active == 0
                    if $mesh_editor_current_stroke < $mesh_editor_strokes_limit && $mesh_editor_current_dab < $mesh_editor_dabs_limit
                        local $rotate_selected_vertices
                        local $rotate_selected_faces
                        local $rotate_selected_edges
                        store = $rotate_selected_vertices, ResourceMeshEditorSelectionMeta, 0
                        store = $rotate_selected_faces, ResourceMeshEditorSelectionMeta, 1
                        store = $rotate_selected_edges, ResourceMeshEditorSelectionMeta, 2

                        if ($rotate_selected_vertices + $rotate_selected_faces + $rotate_selected_edges) > 0
                            ResourceMeshEditorMoveBaseline = copy ResourceMeshEditorVertexDelta
                            run = CustomShaderMeshEditorScalePivot
                            store = $mesh_editor_rotate_pivot_x, ResourceMeshEditorScalePivot, 0
                            store = $mesh_editor_rotate_pivot_y, ResourceMeshEditorScalePivot, 1
                            store = $mesh_editor_rotate_pivot_z, ResourceMeshEditorScalePivot, 2
                            $mesh_editor_rotate_start_x = cursor_window_x
                            $mesh_editor_rotate_angle = 0
                            $mesh_editor_rotate_axis = 2
                            $mesh_editor_rotate_active = 1
                        endif
                    endif
                endif
            endif
        endif
    endif
endif

[CommandListMeshEditorRotateCommit]
if $mesh_editor_rotate_active == 1
    run = CommandListMeshEditorApplyRotatePreview
    if $mesh_editor_rotate_angle != 0 && $mesh_editor_current_stroke < $mesh_editor_strokes_limit && $mesh_editor_current_dab < $mesh_editor_dabs_limit
        if $mesh_editor_current_stroke < $mesh_editor_max_stroke
            $mesh_editor_max_stroke = $mesh_editor_current_stroke
        endif

        ; Stroke type 18 = Rotate. +3 stores the selection history cursor; +4..+6 store pivot XYZ.
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 0] = $mesh_editor_current_dab
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 1] = 1
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 2] = 18
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 3] = $mesh_editor_selection_event_count
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 4] = $mesh_editor_rotate_pivot_x
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 5] = $mesh_editor_rotate_pivot_y
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 6] = $mesh_editor_rotate_pivot_z
        $PoolMeshEditorStroke[$mesh_editor_current_stroke * 8 + 7] = $mesh_editor_active_mask_slot
        $PoolMeshEditorStrokeMaskFlags[$mesh_editor_current_stroke] = $mesh_editor_mask_active_flags
        $PoolMeshEditorStrokeMaskFlagsValid[$mesh_editor_current_stroke] = 1

        $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 0] = $mesh_editor_rotate_angle
        $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 1] = $mesh_editor_rotate_axis
        $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 2] = 0
        $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 3] = 0
        $PoolMeshEditorDab[$mesh_editor_current_dab * 5 + 4] = 0
        $mesh_editor_current_dab = $mesh_editor_current_dab + 1
        $mesh_editor_current_stroke = $mesh_editor_current_stroke + 1
        if $mesh_editor_current_stroke > $mesh_editor_max_stroke
            $mesh_editor_max_stroke = $mesh_editor_current_stroke
        endif
    else
        ResourceMeshEditorVertexDelta = copy ResourceMeshEditorMoveBaseline
    endif

    $mesh_editor_rotate_active = 0
    $mesh_editor_rotate_axis = 2
    $mesh_editor_rotate_angle = 0
    run = CustomShaderMeshEditorRebuildWritablePosition
endif

[CommandListMeshEditorRotateCancel]
if $mesh_editor_rotate_active == 1
    ResourceMeshEditorVertexDelta = copy ResourceMeshEditorMoveBaseline
    $mesh_editor_rotate_active = 0
    $mesh_editor_rotate_axis = 2
    $mesh_editor_rotate_angle = 0
    run = CustomShaderMeshEditorRebuildWritablePosition
endif

