[Constants]
global persist $Rectagl = 0
global persist $Rectagl_1 = 0
global $drag_zone_start_off_x = -1
global $drag_zone_start_off_y = -1

global $drag_zone_width
global $drag_zone_height

global persist $drag_zone_off_x = -1
global persist $drag_zone_off_y = -1

global $menu_offset_x
global $menu_offset_y

global $mouse_held

if $drag_zone_start_off_x == -1 && $drag_zone_start_off_y == -1
	post $drag_zone_start_off_x = (1122 / $ref_width)
	post $drag_zone_start_off_y = (165 / $ref_height)

	post $drag_zone_off_x = $drag_zone_start_off_x
	post $drag_zone_off_y = $drag_zone_start_off_y
endif

global $ref_width  = 1920
global $ref_height = 1080


global $scale_w
global $scale_h
global $scale_ref

global $mouse_clicked
global $active_elem_id = -1
global $elem_id = -1
global $menu

global $res_width
global $res_height

global $cursor_x
global $cursor_y

global $screen_width
global $screen_height

[Present]
if $mouse_clicked > 0
	post $mouse_clicked = $mouse_clicked - 1
endif

post $active_elem_id = -1
post $elem_id = -1


if $menu
	run = CommandListScreenFallback
	run = CommandListCursorFallback
	run = CommandListDrawAllMenuElements
	run = CommandListDragZone

	$\NuraThings\Debug\x3 = $menu_offset_x
	$\NuraThings\Debug\x4 = $menu_offset_y

	$\NuraThings\Debug\y1 = $drag_zone_off_x
	$\NuraThings\Debug\y2 = $drag_zone_off_y

	$\NuraThings\Debug\y3 = $drag_zone_width
	$\NuraThings\Debug\y4 = $drag_zone_height

	$\NuraThings\Debug\z3 = $drag_zone_start_off_x
	$\NuraThings\Debug\z4 = $drag_zone_start_off_y
endif

[KeyMouseHeld]
key = VK_LBUTTON
type = hold
$mouse_held = 1

[KeyMenu]
key = VK_CTRL M
type = Toggle
$menu = 1

[KeyLMBClick]
condition = $menu
key = VK_LBUTTON
type = cycle
$mouse_clicked = 2

[CommandListDrawMenuBackground]
$elem_id = 0.0

$\NuraThings\Public\Draw\width = 400 * $scale_ref / $res_width
$\NuraThings\Public\Draw\height = 480 * $scale_ref / $res_height
$\NuraThings\Public\Draw\offset_x = 1122 / $ref_width
$\NuraThings\Public\Draw\offset_y = 166 / $ref_height

ps-t100 = ResourceRjpxc7lb1ik51
run = CommandList\NuraThings\Public\Draw\Run

[CommandListDrawRectagl]
$elem_id = 2.0

$\NuraThings\Public\Draw\width = 200 * $scale_ref / $res_width
$\NuraThings\Public\Draw\height = 200 * $scale_ref / $res_height
$\NuraThings\Public\Draw\offset_x = (1119 / $ref_width) + $menu_offset_x 
$\NuraThings\Public\Draw\offset_y = (671 / $ref_height) + $menu_offset_y 

run = CommandListCheckRectangleHover

if $mouse_clicked && $active_elem_id == $elem_id
	run = CommandListCycleRectagl 
	$mouse_clicked = 0
endif

ps-t100 = Resource129398534P0
run = CommandList\NuraThings\Public\Draw\Run

[CommandListCycleRectagl]
$Rectagl = $Rectagl+1
if $Rectagl > 2
	$Rectagl = 0
endif

[CommandListDrawRectagl_1]
$elem_id = 3.0

$\NuraThings\Public\Draw\width = 200 * $scale_ref / $res_width
$\NuraThings\Public\Draw\height = 200 * $scale_ref / $res_height
$\NuraThings\Public\Draw\offset_x = (1326 / $ref_width) + $menu_offset_x 
$\NuraThings\Public\Draw\offset_y = (660 / $ref_height) + $menu_offset_y 

run = CommandListCheckRectangleHover

if $mouse_clicked && $active_elem_id == $elem_id
	$Rectagl_1 = !$Rectagl_1
	$mouse_clicked = 0
endif

ps-t100 = Resource129398534P0
run = CommandList\NuraThings\Public\Draw\Run

[CommandListDragZone]
if $mouse_held && ($cursor_x >= $drag_zone_off_x && $cursor_x <= $drag_zone_off_x + $drag_zone_width) && ($cursor_y >= $drag_zone_off_y && $cursor_y <= $drag_zone_off_y + $drag_zone_height)
	$drag_zone_off_x = $cursor_x - ($drag_zone_width/2)
	$drag_zone_off_y = $cursor_y - ($drag_zone_height/2)

	$menu_offset_x = $drag_zone_off_x - $drag_zone_start_off_x
	$menu_offset_y = $drag_zone_off_y - $drag_zone_start_off_y
endif

[CommandListCheckCircleHover]
$\NuraThings\Public\KeepWithinCircle\start_x = $\NuraThings\Public\Draw\offset_x
$\NuraThings\Public\KeepWithinCircle\start_y = $\NuraThings\Public\Draw\offset_y
$\NuraThings\Public\KeepWithinCircle\circle_size = $\NuraThings\Public\Draw\width * res_width / $scale_ref

run = CommandList\NuraThings\Public\KeepWithinCircle\Run

local $isCursorWithinCircle = $\NuraThings\Public\KeepWithinCircle\Result

if $isCursorWithinCircle
	$active_elem_id = $elem_id
endif

[CommandListDrawAllMenuElements]
run = CommandListDrawMenuBackground
run = CommandListDrawRectagl
run = CommandListDrawRectagl_1

[CommandListScreenFallback]
if res_width > 0 && res_height > 0
    $res_width = res_width
    $res_height = res_height
elif rt_width > 0 && rt_height > 0
    $res_width = rt_width
    $res_height = rt_height
elif window_width > 0 && window_height > 0
    $res_width = window_width
    $res_height = window_height
else
    $res_width = 1920
    $res_height = 1080
endif


$scale_w = $res_width / $ref_width
$scale_h = $res_height / $ref_height

if $scale_w > $scale_h
    $scale_ref = $scale_h
else
    $scale_ref = $scale_w
endif

if !$drag_zone_width
	$drag_zone_width = 400 * $scale_ref / res_width
	$drag_zone_height = 146 * $scale_ref / res_height
endif

[CommandListCursorFallback]
if cursor_x > 0 && cursor_y > 0 && cursor_x < 1 && cursor_y < 1
    $cursor_x = cursor_x
    $cursor_y = cursor_y
elif cursor_window_x > 0 && cursor_window_y > 0 && cursor_window_x < 1 && cursor_window_y < 1
    $cursor_x = cursor_window_x / $screen_width
    $cursor_y = cursor_window_y / $screen_height
else
    $cursor_x = cursor_screen_x / $screen_width
    $cursor_y = cursor_screen_y / $screen_height
endif

[CommandListCheckRectangleHover]
local $isCursorWithinRectangle

if ($cursor_x >= $\NuraThings\Public\Draw\offset_x && $cursor_x <= $\NuraThings\Public\Draw\offset_x + $\NuraThings\Public\Draw\width) && ($cursor_y >= $\NuraThings\Public\Draw\offset_y && $cursor_y <= $\NuraThings\Public\Draw\offset_y + $\NuraThings\Public\Draw\height)
	$isCursorWithinRectangle = 1
endif

if $isCursorWithinRectangle
	$active_elem_id = $elem_id
endif

[ResourceRjpxc7lb1ik51]
filename = Resources/rjpxc7lb1ik51.png

[Resource129398534P0]
filename = Resources/129398534_p0.png

