namespace = NuraThings\KeyDetector

[Constants]
global $detect_keys
global $key_code
global $last_key_code
global $shift
global $backspace
global $backspace_time


[Present]
if $detect_keys
    ;$last_key_code = $key_code
;
    ;$\NuraThings\Print\Numbers\Number = $last_key_code
    ;$\NuraThings\Print\Numbers\widthScale = 1
    ;$\NuraThings\Print\Numbers\heightScale = 4
    ;run = CommandList\NuraThings\Print\Numbers\Run
    if $backspace
        if $backspace_time == -1
            run = CommandListBackspace
            $backspace_time = time
        else if time - $backspace_time >= 0.1
            run = CommandListBackspace
            $backspace_time = time
        endif
    else if $backspace_time != -1
        $backspace_time = -1
    endif
endif


[KeyEnable]
condition = !$detect_keys
key = VK_CONTROL VK_SHIFT VK_ALT
$detect_keys = 1

[KeyShift]
condition = $detect_keys
key = VK_SHIFT
type = hold
$shift = 1

