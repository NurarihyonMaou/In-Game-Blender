namespace = NuraUI\Modules\Momentary

[Constants]
global $nura_ui_momentary_module_id = 4099
global $nura_ui_momentary_module_slot = 32
global $nura_ui_momentary_module_registered = 0
global $nura_ui_momentary_widgets_registered = 0
global persist $nura_ui_momentary_slider_value = 0.38
global persist $nura_ui_momentary_toggle_value = 0.0
global persist $nura_ui_momentary_action_value = 2.0
global persist $nura_ui_momentary_cycle_value = 1.0

[ResourceNuraUIModuleMomentarySlot]
type = RWBuffer
format = R32_FLOAT
array = 1

[Present]
; Do not register before Core has cleared the registry. If Include order is reversed,
; registration simply waits until the next Present rather than being erased afterward.
if $\NuraUI\nura_ui_module_registry_initialized == 1 && $nura_ui_momentary_module_registered == 0
    run = CommandListNuraUIMomentaryRegister
endif
if $nura_ui_momentary_module_registered == 1 && $nura_ui_momentary_widgets_registered == 0
    run = CommandListNuraUIMomentaryRegisterWidgets
endif
if $nura_ui_momentary_module_registered == 1 && $nura_ui_momentary_widgets_registered == 1
    run = CommandListNuraUIMomentaryPersistWidgets
endif
if $nura_ui_momentary_module_registered == 1
    run = CommandListNuraUIMomentaryFrame
endif

[CommandListNuraUIMomentaryRegister]
local $nura_ui_momentary_prev_x68 = x68
x68 = $nura_ui_momentary_module_id
run = CustomShaderNuraUIMomentaryRegister
x68 = $nura_ui_momentary_prev_x68
store = $nura_ui_momentary_module_slot, ResourceNuraUIModuleMomentarySlot, 0
if $nura_ui_momentary_module_slot < 32
    $nura_ui_momentary_module_registered = 1
endif

[CustomShaderNuraUIMomentaryRegister]
cs = ..\..\Core\NuraUIModuleRegister.hlsl
cs-u0 = Resource\NuraUI\NuraUIModuleRegistry
cs-u1 = ResourceNuraUIModuleMomentarySlot
dispatch = 1, 1, 1
cs-u0 = null
cs-u1 = null

[CommandListNuraUIMomentaryPersistWidgets]
