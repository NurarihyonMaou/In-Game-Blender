[CommandListIrisKbmCaptureInput]
if $iris_kbm_capture_active == 1
    $iris_kbm_capture_code = $\NuraThings\KeyDetector\key_code
    $iris_kbm_captured_key = 0
    if $iris_kbm_capture_code == 56
        run = CommandListIrisKbmCaptureCancel
    else if $iris_kbm_capture_code >= 10 && $iris_kbm_capture_code <= 35
        $iris_kbm_captured_key = $iris_kbm_capture_code - 9
        run = CommandListIrisKbmCommitCapturedKey
    else if $iris_kbm_capture_code >= 79 && $iris_kbm_capture_code <= 104
        $iris_kbm_captured_key = $iris_kbm_capture_code - 78
        run = CommandListIrisKbmCommitCapturedKey
    else if $iris_kbm_capture_code >= 40 && $iris_kbm_capture_code <= 49
        $iris_kbm_captured_key = $iris_kbm_capture_code - 13
        run = CommandListIrisKbmCommitCapturedKey
    else if $iris_kbm_capture_code != 0
        $iris_kbm_capture_status = 2
    endif
    $\NuraThings\KeyDetector\key_code = 0
endif

[CommandListIrisKbmCommitCapturedKey]
if $iris_kbm_captured_key >= 1 && $iris_kbm_captured_key <= 36
    ; Enforce one binding per key: a newly captured key clears older duplicates.
    if $iris_kbm_capture_slot != 0 && $iris_kbm_bind_0_key == $iris_kbm_captured_key
        $iris_kbm_bind_0_key = 0
    endif
    if $iris_kbm_capture_slot != 1 && $iris_kbm_bind_1_key == $iris_kbm_captured_key
        $iris_kbm_bind_1_key = 0
    endif
    if $iris_kbm_capture_slot != 2 && $iris_kbm_bind_2_key == $iris_kbm_captured_key
