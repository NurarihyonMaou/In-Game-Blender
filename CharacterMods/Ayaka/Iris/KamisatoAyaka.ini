; ============================================================================
; GLOBAL
; ============================================================================

ResourceWritablePosition = copy ResourceKamisatoAyakaPosition

if $mesh_editor_weight_paint_initialized == 0
    ResourceMeshEditorEditableBlend = copy ResourceKamisatoAyakaBlend
    $mesh_editor_weight_paint_initialized = 1
endif

post run = CommandListMeshEditorBeginRestore

post ResourceDMap = copy_desc oD
post run = CustomShaderNukeJiggle

post run = CommandListMeshEditorMergeIBAndInitWeightAdjacency

; ============================================================================
; SHARED MASK DATA / MASK OPERATION SUPPORT
; ============================================================================

[ResourceMeshEditorNamedMasks]
type = RWBuffer
format = R32_FLOAT
array = (79355 * 8)
flags = SHADER_RESOURCE

[ResourceMeshEditorCombinedMask]
type = RWBuffer
format = R32_FLOAT
array = 79355
flags = SHADER_RESOURCE

; Smooth protection is applied by filtering the delta introduced by SmoothApply.
[ResourceMeshEditorVertexDeltaBeforeSmooth]
type = RWBuffer
format = R32G32B32A32_FLOAT
array = 79363
flags = SHADER_RESOURCE

[ResourceMeshEditorVertexDeltaMasked]
type = RWBuffer
format = R32G32B32A32_FLOAT
array = 79363
flags = SHADER_RESOURCE

[PoolMeshEditorStrokeMaskFlags]
pool_size = $mesh_editor_strokes_limit
pool_persist_variables = true

[PoolMeshEditorStrokeMaskFlagsValid]
pool_size = $mesh_editor_strokes_limit
pool_persist_variables = true

[CustomShaderMeshEditorCombineMasks]
cs = MeshEditorMVP/MeshEditorCombineMasks.hlsl
cs-t0 = copy ResourceMeshEditorNamedMasks
cs-u0 = ResourceMeshEditorCombinedMask
x38 = $mesh_editor_mask_flags_for_combine
dispatch = (79355 + 63) // 64, 1, 1
cs-t0 = null
cs-u0 = null

[CommandListMeshEditorCombineMasks]
$mesh_editor_mask_flags_for_combine = $mesh_editor_mask_active_flags
run = CustomShaderMeshEditorCombineMasks

[KeyFlagsOff]
key = '
$mesh_editor_mask_active_flags = 0

[ResourceMeshEditorVisibleDepth]
type = Texture2D
width = 64
height = 64
mips = 1
array = 1
msaa = 1
msaa_quality = 0
format = DXGI_FORMAT_R32G32B32A32_FLOAT
bind_flags = render_target shader_resource

[ResourceMeshEditorVisibleDepthStencil]
type = Texture2D
width = 64
height = 64
mips = 1
array = 1
msaa = 1
msaa_quality = 0
format = DXGI_FORMAT_D32_FLOAT
bind_flags = depth_stencil

; ============================================================================
; RADIUS
; ============================================================================

; ============================================================================
; MASK AND BRUSH HOTKEYS
; ============================================================================

[CommandListAddRadius]
$falloff_radius = $falloff_radius + 0.01

[CommandListLowerRadius]
$falloff_radius = $falloff_radius - 0.01

[KeyAddRadius]
condition = ($mesh_editor_cursor) && $\NuraUI\nt_mask_rename_active == 0
;key = MOUSE_WHEEL_UP
key = VK_XBUTTON1
run = CommandListAddRadius

[KeyLowerRadius]
condition = ($mesh_editor_cursor) && $\NuraUI\nt_mask_rename_active == 0
;key = MOUSE_WHEEL_DOWN
key = VK_XBUTTON2
run = CommandListLowerRadius

; ============================================================================
; MENU
; ============================================================================

[KeyMeshEditorMaskPrev]
condition = ($mesh_editor_enabled == 1 && $mesh_editor_stroke_active == 0 && $mesh_editor_restore_active == 0) && $\NuraUI\nt_mask_rename_active == 0
key = VK_F5
run = CommandListMeshEditorMaskPrev

[KeyMeshEditorMaskNext]
condition = ($mesh_editor_enabled == 1 && $mesh_editor_stroke_active == 0 && $mesh_editor_restore_active == 0) && $\NuraUI\nt_mask_rename_active == 0
key = VK_F7
run = CommandListMeshEditorMaskNext

[CommandListMeshEditorMaskPrev]
if $mesh_editor_active_mask_slot > 0
    $mesh_editor_active_mask_slot = $mesh_editor_active_mask_slot - 1
else
    $mesh_editor_active_mask_slot = 7
endif
run = CommandListMeshEditorLoadActiveMask

[CommandListMeshEditorMaskNext]
if $mesh_editor_active_mask_slot < 7
    $mesh_editor_active_mask_slot = $mesh_editor_active_mask_slot + 1
else
    $mesh_editor_active_mask_slot = 0
endif
run = CommandListMeshEditorLoadActiveMask

[KeyMeshEditorClearNamedMask]
condition = ($mesh_editor_enabled == 1 && $mesh_editor_tool == 7 && $mesh_editor_stroke_active == 0 && $mesh_editor_restore_active == 0) && $\NuraUI\nt_mask_rename_active == 0
key = VK_CONTROL VK_SHIFT X
run = CommandListMeshEditorClearNamedMask

[CommandListMeshEditorClearNamedMask]
$mesh_editor_mask_operation = 0
run = CommandListMeshEditorApplyMaskOperation

[KeyMeshEditorFillNamedMask]
condition = ($mesh_editor_enabled == 1 && $mesh_editor_tool == 7 && $mesh_editor_stroke_active == 0 && $mesh_editor_restore_active == 0) && $\NuraUI\nt_mask_rename_active == 0
